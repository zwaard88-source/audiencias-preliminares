<script type="application/json" id="datos">{"1": {"t": "Función del JCG en el proceso penal con tendencia acusatoria", "r": [{"h": "función del JCG", "p": [["", "Como punto de partida, conviene precisar que la función del JCG no se limita a verificar el cumplimiento de las formalidades previstas en la ley, sino que comprende un riguroso examen de constitucionalidad y legalidad sobre aquellas actuaciones ejercidas por la FGN y la Policía Judicial, que podrían limitar o, incluso, vulnerar derechos fundamentales. De allí que la función de control de garantías presenta serias discrepancias, tanto en términos de forma (ejecución de sus actuaciones) como de fondo (naturaleza de sus competencias), con respecto al rol del juez con función de conocimiento."]]}, {"h": "juez con funciones de control de garantías", "p": [["", "La figura del juez con funciones de control de garantías es propia del sistema penal acusatorio, la cual cumple un papel fundamental en el correcto desarrollo de los procedimientos penales, en tanto es garante de los derechos fundamentales de todas las partes involucradas en la causa [Sentencia T-643/16 (Corte Constitucional, 2016)]."], ["", "En palabras de la Corte Constitucional, una formulación coherente con la estructura de un proceso penal de tendencia acusatoria, como el que configura la Ley 906 de 2004, “exige que las discusiones relacionadas con la afectación de los derechos fundamentales del imputado, se resuelvan en el ámbito jurisdiccional” [Sentencia C- 979 de 2005 [(Corte Constitucional, 2005)]. Así pues, la salvaguarda de los derechos fundamentales del investigado, como función prioritaria adscrita al JCG, atiende a un necesario equilibrio con relación a la eficacia y funcionalidad de la administración de justicia penal (Sentencia C-591/05)."]]}, {"h": "Corte Constitucional (2014)", "p": [["", "En específico, la Corte Constitucional (2014) en Sentencia C-591 de 2014 concluyó que el Constituyente tuvo la voluntad de: (a) radicar en cabeza de los jueces de control de garantías la adopción de las medidas necesarias para asegurar la comparecencia de los imputados al proceso penal, de manera excepcional y previa regulación legal que incluya los límites y eventos en que procede, para que la Fiscalía proceda con la captura; (b) facultar directamente a la Fiscalía para adelantar registros, allanamientos, incautaciones e interceptación de comunicaciones, bajo el control posterior del JCG;"], ["", "(c) disponer un control previo por parte del JCG para todos los demás eventos en que, para el aseguramiento de los elementos materiales probatorios, se requiera medidas adicionales que impliquen afectación de derechos fundamentales."]]}, {"h": "control judicial ejercido por parte del JCG", "p": [["", "En suma, el control judicial ejercido por parte del JCG supone valorar la suficiencia de los elementos materiales probatorios, evidencia física e información legalmente obtenida que sustentan la solicitud elevada por la Fiscalía, al igual que la concurrencia de los presupuestos constitucionales y legales de procedencia, atendiendo a los estándares de justificación preestablecidos para cada tipo de audiencia."]]}], "ilus": "dialogo-carpeta.webp", "raiz": ""}, "3": {"t": "Articulación entre las comisarías de familia y la jurisdicción penal", "r": [{"h": "Ley 2126 de 2021", "p": [["", "Sobre este punto, es menester indicar que la investigación penal de los delitos relacionados con actos de violencia en el contexto familiar exige una actuación coordinada e interinstitucional entre las autoridades administrativas de protección (Comisarías de Familia) y las autoridades judiciales (FGN y Jueces de Control de Garantías)."], ["", "Con ocasión de la Ley 2126 de 2021, se reorganizó el funcionamiento de las Comisarías de Familia y se fijaron reglas claras de competencia y articulación, garantizando a las víctimas un acceso inmediato a medidas de protección, sin que los trámites administrativos o las discusiones en torno a la competencia supongan barreras de acceso a la justicia ni incrementen el riesgo para su vida e integridad personal."]]}, {"h": "artículo 20 de la Ley 2126", "p": [["", "El artículo 20 de la Ley 2126 de 2021 establece que toda persona víctima de violencia en el contexto familiar —sin perjuicio de las denuncias penales a que hubiere lugar— puede acudir ante cualquier Comisaría de Familia para solicitar de manera inmediata una medida de protección que ponga fin a la agresión o la evite en casos de riesgo inminente."], ["", "No obstante, el ámbito de protección de la norma no se circunscribe a las actuaciones ante las Comisarías de Familia, pues contempla la adopción provisional e inmediata de medidas de protección por parte de las autoridades judiciales que conozcan de los delitos relacionados con este tipo de violencia."]]}, {"h": "jueces con función de control", "p": [["", "En particular, los jueces con función de control de garantías pueden adoptar las medidas de protección previstas en el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, cuando estas sean solicitadas por el fiscal o por la víctima. A su vez, la norma bajo estudio faculta a la FGN para solicitar al comisario o comisaria de familia la adopción inmediata de medidas de protección en favor de la víctima, cuando, de manera debidamente justificada, “considere que es la vía más expedita”."]]}, {"h": "artículo 17 de la Ley 1257 de 2008", "p": [["", "En efecto, el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, establece ciertas medidas de protección susceptibles de adopción por parte de la autoridad competente, en consideración a las situaciones de violencia intrafamiliar; las cuales proporcionan, entre otros, elementos fácticos y probatorios determinantes al momento de sustentar la necesidad de una medida de aseguramiento."], ["", "Entre ellas se encuentran, por ejemplo, la prohibición al agresor de aproximarse a la víctima, el desalojo del agresor de la casa de habitación que comparte con la víctima, el tratamiento reeducativo y terapéutico en una institución pública o privada a costa del agresor, el acompañamiento especial de la víctima por parte de las autoridades de policía y cualquier otra medida necesaria para alcanzar los objetivos de protección previstos por la ley."]]}], "ilus": "fundamento-documento.webp", "raiz": ""}, "8": {"t": "Enfoque territorial", "r": [{"h": "relaciones e interacciones sociales, económicas y políticas", "p": [["", "Estudia las relaciones e interacciones sociales, económicas y políticas que las personas y las comunidades establecen con un espacio determinado. Reconoce que el territorio es dinámico y que las formas de habitarlo, apropiarlo y relacionarse con él inciden en la comprensión de los hechos y en el desarrollo de la investigación penal."]]}, {"h": "actuación de la FGN", "p": [["", "Particularmente, la actuación de la FGN en el marco del enfoque de género exige el cumplimiento riguroso del deber de debida diligencia reforzada y oficiosidad, entendiendo que la investigación y judicialización de la violencia sexual y de las VBG constituyen una obligación imperativa del Estado que debe activarse de oficio, de manera seria e imparcial, sin condicionarse la investigación a impulsos externos (FGN, Directiva 001 de 2026)."], ["", "Asimismo, la dirección de las audiencias preliminares y la valoración probatoria deben estar estrictamente exentas de prejuicios, precomprensiones y estereotipos de género, proscribiendo cualquier descalificación fundada en la vida personal o sexual de la víctima, su conducta o la oportunidad en que formuló la denuncia (FGN, 2022)."]]}, {"h": "centralidad de sus derechos", "p": [["", "En este contexto, se garantiza la centralidad de sus derechos y la prevención de la victimización secundaria mediante un trato digno que evite interrogatorios invasivos, moralizantes o confrontaciones innecesarias, otorgando credibilidad a su relato bajo el principio de buena fe y adelantando las labores técnicas de corroboración probatoria de forma proporcional, rigurosa y razonable para prevenir actuaciones arbitrarias (FGN, Directiva 001 de 2026)."]]}], "ilus": "p-lee-libro-2.webp", "raiz": ""}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se
   lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana pequeña junto a ella.
   Texto literal de la escena: datos[m] = {t: título, raiz: texto del nodo central ('' si Genially ya lo dice), ilus, r: [{h: rótulo,
   p: [[clase, texto], …]}]}.
   Tercera pasada (Sebastián, 24/11/2026): en la franja ancha de Genially el mapa va con la idea al centro y las ramas a los dos
   lados; el rótulo que ya está en el arranque del párrafo no se repite (va resaltado dentro del texto); el nodo central no repite
   el título de la diapositiva; la última parte de una ventana lleva al concepto siguiente o termina (no hay botón que no lleve a nada). */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var e = document.createElement(resumen ? 'button' : 'div'); e.className = 'rama' + (leidos[k] ? ' visto' : '');
      if (resumen) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      var breve = !resumen && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '"><span class="num">' + (k + 1) + '</span><span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin"><span class="num">' + (k + 1) + '</span><span>' + marca(resumen ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3><span class="num">' + (k + 1) + '</span><span>' + esc(may(r.h)) + '</span></h3>') +
        (resumen ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (resumen) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58);
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return actual.k < N - 1
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (actual.k + 2) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = actual.k + 1; if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    if (ult) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight, ew = e.offsetWidth;
    /* al lado de la rama si hay sitio (en la franja ancha casi siempre lo hay); si no, debajo o encima */
    var gx, gy = Math.max(8, Math.min(H - gh - 8, y + e.offsetHeight / 2 - gh / 2));
    if (x + ew + 10 + gw <= W - 8) gx = x + ew + 10;
    else if (x - 10 - gw >= 8) gx = x - 10 - gw;
    else { gx = Math.min(Math.max(10, x + ew / 2 - gw / 2), W - gw - 10); gy = y + e.offsetHeight + 6; if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6); if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) gy = Math.max(8, Math.min(H - gh - 8, y)); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
</script>
