<script type="application/json" id="contenido">{"juego": {"clave": "ap-juego-u1-l3", "niveles": ["Observador", "Analista", "Garante de la audiencia", "Referente en audiencias"]}, "ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#2F4F45", "teal": "#587E6D", "oxido": "#2F4F45", "coral": "#C8754F", "crema": "#F6DDCB", "niebla": "#E3EDE7", "hielo": "#F7F5EF", "celeste": "#CFE0D6", "madera": "#587E6D", "piso": "#CFE0D6", "gris": "#CFE0D6", "amarillo": "#C8754F"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 3", "unit": 1, "lesson": 3, "heading": "Lección 3. Clasificación de las audiencias preliminares nominadas y competencias del JCG", "scenes": [{"layout": "esquema", "segmentos": ["Como punto de partida, conviene precisar que la función del JCG no se limita a verificar el cumplimiento de las formalidades previstas en la ley, sino que comprende un riguroso examen de constitucionalidad y legalidad sobre aquellas actuaciones ejercidas por la FGN y la Policía Judicial, que podrían limitar o, incluso, vulnerar derechos fundamentales. De allí que la función de control de garantías presenta serias discrepancias, tanto en términos de forma (ejecución de sus actuaciones) como de fondo (naturaleza de sus competencias), con respecto al rol del juez con función de conocimiento.", "La figura del juez con funciones de control de garantías es propia del sistema penal acusatorio, la cual cumple un papel fundamental en el correcto desarrollo de los procedimientos penales, en tanto es garante de los derechos fundamentales de todas las partes involucradas en la causa [Sentencia T-643/16 (Corte Constitucional, 2016)].", "En palabras de la Corte Constitucional, una formulación coherente con la estructura de un proceso penal de tendencia acusatoria, como el que configura la Ley 906 de 2004, “exige que las discusiones relacionadas con la afectación de los derechos fundamentales del imputado, se resuelvan en el ámbito jurisdiccional” [Sentencia C- 979 de 2005 [(Corte Constitucional, 2005)]. Así pues, la salvaguarda de los derechos fundamentales del investigado, como función prioritaria adscrita al JCG, atiende a un necesario equilibrio con relación a la eficacia y funcionalidad de la administración de justicia penal (Sentencia C-591/05).", "En específico, la Corte Constitucional (2014) en Sentencia C-591 de 2014 concluyó que el Constituyente tuvo la voluntad de: (a) radicar en cabeza de los jueces de control de garantías la adopción de las medidas necesarias para asegurar la comparecencia de los imputados al proceso penal, de manera excepcional y previa regulación legal que incluya los límites y eventos en que procede, para que la Fiscalía proceda con la captura; (b) facultar directamente a la Fiscalía para adelantar registros, allanamientos, incautaciones e interceptación de comunicaciones, bajo el control posterior del JCG;", "(c) disponer un control previo por parte del JCG para todos los demás eventos en que, para el aseguramiento de los elementos materiales probatorios, se requiera medidas adicionales que impliquen afectación de derechos fundamentales.", "En suma, el control judicial ejercido por parte del JCG supone valorar la suficiencia de los elementos materiales probatorios, evidencia física e información legalmente obtenida que sustentan la solicitud elevada por la Fiscalía, al igual que la concurrencia de los presupuestos constitucionales y legales de procedencia, atendiendo a los estándares de justificación preestablecidos para cada tipo de audiencia."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "función del JCG", "segs": [0], "obj": "escudo"}, {"label": "juez con funciones de control de garantías", "segs": [1, 2], "obj": "libros"}, {"label": "Corte Constitucional (2014)", "segs": [3, 4], "obj": "personas"}, {"label": "control judicial ejercido por parte del JCG", "segs": [5], "obj": "tribunal"}]}], "rotulo": null, "seccion": "3.1. Función del JCG en el proceso penal con tendencia acusatoria", "grupo": null, "titulos_fuente": ["3.1. Función del JCG en el proceso penal con tendencia acusatoria"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["función del JCG", "juez con funciones de control de garantías", "Corte Constitucional (2014)", "control judicial ejercido por parte del JCG"], "titulo_genially": "Función del JCG en el proceso penal con tendencia acusatoria (1 de 2)", "ilustracion": "clasificacion-carpetas.webp", "relleno": "terminos-reloj.webp", "arte": {"img": "clasificacion-carpetas.webp", "pos": "fondo"}, "escenario": {"bioma": "centro", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "ventanaAmplia": true}, {"layout": "puntos", "segmentos": ["Precisamente, la diversidad de escenarios que pueden presentarse durante la investigación penal; así como, la variedad de actuaciones que requieren un determinado control judicial permite clasificar las audiencias preliminares en distintas categorías. Desde esta perspectiva, y lejos de la enunciación preliminar del artículo 154 del CPP, es posible clasificar este tipo de actos judiciales en, al menos, cuatro grandes grupos:", "(a) audiencias relacionadas con la libertad personal y la vinculación al proceso, (b) audiencias para la autorización y control de técnicas de investigación, (c) audiencias relacionadas con medidas cautelares reales y (d) audiencias para la protección de derechos y el desarrollo de la investigación.", "Por un lado, las audiencias relacionadas con la libertad personal y la vinculación al proceso comprenden, principalmente, aquellas reguladas en los artículos 286 a 318 de la Ley 906 de 2004, referidas a la formulación de imputación, la captura, la legalización de la captura, la imposición, sustitución, revocatoria y solicitud de libertad derivada de las medidas de aseguramiento.", "Por otro lado, las audiencias orientadas a la autorización y control judicial de técnicas de investigación encuentran fundamento en las disposiciones que regulan los actos investigativos que afectan derechos fundamentales, esto es, los artículos 213 a 245 y demás normas concordantes del CPP, relativas al registro y allanamiento, la retención de correspondencia, la interceptación de comunicaciones, la recuperación de información producto de la transmisión de datos, la búsqueda selectiva en bases de datos, la vigilancia y seguimiento de personas y otras técnicas de investigación.", "A su turno, las audiencias asociadas con medidas cautelares reales se encuentran reguladas en los artículos 82 a 101 de la Ley 906 de 2004, y tienen como propósito garantizar la reparación integral de las víctimas, el comiso de bienes y la eficacia de las decisiones judiciales.", "Finalmente, las audiencias para la protección de derechos y el desarrollo de la investigación comprenden aquellas actuaciones judiciales previstas para la salvaguarda de los derechos de las partes e intervinientes, así como para el adecuado desarrollo del proceso penal, como ocurre, entre otras, con la práctica de prueba anticipada prevista en el artículo 284 del CPP y las demás actuaciones cuya competencia se atribuye al JCG.", "En relación con la intervención del fiscal en las audiencias preliminares, esta clasificación permite advertir que sus principales tareas pueden sintetizarse en dos: (a) determinar el objeto central de la audiencia, así como (b) identificar los problemas jurídicos que en ella deben ser abordados. La resolución de estas cuestiones atinentes a la respectiva audiencia pende, en buena medida, de la claridad y precisión con la que la Fiscalía formule y sustente sus planteamientos.", "Para ello, deberá considerar de manera articulada los aspectos fácticos, probatorios y jurídicos relevantes del caso, a efectos de fundamentar adecuadamente sus actuaciones y solicitudes (lo cual se verá más adelante, en la Lección 4 de la Unidad 4)."], "parrafo": [0, 2, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "diversidad de escenarios", "segs": [0, 1], "obj": "tribunal"}, {"label": "audiencias relacionadas con la libertad personal", "segs": [2, 3], "obj": "puertaCerrada"}, {"label": "audiencias asociadas con medidas cautelares reales", "segs": [4, 5], "obj": "libros"}, {"label": "intervención del fiscal en las audiencias preliminares", "segs": [6, 7], "obj": "documento"}]}], "rotulo": null, "seccion": "3.1. Función del JCG en el proceso penal con tendencia acusatoria", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["diversidad de escenarios", "audiencias relacionadas con la libertad personal", "audiencias asociadas con medidas cautelares reales", "intervención del fiscal en las audiencias preliminares"], "titulo_genially": "Función del JCG en el proceso penal con tendencia acusatoria (2 de 2)", "ilustracion": "captura-detenido.webp", "relleno": "investigacion-lupa.webp", "ventanaAmplia": true}, {"layout": "esquema", "segmentos": ["Sobre este punto, es menester indicar que la investigación penal de los delitos relacionados con actos de violencia en el contexto familiar exige una actuación coordinada e interinstitucional entre las autoridades administrativas de protección (Comisarías de Familia) y las autoridades judiciales (FGN y Jueces de Control de Garantías).", "Con ocasión de la Ley 2126 de 2021, se reorganizó el funcionamiento de las Comisarías de Familia y se fijaron reglas claras de competencia y articulación, garantizando a las víctimas un acceso inmediato a medidas de protección, sin que los trámites administrativos o las discusiones en torno a la competencia supongan barreras de acceso a la justicia ni incrementen el riesgo para su vida e integridad personal.", "El artículo 20 de la Ley 2126 de 2021 establece que toda persona víctima de violencia en el contexto familiar —sin perjuicio de las denuncias penales a que hubiere lugar— puede acudir ante cualquier Comisaría de Familia para solicitar de manera inmediata una medida de protección que ponga fin a la agresión o la evite en casos de riesgo inminente.", "No obstante, el ámbito de protección de la norma no se circunscribe a las actuaciones ante las Comisarías de Familia, pues contempla la adopción provisional e inmediata de medidas de protección por parte de las autoridades judiciales que conozcan de los delitos relacionados con este tipo de violencia.", "En particular, los jueces con función de control de garantías pueden adoptar las medidas de protección previstas en el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, cuando estas sean solicitadas por el fiscal o por la víctima. A su vez, la norma bajo estudio faculta a la FGN para solicitar al comisario o comisaria de familia la adopción inmediata de medidas de protección en favor de la víctima, cuando, de manera debidamente justificada, “considere que es la vía más expedita”.", "En efecto, el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, establece ciertas medidas de protección susceptibles de adopción por parte de la autoridad competente, en consideración a las situaciones de violencia intrafamiliar; las cuales proporcionan, entre otros, elementos fácticos y probatorios determinantes al momento de sustentar la necesidad de una medida de aseguramiento.", "Entre ellas se encuentran, por ejemplo, la prohibición al agresor de aproximarse a la víctima, el desalojo del agresor de la casa de habitación que comparte con la víctima, el tratamiento reeducativo y terapéutico en una institución pública o privada a costa del agresor, el acompañamiento especial de la víctima por parte de las autoridades de policía y cualquier otra medida necesaria para alcanzar los objetivos de protección previstos por la ley."], "parrafo": [0, 2, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Ley 2126 de 2021", "segs": [0, 1], "obj": "libros"}, {"label": "artículo 20 de la Ley 2126", "segs": [2, 3], "obj": "escudo"}, {"label": "jueces con función de control", "segs": [4], "obj": "comisaria"}, {"label": "artículo 17 de la Ley 1257 de 2008", "segs": [5, 6], "obj": "documento"}]}], "rotulo": null, "seccion": "3.2 Articulación entre las comisarías de familia y la jurisdicción penal", "grupo": null, "titulos_fuente": ["3.2 Articulación entre las comisarías de familia y la jurisdicción penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Ley 2126 de 2021", "artículo 20 de la Ley 2126", "jueces con función de control", "artículo 17 de la Ley 1257 de 2008"], "titulo_genially": "Articulación entre las comisarías de familia y la jurisdicción penal", "ilustracion": "p-alto-documento-2.webp", "relleno": "trio-dialogo.webp", "arte": {"img": "p-alto-documento-2.webp", "pos": "izq"}, "escenario": {"bioma": "sala", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "ventanaAmplia": true}, {"layout": "acordeon", "segmentos": ["La adecuada comprensión e interpretación de las audiencias preliminares y, en general, de las actuaciones de los jueces y fiscales exige aproximarse a un marco conceptual diferenciado en torno a las dinámicas de violencia y discriminación al interior del proceso judicial. Este andamiaje teórico permite identificar las asimetrías de poder, visibilizar a los sujetos de especial protección constitucional y articular las distintas medidas de prevención y protección, desde una perspectiva garantista e incluyente.", "A continuación, se presentan los enfoques diferencial, interseccional y territorial que orientan la actuación de la Fiscalía General de la Nación en la investigación penal, de conformidad con la Guía para la incorporación del Enfoque Diferencial, Interseccional y Territorial (EDIT) en la investigación penal – Parte I (FGN, s. f., pp. 22-23 y 77):"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "marco conceptual diferenciado", "segs": [0], "obj": "escudo"}, {"label": "enfoques diferencial, interseccional y territorial", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "3.3 aplicación del enfoque de género en las audiencias preliminares", "grupo": null, "titulos_fuente": ["3.3 aplicación del enfoque de género en las audiencias preliminares"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["marco conceptual diferenciado", "enfoques diferencial, interseccional y territorial"], "titulo_genially": "aplicación del enfoque de género en las audiencias preliminares", "ilustracion": "p-dialogo-carpeta.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-dialogo-carpeta.webp", "pos": "der"}, "ventanaAmplia": true}, {"layout": "fichas", "segmentos": ["Permite reconocer cómo las características y necesidades particulares de las personas y los grupos poblacionales inciden en el ejercicio y la garantía de sus derechos, así como en los riesgos específicos de vulneración. Su aplicación exige identificar las situaciones de discriminación y adoptar medidas y ajustes que garanticen la igualdad y la no discriminación durante la atención, la investigación y la judicialización.", "Este enfoque comprende, entre otros, los siguientes aspectos:", "Género: Analiza las diferencias y relaciones sociales construidas entre mujeres y hombres, así como las asimetrías de poder que pueden generar subordinación y violencia. Las autoridades deben trabajar para modificar los patrones que normalizan esta violencia y desafiar las estructuras de poder asimétricas basadas en el género.", "Orientación sexual, identidad y expresión de género: Permite identificar las relaciones de poder derivadas del sistema heterosexual y cisgénero, así como las violencias y formas de discriminación contra personas con identidades y expresiones de género u orientaciones sexuales diversas."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "características y necesidades particulares", "segs": [0], "obj": "escudo"}, {"label": "siguientes aspectos", "segs": [1], "obj": "documento"}, {"label": "Género", "segs": [2], "obj": "carpetas"}, {"label": "Orientación sexual, identidad y expresión de género", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "1. Enfoque diferencial", "grupo": null, "titulos_fuente": ["1. Enfoque diferencial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["características y necesidades particulares", "siguientes aspectos", "Género", "Orientación sexual, identidad y expresión de género"], "titulo_genially": "Enfoque diferencial (1 de 2)", "ilustracion": "trio-dialogo.webp", "relleno": "alto-documento.webp", "arte": {"img": "trio-dialogo.webp", "pos": "izq"}, "ventanaAmplia": true}, {"layout": "rejilla", "segmentos": ["Discapacidad: Reconoce a las personas con deficiencias físicas, mentales, intelectuales o sensoriales a largo plazo que, al interactuar con diversas barreras, pueden ver obstaculizada su participación plena y efectiva en la sociedad, en igualdad de condiciones con las demás personas.", "Ciclo vital o curso de vida: Permite comprender el impacto diferenciado que tienen las distintas etapas de la vida en el ejercicio y goce de los derechos.", "Étnico-indígena: Reconoce y protege la diversidad étnica y cultural de los pueblos indígenas, sus lenguas, cosmovisiones, costumbres y formas de expresión.", "Étnico-antirracista: Reconoce la existencia de discriminación estructural por motivos raciales y la diversidad de las personas negras, afrodescendientes, raizales y palenqueras (NARP). Busca identificar y abordar las manifestaciones de racismo y sus efectos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Discapacidad", "segs": [0], "obj": "reloj", "ilus": "n-u1l3e06t1.webp"}, {"label": "Ciclo vital o curso de vida", "segs": [1], "obj": "escalones", "ilus": "n-u1l3e06t2.webp"}, {"label": "Étnico-indígena", "segs": [2], "obj": "documento", "ilus": "n-u1l3e06t3.webp"}, {"label": "Étnico-antirracista", "segs": [3], "obj": "lupa", "ilus": "n-u1l3e06t4.webp"}]}], "rotulo": null, "seccion": "1. Enfoque diferencial", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Discapacidad", "Ciclo vital o curso de vida", "Étnico-indígena", "Étnico-antirracista"], "titulo_genially": "Enfoque diferencial (2 de 2)", "ilustracion": "p-lee-libro-2.webp", "relleno": "trio-dialogo.webp", "ventanaAmplia": true}, {"layout": "lamina", "segmentos": ["Permite analizar la confluencia de dos o más categorías de discriminación en una misma persona o grupo de personas y las interacciones que se producen entre ellas. No se trata de sumar distintas formas de discriminación, sino de comprender cómo su interacción genera experiencias particulares y puede intensificar la vulneración de derechos y las afectaciones a la dignidad humana. Por ejemplo, la situación de una mujer negra con discapacidad que vive en Quibdó requiere considerar cómo interactúan su género, pertenencia étnico-racial, discapacidad y contexto territorial."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "confluencia de dos o más categorías de discriminación", "segs": [0], "obj": "escudo", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "2. Enfoque interseccional", "grupo": null, "titulos_fuente": ["2. Enfoque interseccional"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["confluencia de dos o más categorías de discriminación"], "titulo_genially": "Enfoque interseccional", "ilustracion": "p-trio-3.webp", "relleno": "clasificacion-carpetas.webp", "ventanaAmplia": true}, {"layout": "esquema", "segmentos": ["Estudia las relaciones e interacciones sociales, económicas y políticas que las personas y las comunidades establecen con un espacio determinado. Reconoce que el territorio es dinámico y que las formas de habitarlo, apropiarlo y relacionarse con él inciden en la comprensión de los hechos y en el desarrollo de la investigación penal.", "Particularmente, la actuación de la FGN en el marco del enfoque de género exige el cumplimiento riguroso del deber de debida diligencia reforzada y oficiosidad, entendiendo que la investigación y judicialización de la violencia sexual y de las VBG constituyen una obligación imperativa del Estado que debe activarse de oficio, de manera seria e imparcial, sin condicionarse la investigación a impulsos externos (FGN, Directiva 001 de 2026).", "Asimismo, la dirección de las audiencias preliminares y la valoración probatoria deben estar estrictamente exentas de prejuicios, precomprensiones y estereotipos de género, proscribiendo cualquier descalificación fundada en la vida personal o sexual de la víctima, su conducta o la oportunidad en que formuló la denuncia (FGN, 2022).", "En este contexto, se garantiza la centralidad de sus derechos y la prevención de la victimización secundaria mediante un trato digno que evite interrogatorios invasivos, moralizantes o confrontaciones innecesarias, otorgando credibilidad a su relato bajo el principio de buena fe y adelantando las labores técnicas de corroboración probatoria de forma proporcional, rigurosa y razonable para prevenir actuaciones arbitrarias (FGN, Directiva 001 de 2026)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "relaciones e interacciones sociales, económicas y políticas", "segs": [0], "obj": "lupa"}, {"label": "actuación de la FGN", "segs": [1, 2], "obj": "documento"}, {"label": "centralidad de sus derechos", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "3. Enfoque territorial", "grupo": null, "titulos_fuente": ["3. Enfoque territorial"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["relaciones e interacciones sociales, económicas y políticas", "a
