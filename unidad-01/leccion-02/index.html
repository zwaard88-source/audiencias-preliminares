<script type="application/json" id="contenido">{"juego": {"clave": "ap-juego-u1-l2", "niveles": ["Observador", "Analista", "Garante de la audiencia", "Referente en audiencias"]}, "ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#2F4F45", "teal": "#587E6D", "oxido": "#2F4F45", "coral": "#C8754F", "crema": "#F6DDCB", "niebla": "#E3EDE7", "hielo": "#F7F5EF", "celeste": "#CFE0D6", "madera": "#587E6D", "piso": "#CFE0D6", "gris": "#CFE0D6", "amarillo": "#C8754F"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 2", "unit": 1, "lesson": 2, "heading": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "scenes": [{"layout": "esquema", "segmentos": ["Las audiencias preliminares corresponden a escenarios procesales propios del sistema penal acusatorio en los que se someten a consideración del juez determinadas actuaciones y decisiones que, por su naturaleza o incidencia en los derechos de los sujetos procesales, requieren intervención judicial.", "De esta manera, como expresión concreta de la función de garantía atribuida al JCG, constituyen un mecanismo fundamental para articular las necesidades propias de la investigación penal con el respeto de las garantías constitucionales, asegurando que las actuaciones de los sujetos procesales se desarrollen dentro de los límites establecidos por la CN y la ley.", "La función jurisdiccional, exclusiva de los jueces de la República, debe estar guiada por los principios constitucionales que, bajo ciertas generalidades, regulan la administración de justicia. Las actuaciones ante jueces con función de control de garantía, propias de la Ley 906 de 2004, no son la excepción: resulta de vital importancia que el fiscal, al momento de someter sus actuaciones al control judicial, ejerza un examen perspicaz en torno a estos mandatos superiores.", "Por consiguiente, el fiscal debe encontrarse en la capacidad de explicar, por ejemplo, la legalidad (en sentido amplio) y la proporcionalidad del acto investigativo, con miras a que el juez pueda conceder la respectiva autorización."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "escenarios procesales propios del sistema penal acusatorio", "segs": [0, 1], "obj": "escudo"}, {"label": "función jurisdiccional", "segs": [2, 3], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["escenarios procesales propios del sistema penal acusatorio", "función jurisdiccional"], "titulo_genially": "Finalidad, principios y garantías que orientan las audiencias preliminares (1 de 4)", "ilustracion": "dialogo-carpeta.webp", "relleno": "explica-brazos.webp", "arte": {"img": "dialogo-carpeta.webp", "pos": "fondo"}, "escenario": {"bioma": "audiencia", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "ventanaAmplia": true}, {"layout": "rejilla", "segmentos": ["En consecuencia, el desarrollo de las audiencias preliminares se encuentra sujeto a un conjunto de principios y garantías que delimitan el ejercicio de las facultades de los sujetos procesales y orientan la actuación del JCG. En este marco, además de aludir a principios derivados del orden constitucional de necesaria aplicación (legalidad, el debido proceso, la dignidad humana, entre otros), es pertinente señalar cuatro principios constitucionales que, para efectos de limitar la facultad de intervención punitiva del Estado (garantías), resultan de especial relevancia.", "El precedente de la Sentencia C-1092 de 2003 (Corte Constitucional, 2003), reiterado en el precedente C-591 de 2005 (Corte Constitucional, 2005), los aborda de la siguiente forma:", "Presunción de inocencia: Se exige al ente acusador que cuente con los suficientes elementos materiales de prueba que soporten la existencia de una sospecha razonable inicial, a fin de dar inicio a una investigación; así como, que pueda desvirtuar esta presunción atendiendo al estándar probatorio de más allá de toda duda.", "Principio de no autoincriminación: Es una garantía procesal que impide que una persona esté obligada a declarar contra sí misma o a proporcionar medios de pruebas que le perjudiquen, la cual implica el derecho a guardar silencio, sin que ello signifique una prueba en su contra. Puntualmente, se tiene que, desde la indagación, el ciudadano debe ser informado de esta garantía y, en especial, al momento de la captura, con el fin de que decida si renuncia o hace uso de ella o renuncia y colabora con la administración de justicia.", "Como se verá adelante, en otros casos, la ley exige la asistencia de un defensor de confianza o de un defensor público [Sentencias C-591/05 (Corte Constitucional, 2005) y C-210/07 (Corte Constitucional, 2007)].", "Principio de celeridad: El sistema de administración de justicia debe producir decisiones prontas, sin dilaciones injustificadas. De lo contrario, la falta de definición de situaciones jurídicas resulta en un “acto injusto” (Consejo Superior de la Judicatura, 2008, p. 26).", "Principio de Proporcionalidad: Orienta la ponderación como límite a todas las afectaciones de los derechos fundamentales, teniendo en cuenta que, tanto el juez como el fiscal deben examinar si los actos de investigación adelantados, a través de los cuales se obtuvieron medios cognoscitivos, responden a los fines constitucionales que rigen el proceso penal en Colombia, de manera proporcionada. Dicho examen de ponderación, a su vez, comprende tres subprincipios:"], "parrafo": [0, 2, 3, 5, 6], "vineta": [2, 3, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "desarrollo de las audiencias preliminares", "segs": [0, 1], "obj": "escudo", "ilus": "n-u1l2e02t1.webp"}, {"label": "Presunción de inocencia", "segs": [2], "obj": "lupa", "ilus": "n-u1l2e02t2.webp"}, {"label": "Principio de no autoincriminación", "segs": [3, 4], "obj": "expediente", "ilus": "n-u1l2e02t3.webp"}, {"label": "Principio de celeridad", "segs": [5], "obj": "documento", "ilus": "n-u1l2e02t4.webp"}, {"label": "Principio de Proporcionalidad", "segs": [6], "obj": "tribunal", "ilus": "n-u1l2e02t5.webp"}]}], "rotulo": null, "seccion": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["desarrollo de las audiencias preliminares", "Presunción de inocencia", "Principio de no autoincriminación", "Principio de celeridad", "Principio de Proporcionalidad"], "titulo_genially": "Finalidad, principios y garantías que orientan las audiencias preliminares (2 de 4)", "ilustracion": "lee-libro-explica.webp", "relleno": "terminos-reloj.webp", "ventanaAmplia": true}, {"layout": "puntos", "segmentos": ["(a) fin legítimo: consiste en que la actuación que incide sobre un derecho fundamental persiga una finalidad constitucionalmente admisible y jurídicamente autorizada (Fiscalía General de la Nación, 2020, p.17). En el ámbito de la investigación penal, esto supone que la afectación de derechos esté orientada a la consecución de fines propios de la administración de justicia y de la investigación de conductas punibles, como esclarecer los hechos, identificar a sus posibles responsables y obtener elementos materiales probatorios y evidencia física.", "Por ejemplo, la interceptación de comunicaciones debe estar dirigida a obtener información relevante para una investigación penal y cumplir los presupuestos legales que autorizan su práctica.", "Por su parte, en materia de medidas de aseguramiento, la restricción de la libertad debe perseguir alguna de las finalidades previstas en el artículo 250.1 de la Constitución y el artículo 296 de la Ley 906 de 2004: (i) asegurar la comparecencia de los imputados al proceso penal; (ii) conservar las pruebas; o (iii) proteger a la comunidad y a las víctimas.", "(b) idoneidad o utilidad: contribuir a la obtención de un fin constitucionalmente legítimo (hallazgo de una prueba relevante, por ejemplo);", "(c) necesidad: cuando no se pueda acceder a otro medio menos gravoso que permita obtener el mismo resultado, será legítima la intervención;"], "parrafo": [0, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "(a) fin legítimo", "segs": [0, 1], "obj": "lupa"}, {"label": "medidas de aseguramiento", "segs": [2], "obj": "puertaAbierta"}, {"label": "(b) idoneidad o utilidad", "segs": [3], "obj": "expediente"}, {"label": "(c) necesidad", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["(a) fin legítimo", "medidas de aseguramiento", "(b) idoneidad o utilidad", "(c) necesidad"], "titulo_genially": "Finalidad, principios y garantías que orientan las audiencias preliminares (3 de 4)", "ilustracion": "sustentacion-audiencia.webp", "relleno": "dialogo-carpeta.webp", "ventanaAmplia": true}, {"layout": "fichas", "segmentos": ["(d) proporcionalidad (en estricto sentido): busca equilibrar, en sus justas medidas, aquellos intereses de rango constitucional en conflicto: de un lado, la administración de justicia y, del otro, la esfera individual del implicado. Dentro de los criterios que subyacen a este juicio, se encuentran (a) las consecuencias jurídicas de las conductas investigadas, (b) la importancia de la causa que se ventila, en donde no sólo el quantum de la pena no es criterio suficiente, sino también las circunstancias del caso, la intensidad de la actuación del sospechoso, las modalidades en que se cometió el delito y la naturaleza del bien jurídico tutelado;", "(c) las exigencias de la política criminal propias del principio de Derecho penal mínimo, a fin de identificar si se trata de conductas que lesionan las condiciones de supervivencia social.", "No obstante, en cuanto a este último punto, merece la pena indicar que también es posible acudir a criterios para resolver un conflicto entre derechos fundamentales. Al margen del principio de proporcionalidad —método recomendado para aquellos casos en que se hace necesaria la restricción o limitación a un derecho fundamental—, existen otros dos métodos para solucionar tensiones entre bienes o valores constitucionalmente protegidos: ponderación de bienes y juicio de razonabilidad.", "El primero, se trata de una actuación o un procedimiento propio del intérprete, en busca de la armonización de las normas constitucionales, no tratándose así de un principio de interpretación en sentido estricto (carece de un criterio orientador para efectos de valoración).", "El segundo, en contraste, se relaciona con un método intermedio entre la deducción estricta y la decisión política, y procede en aquellas ocasiones en las que resulta factible sacrificar alguna de las reglas de la racionalidad (respeto íntegro por la lógica formal), para así lograr una argumentación considerada válida en Derecho. Por supuesto, existen supuestos en los que, con la aplicación directa de la racionalidad, es posible llegar a soluciones no deseables, manifiestamente injustas o contrarias a los valores que preserva el Derecho objetivo; eventos que pretenden ser evitados con el juicio de razonabilidad."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "(d) proporcionalidad (en estricto sentido)", "segs": [0, 1], "obj": "documento"}, {"label": "criterios para resolver un conflicto entre derechos fundamentales", "segs": [2, 3], "obj": "escudo"}, {"label": "método intermedio entre la deducción estricta y la decisión política", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["(d) proporcionalidad (en estricto sentido)", "criterios para resolver un conflicto entre derechos fundamentales", "método intermedio entre la deducción estricta y la decisión política"], "titulo_genially": "Finalidad, principios y garantías que orientan las audiencias preliminares (4 de 4)", "ilustracion": "dialogo-carpeta.webp", "relleno": "explica-brazos.webp", "arte": {"img": "dialogo-carpeta.webp", "pos": "izq"}, "ventanaAmplia": true}, {"layout": "actividad", "segmentos": ["Aplicación al expediente del curso", "En el caso de Beatriz Elena Morales, la Fiscalía considera pertinente obtener información relacionada con el número telefónico desde el cual se enviaron los mensajes, para avanzar en la identificación de los posibles responsables. Al evaluar la proporcionalidad de esta actuación, debe establecer:", "A. Que la información solicitada permita identificar al titular de la línea, que su obtención no implique una demora significativa y que existan recursos técnicos para procesarla.", "B. Que la gravedad de las amenazas justifique la obtención de información telefónica, que la medida contribuya al esclarecimiento de los hechos y que su práctica no afecte de manera sustancial la investigación.", "C. Que la medida persiga una finalidad constitucionalmente legítima, sea idónea para alcanzarla, resulte necesaria por no existir otra alternativa menos restrictiva y mantenga una relación razonable entre los beneficios investigativos y la afectación de los derechos fundamentales.", "D. Que existan motivos fundados para relacionar el número telefónico con los hechos, que la información sea relevante para identificar a los responsables y que la Fiscalía cuente con elementos suficientes para sustentar su hipótesis investigativa", "Respuesta: C. Los cuatro componentes del juicio de proporcionalidad son: fin legítimo, idoneidad, necesidad y proporcionalidad en sentido estricto. La Fiscalía debe demostrar que la medida contribuye a una finalidad legítima, que esta misma es eficaz en la búsqueda de ese fin, que no existe otra alternativa igualmente eficaz y menos lesiva, y que la afectación de los derechos fundamentales no resulta excesiva frente a los beneficios que se esperan obtener."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "cierre": [], "preguntas": [{"contexto": [], "cab": null, "enunciado": [1], "opciones": [{"seg": 2, "letra": "A", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 3, "letra": "B", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 4, "letra": "C", "marcada": true, "ok": true, "cab": null, "retro": []}, {"seg": 5, "letra": "D", "marcada": true, "ok": false, "cab": null, "retro": []}], "respuesta": null, "cab_retro": null, "retro": [6], "fuente": []}], "items": [{"label": "Pregunta 1", "segs": [1, 2, 3, 4, 5, 6], "obj": "documento"}], "titulo": [0]}], "rotulo": null, "seccion": "Aplicación al expediente del curso", "grupo": null, "titulos_fuente": ["Aplicación al expediente del curso"], "encabezados": [0], "mediacion": "Actividad con retroalimentación: se elige una opción y se lee la respuesta del autor.", "rotulos": ["Pregunta 1"], "titulo_genially": "Aplicación al expediente del curso", "ilustracion": "p-dialogo-carpeta-2.webp", "relleno": "explica-brazos.webp", "ventanaAmplia": true}]}</script>
