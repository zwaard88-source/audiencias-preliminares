eticiones y decisiones que no deben ordenarse, resolverse o adoptarse en audiencia de formulación de acusación, preparatoria o juicio oral; y, a diferencia de estas últimas, le corresponden siempre a un juez con funciones de control de garantías (Art. 153), durante la fase de indagación e investigación (FGN, 2005, p.61).", "Por excepción, estas pueden tener lugar en la fase de juzgamiento, como ocurre en los casos de solicitud de prueba anticipada o de legalización de captura producida con posterioridad a la presentación del escrito de acusación.", "A partir de la lectura del artículo 154 del CPP, es posible concluir que existe una lista enunciativa, mas no taxativa, de aquellos asuntos susceptibles de ser resueltos al interior de audiencias preliminares.", "Entre ellos, la norma menciona el control posterior a los allanamientos, los registros e interceptaciones de comunicaciones, la petición de una medida de aseguramiento o de medidas cautelares, entre otros.", "Sin embargo, el numeral octavo de la norma referida amplía el espectro de audiencias preliminares, al señalar que “... se resolverán en audiencia asuntos similares a los anteriores”.", "Estos asuntos corresponden a aquellos actos de investigación y momentos procesales a los que se refiere el CPP —especialmente en el título de la indagación y la investigación— y que no aparecen en el artículo 154 ídem."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "audiencias preliminares", "segs": [0], "obj": "escudo", "ilus": "n-u1l1e01t1.webp"}, {"label": "fase de juzgamiento", "segs": [1], "obj": "puertaCerrada", "ilus": "n-u1l1e01t2.webp"}, {"label": "lista enunciativa", "segs": [2], "obj": "tribunal", "ilus": "n-u1l1e01t3.webp"}, {"label": "control posterior a los allanamientos", "segs": [3], "obj": "telefono", "ilus": "n-u1l1e01t4.webp"}, {"label": "numeral octavo", "segs": [4], "obj": "documento", "ilus": "n-u1l1e01t5.webp"}, {"label": "actos de investigación", "segs": [5], "obj": "lupa", "ilus": "n-u1l1e01t6.webp"}]}], "rotulo": null, "intencion": "Relación: definición de audiencia preliminar y lo que comprende (excepción, art. 154, numeral octavo, actos de investigación).", "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["audiencias preliminares", "fase de juzgamiento", "lista enunciativa", "control posterior a los allanamientos", "numeral octavo", "actos de investigación"], "parrafo": [0, 2], "vineta": [], "encabezados": [], "ilustracion": "clasificacion-carpetas.webp", "relleno": "revisan-documento.webp", "titulo_genially": "Audiencias preliminares", "seccion": "Audiencias preliminares", "ventanaAmplia": true}, {"section": 2, "part": 1, "variant": "flow", "object": "balanza", "case": false, "layout": "esquema", "segmentos": ["En cualquier caso, uno de los aspectos relevantes de las audiencias preliminares radica en que las instituciones jurídico-procesales restan atribuciones a la FGN, al someter a control y autorización judicial aquellas actuaciones que puedan derivar en restricciones o vulneraciones a derechos fundamentales.", "Por ello, conforme a lo dispuesto en el artículo 250 de la CN, la intervención del JCG opera, por regla general, de manera previa frente a las actuaciones que comprometan tales derechos.", "El control posterior constituye, por tanto, una excepción a dicha regla; reduciéndose su procedencia únicamente a los eventos expresamente previstos por la CN y la ley, entre ellos, los contemplados en el numeral 2º del artículo 250 de la CN.", "Bajo ese entendido, la labor del JCG supone determinar si las medidas de intervención en el ejercicio de los derechos fundamentales, llevadas a cabo o solicitadas por la FGN se adecúan a la ley (aspecto formal) y, además, si resultan ser idóneas, necesarias y proporcionales (aspecto material).", "Para estos efectos, se prevén dos oportunidades procesales de control judicial, cuyas consignas y casos de aplicación serán objeto de posterior análisis: el control previo y el control posterior."], "lead": [], "titulo": [], "tail": [], "chips": ["aspecto formal", "aspecto material", "control previo", "control posterior"], "bloques": [{"tipo": "esquema", "items": [{"label": "restan atribuciones", "segs": [0], "obj": "escudo"}, {"label": "de manera previa", "segs": [1], "obj": "tribunal"}, {"label": "una excepción", "segs": [2], "obj": "documento"}, {"label": "idóneas, necesarias y proporcionales", "segs": [3], "obj": "carpetas"}, {"label": "dos oportunidades", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "intencion": "Proceso: regla (control previo) y excepción (control posterior); qué examina el juez (formal y material).", "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["restan atribuciones", "de manera previa", "una excepción", "idóneas, necesarias y proporcionales", "dos oportunidades"], "parrafo": [0, 3], "vineta": [], "encabezados": [], "ilustracion": "revisan-documento.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "revisan-documento.webp", "pos": "fondo"}, "titulo_genially": "El control previo y el control posterior", "seccion": "El control previo y el control posterior", "escenario": {"bioma": "audiencia", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "ventanaAmplia": true}, {"section": 3, "part": 1, "variant": "compare", "object": "puerta", "case": false, "layout": "puntos", "segmentos": ["Ahora bien, el artículo 155 del CPP, en aras de salvaguardar el principio de publicidad, prevé que las audiencias preliminares deben realizarse con la presencia del imputado o de su defensor, siendo facultativa la asistencia del Ministerio Público.", "A su vez, estipula el carácter reservado de ciertos tipos de audiencias preliminares:", "(a) procedimientos en caso de lesionados o de víctimas de agresiones sexuales,", "(b) control judicial sobre allanamientos, registros, interceptación de comunicaciones, vigilancia y seguimiento de personas y de cosas;", "(c) autorización judicial previa en torno a inspección corporal, obtención de muestras que involucren al imputado;", "y (d) audiencias relativas a la imposición de medidas cautelares."], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "víctimas de agresiones sexuales", "segs": [2], "obj": "escudo"}, {"label": "interceptación de comunicaciones", "segs": [3], "obj": "telefono"}, {"label": "inspección corporal", "segs": [4], "obj": "huella"}, {"label": "medidas cautelares", "segs": [5], "obj": "tribunal"}]}], "rotulo": "Artículo 155 del CPP", "intencion": "Comparación: regla de publicidad (art. 155) frente a las cuatro audiencias de carácter reservado.", "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["víctimas de agresiones sexuales", "interceptación de comunicaciones", "inspección corporal", "medidas cautelares"], "parrafo": [0], "vineta": [], "encabezados": [], "ilustracion": "clasificacion-carpetas.webp", "relleno": "dialogo-carpeta.webp", "titulo_genially": "Principio de publicidad", "seccion": "Principio de publicidad", "ventanaAmplia": true}, {"section": 4, "part": 1, "variant": "timeline", "object": "tribunal", "case": false, "layout": "esquema", "segmentos": ["Sobre este punto, en alguna oportunidad, se interpuso una acción de tutela contra un juzgado que había ordenado la reserva de unas audiencias preliminares (legalización de allanamiento y de captura, formulación de imputación, imposición de medida de aseguramiento, entre otras), adelantadas dentro de un proceso penal seguido contra el exdirector de la cárcel La Modelo de Bogotá y otras personas, por los delitos de concusión, concierto para delinquir y enriquecimiento ilícito.", "Los accionantes —varios periodistas interesados en acceder a dichas actuaciones— consideraron que la decisión vulneraba sus derechos fundamentales a la libertad de expresión, información y prensa; así como, el debido proceso y el trabajo.", "En este contexto, los recurrentes sostuvieron que la reserva no se encontraba debidamente sustentada, por no haber concurrido alguna excepción legalmente establecida al principio de publicidad.", "En efecto, este es el caso de la Sentencia SU-141/20 (Corte Constitucional, 2020), lejos de evaluar si la autoridad judicial accionada incurrió en alguno de los defectos específicos al declarar la reserva de las audiencias preliminares concretas, se dispuso a estimar el alcance de la publicidad de las actuaciones penales.", "De manera puntual, el alto tribunal señaló que, si bien la publicidad de las actuaciones judiciales permite el control ciudadano con respecto a la administración de justicia, al igual que promueve debates sobre asuntos de interés público; esta misma puede ser limitada con el fin de proteger otros principios y derechos fundamentales, tales como el derecho a la vida, a la integridad y seguridad personal, a la intimidad, los derechos de los menores, el derecho a un juicio justo, o para asegurar la correcta administración de justicia, entre otros."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "acción de tutela", "segs": [0], "obj": "puertaCerrada"}, {"label": "periodistas", "segs": [1], "obj": "puertaAbierta"}, {"label": "excepción legalmente establecida", "segs": [2], "obj": "escudo"}, {"label": "Sentencia SU-141/20", "segs": [3], "obj": "libros"}, {"label": "puede ser limitada", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "intencion": "Cronología de un caso: tutela de periodistas contra la reserva y respuesta de la Corte (SU-141/20).", "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["acción de tutela", "periodistas", "excepción legalmente establecida", "Sentencia SU-141/20", "puede ser limitada"], "parrafo": [0, 3], "vineta": [], "encabezados": [], "ilustracion": "p-alto-documento.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "p-alto-documento.webp", "pos": "izq"}, "titulo_genially": "Sentencia SU-141/20", "seccion": "Sentencia SU-141/20", "escenario": {"bioma": "despacho", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "ventanaAmplia": true}, {"section": 4, "part": 2, "variant": "timeline", "object": "tribunal", "case": false, "layout": "fichas", "segmentos": ["Al compás de lo establecido en el artículo 155, la Corte Constitucional concluyó que era posible limitar la libertad de expresión que ejercen los medios de comunicación, en tanto se someta a reserva —de oficio o a petición de la fiscalía— una audiencia preliminar.", "Esto, siempre y cuando se realice un juicio sesudo a nivel constitucional, en que se contemple, a saber:", "(a) la legalidad,", "(b) la razonabilidad,", "(c) la necesidad y", "(d) la proporcionalidad de esta medida."], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "legalidad", "segs": [2], "obj": "documento"}, {"label": "razonabilidad", "segs": [3], "obj": "carpetas"}, {"label": "necesidad", "segs": [4], "obj": "lupa"}, {"label": "proporcionalidad", "segs": [5], "obj": "expediente"}]}], "rotulo": "Artículo 155 · Corte Constitucional", "intencion": "Aplicación de criterios: el juicio constitucional que permite reservar una audiencia (cuatro criterios).", "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["legalidad", "razonabilidad", "necesidad", "proporcionalidad"], "parrafo": [0], "vineta": [], "encabezados": [], "ilustracion": "lee-libro-explica.webp", "relleno": "alto-documento.webp", "arte": {"img": "lee-libro-explica.webp", "pos": "izq"}, "titulo_genially": "Juicio sesudo a nivel constitucional", "seccion": "Juicio sesudo a nivel constitucional", "ventanaAmplia": true}, {"section": 6, "part": 1, "variant": "activity", "object": "documento", "case": false, "layout": "actividad", "segmentos": ["Pregunta 1", "En la investigación por las amenazas extorsivas denunciadas por Beatriz Elena Morales, la intervención del JCG frente a las actuaciones investigativas se determina a partir de:", "A. La naturaleza de la actuación y los requisitos legales para establecer si procede el control previo o posterior.", "B. La relevancia de los hechos investigados y la utilidad de la actuación para esclarecerlos.", "C. La valoración de los elementos materiales probatorios y la hipótesis investigativa formulada por la Fiscalía.", "D. La incidencia de la actuación en el desarrollo de la investigación y la estrategia procesal de la Fiscalía.", "Respuesta:", "A. La intervención del JCG no depende exclusivamente de la utilidad de una diligencia investigativa, de la relevancia de los hechos o de la estrategia formulada por la Fiscalía. Su procedencia y oportunidad están determinadas por la naturaleza del acto de investigación y por las disposiciones constitucionales y legales que regulan su práctica.", "En ese sentido, conviene distinguir, de momento, tres escenarios: (i) actuaciones que no requieren autorización judicial, (ii) actuaciones sujetas a control judicial previo y (iii) actuaciones sujetas a control judicial posterior."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "cierre": [], "preguntas": [{"contexto": [], "cab": null, "enunciado": [1], "opciones": [{"seg": 2, "letra": "A", "marcada": true, "ok": true, "cab": null, "retro": []}, {"seg": 3, "letra": "B", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 4, "letra": "C", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 5, "letra": "D", "marcada": true, "ok": false, "cab": null, "retro": []}], "respuesta": null, "cab_retro": 6, "retro": [7, 8], "fuente": []}], "items": [{
