</main>
<script type="application/json" id="datos">{"2": {"aria": "Mapa conceptual: el control previo y el control posterior", "filas": [[{"id": "r", "raiz": true, "h": "Audiencias preliminares", "w": 260}], [{"id": "a", "h": "Restan atribuciones a la FGN", "p": "En cualquier caso, uno de los aspectos relevantes de las audiencias preliminares radica en que las instituciones jurídico-procesales restan atribuciones a la FGN, al someter a control y autorización judicial aquellas actuaciones que puedan derivar en restricciones o vulneraciones a derechos fundamentales.", "ico": "fa-shield-halved", "t": "t-menta"}], [{"id": "b", "h": "De manera previa: la regla general", "p": "Por ello, conforme a lo dispuesto en el artículo 250 de la CN, la intervención del JCG opera, por regla general, de manera previa frente a las actuaciones que comprometan tales derechos.", "ico": "fa-gavel", "t": "t-cielo"}, {"id": "c", "h": "Una excepción: el control posterior", "p": "El control posterior constituye, por tanto, una excepción a dicha regla; reduciéndose su procedencia únicamente a los eventos expresamente previstos por la CN y la ley, entre ellos, los contemplados en el numeral 2º del artículo 250 de la CN.", "ico": "fa-clock-rotate-left", "t": "t-coral"}], [{"id": "d", "h": "Aspecto formal y aspecto material", "p": "Bajo ese entendido, la labor del JCG supone determinar si las medidas de intervención en el ejercicio de los derechos fundamentales, llevadas a cabo o solicitadas por la FGN se adecúan a la ley (aspecto formal) y, además, si resultan ser idóneas, necesarias y proporcionales (aspecto material).", "ico": "fa-list-check", "t": "t-arena", "flex": 1.45}, {"id": "e", "h": "Dos oportunidades procesales", "p": "Para estos efectos, se prevén dos oportunidades procesales de control judicial, cuyas consignas y casos de aplicación serán objeto de posterior análisis: el control previo y el control posterior.", "ico": "fa-code-branch", "t": "t-menta"}]], "lineas": [["r", "a", "uno de sus aspectos relevantes"], ["a", "b", "por regla general"], ["a", "c", "una excepción"], ["b", "d", ""], ["c", "e", ""]]}, "4": {"aria": "Mapa conceptual: Sentencia SU-141/20", "resumen": true, "filas": [[{"id": "a", "h": "Acción de tutela", "p": "Sobre este punto, en alguna oportunidad, se interpuso una acción de tutela contra un juzgado que había ordenado la reserva de unas audiencias preliminares (legalización de allanamiento y de captura, formulación de imputación, imposición de medida de aseguramiento, entre otras), adelantadas dentro de un proceso penal seguido contra el exdirector de la cárcel La Modelo de Bogotá y otras personas, por los delitos de concusión, concierto para delinquir y enriquecimiento ilícito.", "ico": "fa-file-signature", "t": "t-cielo"}, {"id": "b", "h": "Periodistas", "p": "Los accionantes —varios periodistas interesados en acceder a dichas actuaciones— consideraron que la decisión vulneraba sus derechos fundamentales a la libertad de expresión, información y prensa; así como, el debido proceso y el trabajo.", "ico": "fa-newspaper", "t": "t-arena"}, {"id": "c", "h": "Excepción legalmente establecida", "p": "En este contexto, los recurrentes sostuvieron que la reserva no se encontraba debidamente sustentada, por no haber concurrido alguna excepción legalmente establecida al principio de publicidad.", "ico": "fa-shield-halved", "t": "t-coral"}], [{"id": "r", "raiz": true, "h": "Sentencia SU-141/20", "p": "En efecto, este es el caso de la Sentencia SU-141/20 (Corte Constitucional, 2020), lejos de evaluar si la autoridad judicial accionada incurrió en alguno de los defectos específicos al declarar la reserva de las audiencias preliminares concretas, se dispuso a estimar el alcance de la publicidad de las actuaciones penales.", "w": 520}], [{"id": "e", "h": "Puede ser limitada", "p": "De manera puntual, el alto tribunal señaló que, si bien la publicidad de las actuaciones judiciales permite el control ciudadano con respecto a la administración de justicia, al igual que promueve debates sobre asuntos de interés público; esta misma puede ser limitada con el fin de proteger otros principios y derechos fundamentales, tales como el derecho a la vida, a la integridad y seguridad personal, a la intimidad, los derechos de los menores, el derecho a un juicio justo, o para asegurar la correcta administración de justicia, entre otros.", "ico": "fa-scale-unbalanced", "t": "t-menta", "w": 600}]], "lineas": [["a", "b", ""], ["b", "c", ""], ["c", "r", "en efecto"], ["r", "e", "de manera puntual"]]}, "5": {"aria": "Mapa conceptual: juicio sesudo a nivel constitucional", "filas": [[{"id": "a", "h": "Artículo 155 · Corte Constitucional", "p": "Al compás de lo establecido en el artículo 155, la Corte Constitucional concluyó que era posible limitar la libertad de expresión que ejercen los medios de comunicación, en tanto se someta a reserva —de oficio o a petición de la fiscalía— una audiencia preliminar.", "ico": "fa-book-open", "t": "t-cielo"}], [{"id": "r", "raiz": true, "h": "Juicio sesudo a nivel constitucional", "p": "Esto, siempre y cuando se realice un juicio sesudo a nivel constitucional, en que se contemple, a saber:", "w": 470}], [{"id": "l", "h": "(a) la legalidad", "ico": "fa-book", "t": "t-menta", "grande": true}, {"id": "z", "h": "(b) la razonabilidad", "ico": "fa-lightbulb", "t": "t-coral", "grande": true}, {"id": "n", "h": "(c) la necesidad", "ico": "fa-magnifying-glass", "t": "t-arena", "grande": true}, {"id": "o", "h": "(d) la proporcionalidad de esta medida", "ico": "fa-sliders", "t": "t-cielo", "grande": true}]], "lineas": [["a", "r", "siempre y cuando"], ["r", "l", ""], ["r", "z", ""], ["r", "n", ""], ["r", "o", ""]]}}</script>

<script>
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : '2'] || M['2'];
  var mapa = document.getElementById('mapa'), svg = document.getElementById('svg'), lz = document.getElementById('lienzo'), nodos = {}, leidos = {}, abribles = 0;
  lz.setAttribute('aria-label', d.aria);
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s]+$/, '') + '…'; }
  d.filas.forEach(function (f) {
    var fila = document.createElement('div'); fila.className = 'fila';
    f.forEach(function (n) {
      var e = document.createElement('div'); e.className = 'nodo ' + (n.raiz ? 'raiz' : (n.t || '')) + (n.grande ? ' grande' : '');
      if (n.w) { e.style.flex = '0 0 ' + n.w + 'px'; }
      if (n.flex) e.style.flex = n.flex + ' 1 0';
      var cab = '<div class="cab">' + (n.ico ? '<span class="ico"><i class="fas ' + n.ico + '" aria-hidden="true"></i></span>' : '') + '<h3>' + n.h + '</h3></div>';
      var cuerpo = '';
      if (n.p) {
        if (d.resumen) { cuerpo = '<p>' + corta(n.p, n.w ? 230 : 120) + '</p><span class="leer"><i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo</span>'; e.classList.add('abre'); e.tabIndex = 0; e.setAttribute('role', 'button'); abribles++; }
        else cuerpo = '<p>' + n.p + '</p>';
      }
      e.innerHTML = cab + (n.raiz && !n.p ? '' : cuerpo);
      if (n.raiz && !n.p) e.style.flex = '0 0 ' + (n.w || 260) + 'px';
      if (d.resumen && n.p) {
        var abrir = function () { globo(e, n); };
        e.addEventListener('click', abrir); e.addEventListener('keydown', function (k) { if (k.key === 'Enter' || k.key === ' ') { k.preventDefault(); abrir(); } });
      }
      nodos[n.id] = e; fila.appendChild(e);
    });
    mapa.appendChild(fila);
  });
  var G = document.getElementById('globo');
  function globo(e, n) {
    document.getElementById('gh').textContent = n.h; document.getElementById('gp').textContent = n.p;
    G.classList.add('abierto');
    /* ventana amplia al centro del mapa (Sebastián, 26/11/2026: «hacer los pop-ups más grandes para evitar muchos clicks») */
    var W = lz.clientWidth, H = lz.clientHeight, gw = G.offsetWidth, gh = G.offsetHeight;
    G.scrollTop = 0; G.style.left = Math.max(8, (W - gw) / 2) + 'px'; G.style.top = Math.max(8, (H - gh) / 2) + 'px';
    leidos[n.id] = 1; e.classList.add('visto'); e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer';
    avance(); document.getElementById('gx').focus();
  }
  function cerrar() { G.classList.remove('abierto'); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.nodo.abre')) cerrar(); });
  function avance() { if (!abribles) return; var n = Object.keys(leidos).length; document.getElementById('avance').innerHTML = '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + abribles + '</b>'; }
  avance();
  function centro(e) { return { x: e.offsetLeft + e.parentNode.offsetLeft + mapa.offsetLeft + e.offsetWidth / 2, y: e.offsetTop + e.parentNode.offsetTop + mapa.offsetTop + e.offsetHeight / 2, e: e }; }
  function borde(a, b) { /* punto del borde de a en dirección a b */
    var dx = b.x - a.x, dy = b.y - a.y, hw = a.e.offsetWidth / 2, hh = a.e.offsetHeight / 2;
    var s = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6)); return { x: a.x + dx * s, y: a.y + dy * s };
  }
  function dibujar() {
    svg.innerHTML = '<defs><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#587E6D"/></marker></defs>';
    [].forEach.call(lz.querySelectorAll('.enlace'), function (x) { x.remove(); });
    d.lineas.forEach(function (l) {
      var A = centro(nodos[l[0]]), B = centro(nodos[l[1]]), p = borde(A, B), r = borde(B, A);
      var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', p.x); ln.setAttribute('y1', p.y); ln.setAttribute('x2', r.x); ln.setAttribute('y2', r.y);
      ln.setAttribute('stroke', '#587E6D'); ln.setAttribute('stroke-width', '2'); ln.setAttribute('marker-end', 'url(#pt)');
      svg.appendChild(ln);
      if (l[2]) { var t = document.createElement('span'); t.className = 'enlace'; t.textContent = l[2]; t.style.left = (p.x + r.x) / 2 + 'px'; t.style.top = (p.y + r.y) / 2 + 'px'; lz.appendChild(t); }
    });
  }
  window.addEventListener('load', dibujar); setTimeout(dibujar, 300);
})();
</script>
