aria"], "titulo_genially": "Sustitución de la detención preventiva (art. 314).", "ilustracion": "p-lee-libro.webp", "relleno": "captura-detenido.webp", "arte": {"img": "p-lee-libro.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["La reclusión en establecimiento carcelario puede sustituirse por el domicilio cuando se acredite alguno de los siguientes supuestos:", "1. Suficiencia de la medida: Si la residencia cumple a cabalidad con los fines de la detención, según las condiciones personales, laborales o familiares del imputado.", "2. Edad avanzada: Cuando el investigado tenga más de 65 años y las características del delito lo aconsejen.", "3. Maternidad: A falta de dos meses o menos para el parto, o dentro de los seis meses siguientes al nacimiento."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Suficiencia de la medida", "segs": [1], "obj": "personas"}, {"label": "Edad avanzada", "segs": [2], "obj": "reloj"}, {"label": "Maternidad", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "4.6.1. Causales de Procedencia", "grupo": null, "titulos_fuente": ["4.6.1. Causales de Procedencia"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Suficiencia de la medida", "Edad avanzada", "Maternidad"], "titulo_genially": "Causales de Procedencia (1 de 2)", "ilustracion": "p-trio-1.webp", "relleno": "captura-detenido.webp", "arte": {"img": "p-trio-1.webp", "pos": "izq"}, "escenario": {"bioma": "barrio", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "mapa_intro": true}, {"layout": "fichas", "segmentos": ["4. Enfermedad grave: Acreditada mediante dictamen de Medicina Legal, con posibilidad de internamiento domiciliario o clínico. La Corte Constitucional (Sentencia C-443 de 2025) ha admitido la medida también en enfermedad  y Prohibiciones (Parágrafo)", "ilustracion": "p-lee-libro.webp", "relleno": "alto-documento.webp", "arte": {"img": "p-lee-libro.webp", "pos": "izq"}}, {"layout": "lamina", "segmentos": ["Para acceder a la detención domiciliaria, el procesado debe firmar un acta comprometiéndose a permanecer en el lugar indicado, comparecer ante la autoridad cuando sea requerido y someterse a vigilancia (incluyendo sistemas electrónicos o control del INPEC)."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "firmar un acta", "segs": [0], "obj": "puertaCerrada", "acomp": ["camara", "documento"]}]}], "rotulo": null, "seccion": "4.6.3. Obligaciones y control", "grupo": null, "titulos_fuente": ["4.6.3. Obligaciones y control"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["firmar un acta"], "titulo_genially": "Obligaciones y control", "ilustracion": "p-alto-documento-2.webp", "relleno": "investigacion-lupa.webp"}, {"layout": "esquema", "segmentos": ["Según el parágrafo 1º del artículo 307 del Código de Procedimiento Penal de Colombia (modificado por la Ley 1786 de 2016), el término máximo de las medidas de aseguramiento privativas de la libertad es de un (1) año.", "Una vez cumplido este lapso, el procesado tiene derecho a solicitar la sustitución de la medida restrictiva por una no privativa de la libertad. No obstante, la norma contempla excepciones importantes que permiten extender o prorrogar este plazo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "término máximo de las medidas de aseguramiento privativas de la libertad", "segs": [0], "obj": "puertaCerrada"}, {"label": "derecho a solicitar la sustitución", "segs": [1], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "4.7. El término máximo de las medidas privativas (art. 307, parágrafo 1).", "grupo
