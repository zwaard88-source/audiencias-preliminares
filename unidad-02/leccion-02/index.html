 esta situación, la Fiscalía considera solicitar una medida de aseguramiento. Para fundamentar su solicitud, debe:", "A. Acreditar la gravedad de las amenazas, la pena prevista para la extorsión y la vinculación del investigado con los hechos.", "B. Demostrar la inferencia razonable de autoría o participación y alguno de los fines constitucionales de la medida, y justificar su necesidad, si es privativa de la libertad.", "C. Establecer que el investigado conoce a la víctima, ha mantenido contacto con ella y podría reiterar la conducta.", "D. Acreditar que la investigación requiere restringir la libertad del investigado para garantizar la práctica de los actos pendientes.", "Respuesta: B. Los artículos 307 y 308 del CPP exigen acreditar la inferencia razonable de autoría o participación y alguno de los fines constitucionales de la medida. Si se solicita una medida privativa de la libertad, también debe demostrarse que las medidas no privativas son insuficientes."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "cierre": [], "preguntas": [{"contexto": [], "cab": null, "enunciado": [1], "opciones": [{"seg": 2, "letra": "A", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 3, "letra": "B", "marcada": true, "ok": true, "cab": null, "retro": []}, {"seg": 4, "letra": "C", "marcada": true, "ok": false, "cab": null, "retro": []}, {"seg": 5, "letra": "D", "marcada": true, "ok": false, "cab": null, "retro": []}], "respuesta": null, "cab_retro": null, "retro": [6], "fuente": []}], "items": [{"label": "Pregunta 1", "segs": [1, 2, 3, 4, 5, 6], "obj": "documento"}], "titulo": [0]}], "rotulo": null, "seccion": "Aplicación al expediente del curso", "grupo": null, "titulos_fuente": ["Aplicación al expediente del curso"], "encabezados": [0], "mediacion": "Actividad con retroalimentación: se elige una opción y se lee la respuesta del autor.", "rotulos
