<script type="application/json" id="datos">{"1": {"t": "¿En qué consiste la técnica y para qué se utiliza?", "r": [{"h": "registro y allanamiento", "p": [["", "El registro y allanamiento es una técnica de investigación regulada en los artículos 219 y siguientes de la Ley 906 de 2004, mediante la cual la Fiscalía, por regla general a través de una orden escrita, dispone la penetración y el escrutinio de un inmueble, nave o aeronave, con el propósito de (a) obtener elementos materiales probatorios y evidencia física o (b) realizar la captura del indiciado, imputado o condenado. En este último escenario, el fiscal sólo podrá ordenar su práctica con relación a delitos susceptibles de imposición de medida de aseguramiento de detención preventiva, bajo control previo por parte del JCG."]]}, {"h": "artículo 219", "p": [["", "“[...] la posibilidad de que la Fiscalía ordene adelantar una diligencia de registro y allanamiento, únicamente para procurar la captura de una persona, requiere de la autorización previa del JCG tratándose del indiciado o imputado, quien deberá constatar tal como exige el artículo 219 analizado, no sólo que se esté en presencia de un delito de aquellos susceptibles de imposición de medida de aseguramiento de detención preventiva, sino de los demás presupuestos contenidos en la ley y decantados por la jurisprudencia."], ["", "En los eventos de condenados, tal orden provendrá del juez de conocimiento o del juez de ejecución de penas y medidas de seguridad, según el caso” [Sentencia C-366/14, Apartado 6.10., (Corte Constitucional, 2014)]"]]}, {"h": "artículo 28", "p": [["", "Se trata de una diligencia que puede afectar intensamente los derechos fundamentales, en particular la intimidad y la inviolabilidad del domicilio, reconocida en el artículo 28 de la Constitución Política; razón por la cual la realización de esta diligencia—al igual que las de interceptación de comunicaciones, interceptación de correspondencia y recuperación de información dejada al navegar por la Internet— constituye una excepción. Como es lógico, por tratarse de una medida con incidencia sobre preceptos constitucionales se exige un control judicial por parte del JCG."]]}], "ilus": "m-allanamiento.webp", "raiz": "¿En qué consiste la técnica y para qué se utiliza?"}, "7": {"t": "¿Cómo se desarrolla la actuación?", "r": [{"h": "reglas especiales de esta TOI", "p": [["", "Ahora bien, con respecto a las reglas especiales de esta TOI, es preciso señalar que, cuando el allanamiento y el registro deba practicarse en inmuebles, naves, aeronaves o vehículos automotores que gocen de inmunidad diplomática o consular, el fiscal deberá solicitar previamente la autorización del respectivo agente diplomático o consular, el cual será remitido por conducto del Ministerio de Relaciones Exteriores (Art. 226)."]]}, {"h": "situaciones de flagrancia", "p": [["", "En las situaciones de flagrancia, la policía judicial podrá proceder al registro y allanamiento del inmueble, nave o aeronave del indiciado. En caso de refugiarse en un bien inmueble ajeno, no abierto al público, se solicitará el consentimiento del propietario o tenedor o en su defecto se obtendrá la orden correspondiente de la FGN, salvo que por voces de auxilio resulte necesaria la intervención inmediata o se establezca coacción del indiciado en contra del propietario o tenedor."]]}, {"h": "artículo 227 del CPP", "p": [["", "El artículo 227 del CPP establece que, durante la diligencia de allanamiento y registro, la policía judicial debe elaborar un acta detallada. En ella se identificarán y describirán minuciosamente todos los objetos examinados o incautados, especificando el lugar exacto del inmueble donde fueron hallados. Igualmente, se incorporarán las constancias y observaciones solicitadas por las personas que en ella intervengan, de la cual se expedirá una copia para los propietarios, poseedores o tenedores, si la solicitan"]]}, {"h": "término máximo de doce (12) horas", "p": [["", "En igual sentido, una vez culminada la diligencia de registro y allanamiento, la policía judicial cuenta con un término máximo de doce (12) horas para informar al fiscal los pormenores del operativo y remitir el inventario de los bienes ocupados o incautados, cuya custodia continuará bajo su responsabilidad. Asimismo, si se hubieren efectuado capturas, el aprehendido deberá ser puesto a disposición del fiscal de manera inmediata junto con su respectivo informe."]]}], "ilus": "m-allanamiento.webp", "raiz": "¿Cómo se desarrolla la actuación?"}, "11": {"t": "¿Qué debe fundamentar el fiscal ante el JCG?", "r": [{"h": "artículo 221 del CPP", "p": [["", "De acuerdo con el artículo 221 del CPP, la motivación del acto deberá ser respaldada, como mínimo, en: (a) informe de policía judicial; (b) declaración jurada de testigo o informante; o (c) EMP y EF que permitan establecer, con verosimilitud, la vinculación del bien con el delito investigado."]]}, {"h": "testigos o informantes", "p": [["vin", "Cuando el respaldo provenga de testigos o informantes, deben observarse reglas específicas sobre su credibilidad, identificación y reserva de datos (inclusive para efectos de la audiencia ante el JCG). En principio, el artículo 221 del CPP establece un tratamiento diferenciado entre el testigo y el informante"]]}, {"h": "Testigo", "p": [["vin", "Testigo: deberá estar presente ante el fiscal “con miras a un eventual interrogatorio que le permita apreciar mejor su credibilidad”"]]}, {"h": "Informante", "p": [["vin", "Informante: se establece que “la policía judicial deberá precisar al fiscal su identificación y explicar por qué razón le resulta confiable”."]]}], "ilus": "fundamento-documento.webp", "raiz": "¿Qué debe fundamentar el fiscal ante el JCG?"}, "18": {"t": "¿Cómo se desarrolla la actuación?", "r": [{"h": "Ejemplo No. 2", "p": [["", "Ejemplo No. 2: En cambio, si la investigación se dirige contra una organización criminal y la diligencia se enmarca en ese régimen especial, el plazo máximo será de tres (3) meses durante la indagación y de seis (6) meses una vez formulada la imputación. Así, por ejemplo, si la Fiscalía investiga una presunta estructura criminal dedicada a extorsionar comerciantes y requiere consultar información reservada para establecer las relaciones entre sus integrantes, podrá solicitar la autorización por el término correspondiente a ese régimen especial, siempre que justifique que el caso reúne las condiciones para su aplicación (como podría efectuarse"], ["", "en el caso de Beatriz Elena)."]]}, {"h": "Dato importante", "p": [["", "Dato importante: Todos los términos procesales vistos son prorrogables por una única ocasión."]]}, {"h": "STP1157-2020", "p": [["vin", "Sobre esto, la jurisprudencia de la Corte Suprema de Justicia (2020, STP1157-2020) ha sido enfática, en el sentido de que el artículo 244 —sobre búsqueda selectiva en base de datos— remite de forma expresa al artículo 224 del CPP, según el cual sólo es posible conceder una única prórroga para el registro y allanamiento. En ese orden de ideas, incluso, si ya un JCG concedió una segunda prórroga, el juez que conoce del control posterior se encuentra obligado a declarar la ilegalidad del procedimiento y sus resultados, con fundamento en lo expuesto."]]}, {"h": "Ejemplo", "p": [["", "Ejemplo. Si durante una indagación la Fiscalía obtiene autorización para realizar una búsqueda selectiva en bases de datos por un término de treinta (30) días y, antes de su vencimiento, solicita una prórroga, esta podrá concederse por una única ocasión. En cambio, si posteriormente solicita una segunda ampliación del término, el juez no podrá autorizarla, pues excedería el límite de prórroga previsto en el régimen aplicable. La circunstancia de que la investigación revista especial complejidad no habilita, por sí sola, la concesión de prórrogas sucesivas."]]}], "ilus": "", "raiz": "¿Cómo se desarrolla la actuación?"}, "23": {"t": "Búsqueda selectiva en bases de datos", "r": [{"h": "¿Qué debe fundamentar el fiscal ante el JCG?", "p": [["", "Además de fundamentar la procedencia ante el JCG (metodología que se verá en la Unidad 4), existe un caso especial🡪"], ["vin", "Investigación sobre organizaciones criminales:"], ["vin", "JCG podrá autorizar el levantamiento de la reserva y el acceso a la totalidad de las bases de datos en las que razonablemente pueda encontrarse información relacionada con el indiciado o imputado."], ["vin", "Esta autorización exige una motivación reforzada por parte de la Fiscalía, quien deberá demostrar que la gravedad de los hechos investigados y que las particularidades del caso hacen indispensable una medida de tal alcance."]]}, {"h": "¿Solamente el fiscal puede solicitarla y, por ende, fundamentarla?", "p": [["vin", "Es posible que la defensa solicite la práctica de la diligencia de búsqueda selectiva en base de datos, bajo dos argumentos primordiales; (a) no existe prohibición expresa y (b) como expresión del principio de igualdad de armas."], ["vin", "En cuanto a la representación de víctimas, la jurisprudencia (Corte Suprema de Justicia, 2024, STP13966-2024) ha indicado que no es posible que solicite ante un JCG la autorización para realizar una búsqueda selectiva en bases de datos. De conformidad con el artículo 250 de la CN y el artículo 244 del CPP, la víctima no se encuentra legitimada para solicitar directamente esta diligencia, por su condición de interviniente especial. Esta facultad corresponde a la Fiscalía y, en ciertos eventos, a la defensa; de extenderse a las víctimas, habría un desequilibrio procesal en perjuicio de la defensa."]]}, {"h": "Ejemplo para el caso del curso (Art. 244 CPP; Sentencia C-336/07)", "p": [["vin", "Para identificar al titular de la billetera digital a la que se le exigió transferir $5.000.000 MCTE a Beatriz, la Fiscalía aplicó el Doble Control Judicial: acudió primero ante el JCG para obtener autorización previa (ex ante) requerida a la entidad financiera amparada por Habeas Data, y una vez recibidos los extractos bancarios y movimientos de cuenta, la Fiscalía acudió dentro de las 36 horas siguientes ante el JCG para el control posterior (ex post)."]]}], "ilus": "m-bases-datos.webp", "raiz": ""}, "27": {"t": "¿Cuáles son sus requisitos de procedencia?", "r": [{"h": "(b) la puesta a disposición del aparato", "p": [["", "(b) la puesta a disposición del aparato que contiene la información (el celular);"]]}, {"h": "(c) la decisión de grabar una conversación", "p": [["", "(c) la decisión de grabar una conversación en la cual se participó."]]}], "ilus": "m-interceptacion.webp", "raiz": "¿Cuáles son sus requisitos de procedencia?"}, "33": {"t": "Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones", "r": [{"h": "¿Qué debe fundamentar el fiscal ante el JCG?", "p": [["", "El fiscal deberá exponer los motivos razonablemente fundados para considerar que el indiciado o imputado está transmitiendo, almacenando o manipulando datos a través de redes de telecomunicaciones, así como la relación de la información que se pretende recuperar con los intereses de la investigación."], ["vin", "Cuando la orden se expida después de formulada la imputación:"], ["vin", "Plazo de quince (15) días previsto en el artículo 224 del CPP, aplicable por remisión analógica del artículo 236."], ["vin", "STP2633-2025 de la Corte Suprema de Justicia:"], ["vin", "Avaló la declaratoria de ilegalidad formal y material de una orden que desconoció ese límite temporal."]]}, {"h": "Ejemplo para el caso del curso (Art. 236 CPP)", "p": [["vin", "Los extorsionistas enviaron mensajes intimidatorios a Beatriz mediante plataformas telemáticas utilizando redes móviles en Soacha. La Policía Judicial rastreó las direcciones IP, puertos de conexión y metadatos de tráfico telemático, y el fiscal presentó el informe técnico ante el JCG dentro de las 24 horas siguientes para la audiencia de legalización posterior."]]}], "ilus": "investigacion-lupa.webp", "raiz": ""}, "35": {"t": "¿Cuáles son sus requisitos de procedencia?", "r": [{"h": "aplicables por analogía", "p": [["", "Por la naturaleza de esta actuación, el legislador dispuso que le sean aplicables por analogía, y en lo pertinente, los criterios que regulan los registros y allanamientos. En consecuencia, la orden no sólo deberá estar sustentada en motivos razonablemente fundados, sino que, por ejemplo, deberá ejecutarse con observancia de los términos y las reglas previstas en los artículos 224 y 225."]]}, {"h": "soporte físico original", "p": [["", "La medida no se limita exclusivamente a la aprehensión del soporte físico original contentivo de la información. El fiscal puede disponer de:"], ["vin", "La retención del documento físico original en tránsito o custodia."], ["vin", "La obtención de copias de los mensajes transmitidos o recibidos por el indiciado o imputado."], ["vin", "La solicitud a las empresas de mensajería para que suministren la relación o permitan el acceso al historial de envíos realizados o recibidos por el investigado, siempre que dicha información se oriente a la contribución de la información y resulte relevante para la investigación."]]}], "ilus": "revisan-documento.webp", "raiz": "¿Cuáles son sus requisitos de procedencia?"}, "37": {"t": "Vigilancia y seguimiento de personas", "r": [{"h": "¿En qué consiste la técnica y para qué se utiliza?", "p": [["", "La vigilancia y el seguimiento de personas constituyen una TOI que permite a la Policía Judicial observar de manera pasiva los desplazamientos, actividades y relaciones del indiciado o imputado, con el propósito de obtener información útil con respecto a la investigación. En principio, este seguimiento pasivo busca fortalecer la actividad investigativa sin mediar algún tipo de interferencia directa sobre la conducta de la persona vigilada."]]}, {"h": "¿Cuáles son sus requisitos de procedencia?", "p": [["", "De acuerdo con el artículo 239 del CPP, cuando el fiscal cuente con motivos razonablemente fundados para inferir que el seguimiento del indiciado o imputado puede conducir a la obtención de información relevante para la investigación, podrá ordenar a la Policía Judicial que adelante una vigilancia pasiva durante un tiempo determinado."], ["vin", "Sin embargo, el desarrollo de estas actividades debe respetar en todo momento la expectativa razonable de intimidad del indiciado o imputado y de los terceros que puedan verse involucrados."]]}], "ilus": "m-vigilancia.webp", "raiz": ""}, "43": {"t": "Vigilancia de cosas", "r": [{"h": "¿En qué consiste la técnica y para qué se utiliza?", "p": [["", "Según el artículo 240 del CPP, la vigilancia de cosas es una TOI que permite a la Policía Judicial observar de manera continua determinados bienes, siempre que existan motivos razonablemente fundados para considerar que estos mismos están siendo utilizados para la comisión de actividades delictivas o para ocultar objetos relacionados con ellas. Al igual que cualquier técnica, su finalidad se limita al recaudo de elementos materiales probatorios y evidencia física."]]}, {"h": "inmuebles, naves, aeronaves, vehículos o cualquier otro bien mueble", "p": [["", "En particular, esta aplica sobre inmuebles, naves, aeronaves, vehículos o cualquier otro bien mueble que esté siendo utilizado para almacenar sustancias estupefacientes, elementos destinados a su procesamiento, explosivos, armas, municiones, sustancias para fabricar explosivos o, en general, instrumentos empleados para la comisión de un delito o bienes provenientes de su ejecución."], ["", "Durante la ejecución de la diligencia, la Policía Judicial podrá utilizar cualquier medio técnicamente idóneo para desarrollar la vigilancia, siempre que su utilización no afecte la expectativa razonable de intimidad del indiciado, del imputado o de terceros. Esta limitación constituye una garantía frente a injerencias desproporcionadas en la esfera privada de las personas y exige que, con este motivo, las actividades de observación se ajusten a las previsiones del artículo 239 de la Ley 906 de 2004."]]}, {"h": "¿Cómo se desarrolla la actuación?", "p": [["", "Así pues, la respectiva orden de vigilancia podrá mantenerse por un término máximo de (1) un año. Si durante ese período no se obtiene información útil, la medida deberá cancelarse, sin que ello sea un impedimento para que el fiscal expida una nueva orden cuando surjan posteriormente nuevos motivos razonablemente fundados que justifiquen su práctica."]]}], "ilus": "m-vigilancia.webp", "raiz": ""}, "50": {"t": "Registro personal", "r": [{"h": "¿Qué tipo de control judicial requiere?", "p": [["vin", "La práctica del registro requiere autorización judicial previa para su realización."]]}, {"h": "¿Qué debe fundamentar el fiscal ante el JCG?", "p": [["", "El Fiscal General de la Nación o su delegado deberá contar con motivos razonablemente fundados para inferir que una persona vinculada a la investigación posee objetos, documentos, sustancias o cualquier otro elemento relevante para el esclarecimiento de los hechos."]]}, {"h": "Ejemplo para el caso del curso (Art. 248 CPP)", "p": [["vin", "Durante un operativo de control en la vía pública frente al local de celulares de San Mateo (Soacha), servidores de Policía Judicial abordaron al sospechoso encargado del cobro. Ante su negativa a ser requisado e inspeccionado, la Fiscalía acudió en audiencia previa ante el JCG y obtuvo la orden de registro personal, lo que permitió a los investigadores requisar sus prendas de vestir y calzado, hallando dos simcards prepago escondidas en las costuras de su chaqueta con las que se originaron las llamadas extorsionistas a Beatriz Elena."]]}], "ilus": "p-dialogo-carpeta-2.webp", "raiz": ""}, "54": {"t": "¿Cuáles son sus requisitos de procedencia?", "r": [{"h": "autoridad competente", "p": [["", "(g) que sea llevada a cabo por autoridad competente;"]]}, {"h": "manera breve y eficiente", "p": [["", "(h) se realice de manera breve y eficiente;"]]}, {"h": "condiciones de higiene, salubridad y privacidad", "p": [["", "(i) se utilicen los instrumentos y medios necesarios en condiciones de higiene, salubridad y privacidad;"]]}, {"h": "lugar acondicionado para este fin", "p": [["", "(j) en un lugar acondicionado para este fin."]]}], "ilus": "m-muestras-adn.webp", "raiz": "¿Cuáles son sus requisitos de procedencia?"}, "56": {"t": "Obtención de muestras", "r": [{"h": "¿En qué consiste la técnica y para qué se utiliza?", "p": [["", "La obtención de muestras que involucren al imputado, reglada en el artículo 249 del CPP, constituye una TOI destinada a obtener elementos cognitivos de comparación que permitan establecer la relación entre una persona y los hechos objeto de investigación. Debido a que esta diligencia, como puede verse, implica serias restricciones para con los derechos fundamentales, el legislador estableció ciertos requisitos estrictos para su práctica."], ["vin", "Entre las muestras que pueden obtenerse se encuentran aquellas destinadas al examen grafotécnico, el cotejo de fluidos corporales, la identificación de la voz, las impresiones dentales y las huellas de pisadas, así como otros elementos de identificación técnica previstos en la ley."]]}, {"h": "¿Cuáles son sus requisitos de procedencia?", "p": [["", "Cuando el fiscal considere que la obtención de muestras resulte necesaria para el esclarecimiento de determinados hechos, podrá ordenar a la Policía Judicial su práctica."], ["vin", "Sin embargo, en caso de que el imputado no emita su consentimiento —escenario general—, será indispensable acudir previamente al JCG para que, mediante audiencia de control previo, verifique la legalidad de la medida."]]}], "ilus": "revisan-documento.webp", "raiz": ""}, "59": {"t": "¿En qué consiste la técnica y para qué se utiliza?", "r": [{"h": "exámenes de ADN", "p": [["", "Los exámenes de ADN constituyen una de las herramientas de identificación técnico-científica más importantes en el marco de las pesquisas propias del proceso penal, en tanto permiten establecer o descartar la vinculación de una determinada persona con ciertos hechos investigados mediante el análisis de material biológico. Por supuesto, esta técnica se refiere a la realización de exámenes de ADN, en virtud de fluidos corporales o similares, los cuales pueden requerir cotejo con la información genética del indiciado o imputado mediante el acceso a bancos de esperma, sangre, consultorios médicos u odontológicos, entre otros."]]}, {"h": "muestras biológicas", "p": [["", "En un principio, la técnica referida no se trata de un registro, por cuanto no opera sobre bienes o espacios que sean de propiedad —o que se encuentren bajo la tenencia— del indiciado o imputado. Por el contrario, se realizan sobre muestras biológicas de éste, pero que se encuentran archivadas y custodiadas por centros especializados."]]}, {"h": "artículo 249 de la Ley 906 de 2004", "p": [["", "Conviene distinguir, en igual sentido, esta diligencia frente a la obtención de muestras que involucren al imputado, regulada en el artículo 249 de la Ley 906 de 2004. Como es lógico, esta diferenciación resulta fundamental para determinar el procedimiento aplicable y el tipo de control judicial que corresponde en cada caso."]]}, {"h": "análisis y cotejo de perfiles genéticos", "p": [["vin", "La técnica sub examine (artículo 245 del CPP) se refiere al análisis y cotejo de perfiles genéticos obtenidos a partir de vestigios biológicos y al acceso a información genética previamente existente,"]]}, {"h": "obtención directa de muestras del imputado", "p": [["vin", "El artículo 249 regula la obtención directa de muestras del imputado para su posterior examen o comprobación, incluidos los casos de ausencia de consentimiento."]]}], "ilus": "p-trio-1.webp", "raiz": "¿En qué consiste la técnica y para qué se utiliza?"}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se

(function () {

  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var e = document.createElement(resumen ? 'button' : 'div'); e.className = 'rama' + (leidos[k] ? ' visto' : '');
      if (resumen) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      var breve = !resumen && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '"><span class="num">' + (k + 1) + '</span><span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin"><span class="num">' + (k + 1) + '</span><span>' + marca(resumen ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3><span class="num">' + (k + 1) + '</span><span>' + esc(may(r.h)) + '</span></h3>') +
        (resumen ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (resumen) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58);
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return actual.k < N - 1
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (actual.k + 2) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = actual.k + 1; if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    if (ult) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight, ew = e.offsetWidth;
    /* al lado de la rama si hay sitio (en la franja ancha casi siempre lo hay); si no, debajo o encima */
    var gx, gy = Math.max(8, Math.min(H - gh - 8, y + e.offsetHeight / 2 - gh / 2));
    if (x + ew + 10 + gw <= W - 8) gx = x + ew + 10;
    else if (x - 10 - gw >= 8) gx = x - 10 - gw;
    else { gx = Math.min(Math.max(10, x + ew / 2 - gw / 2), W - gw - 10); gy = y + e.offsetHeight + 6; if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6); if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) gy = Math.max(8, Math.min(H - gh - 8, y)); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  /* si el marco cambia de forma (dividida ↔ franja ancha) después de cargar, el mapa se vuelve a armar para esa forma */
  window.addEventListener('resize', function () { setTimeout(function () { if (document.documentElement.classList.contains('ancho') !== ANCHO) location.reload(); }, 200); });
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
