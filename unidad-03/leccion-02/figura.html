(function () {

    x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x)); y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
    im.style.width = im.naturalWidth * base * k + 'px'; im.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    m.classList.toggle('zoom', k > 1);

  im.onload = ajusta; window.addEventListener('resize', function () { setTimeout(ajusta, 80); });
  document.getElementById('mas').onclick = function () { acercar(1.6); };
  document.getElementById('menos').onclick = function () { acercar(1 / 1.6); };
  var arr = null, movio = false;
  m.addEventListener('pointerdown', function (e) { arr = { x: e.clientX, y: e.clientY, x0: x, y0: y }; movio = false; m.setPointerCapture(e.pointerId); });

  m.addEventListener('pointerup', function (e) { if (arr && !movio) { var r = m.getBoundingClientRect(); acercar(k >= 4.9 ? 1 / 5 : 1.8, (e.clientX - r.left) / z(), (e.clientY - r.top) / z()); } arr = null; });
