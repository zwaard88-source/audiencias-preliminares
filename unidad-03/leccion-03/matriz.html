<script type="application/json" id="datos">{"49": {"cab": "Técnica especial de investigación", "filas": [{"g": "Vigilancia electrónica y otras formas de vigilancia (Art. 235 CPP; CNUDOT - Típica Nominada)", "n": "Intervención de las comunicaciones telefónicas y telemáticas (Equivalente en Colombia: Art. 235 CPP / Ley 1453 de 2011)", "c": [["FINALIDAD", "Captación y grabación de tráfico de voz, llamadas telefónicas, correo electrónico, chats de mensajería instantánea o tráfico de voz sobre IP (VoIP). Busca obtener EMP/EF, ubicar indiciados/condenados, prevenir delitos y lograr hallazgos casuales."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Inviolabilidad de las comunicaciones privadas e intimidad (Art. 15 inc. 3 CN), secreto profesional abogadil (Art. 74 CN). (En España: Secreto de comunicaciones Art. 18.3 CE e Intimidad Art. 18.1 CE)."], ["FUNDAMENTACIÓN", "Orden escrita motivada del fiscal fundada en motivos razonablemente fundados. Límite temporal inicial de hasta seis (6) meses."], ["CONTROL JUDICIAL", "Control Judicial Posterior: Se realiza ante el JCG dentro de las 24 horas siguientes al recibo del informe de Policía Judicial (Art. 237 CPP). (Subregla de Prórroga: Toda orden de PRÓRROGA exige Control Judicial Previo obligatorio. Sentencia C-131/09)."]]}, {"g": "Vigilancia electrónica y otras formas de vigilancia (Art. 235 CPP; CNUDOT - Típica Nominada)", "n": "Captación y grabación de comunicaciones orales mediante la utilización de dispositivos electrónicos (Equivalente en Colombia: Arts. 239 y 242 CPP) (En España: Arts. 588 quater a a quater m LECrim / LO 13/2015)", "c": [["FINALIDAD", "Instalación subrepticia de micrófonos o dispositivos de escucha y grabación en recintos cerrados, vehículos o vías públicas para captar e intervenir conversaciones orales e imágenes asociadas en tiempo real sin intermediación telemática."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Intimidad personal y familiar (Art. 15 CN), inviolabilidad del domicilio (Art. 28 CN). (En España: Intimidad Art. 18.1 CE, Inviolabilidad del domicilio Art. 18.2 CE y Propia imagen Art. 18.1 CE)."], ["FUNDAMENTACIÓN", "Motivos razonablemente fundados sobre la comisión actual y continua de delitos por estructuras delictivas. Exige juicio de idoneidad, necesidad y proporcionalidad estricta para evitar intromisiones arbitrarias en la intimidad."], ["CONTROL JUDICIAL", "Control Judicial Posterior: En 36 horas cuando se realiza en espacio público, vías o vehículos. (Subregla Domiciliaria: Exige Control Judicial Previo: obligatorio si implica el ingreso o grabación subrepticia en la morada o lugar de trabajo. Sentencia C-156/16)."]]}, {"g": "Vigilancia electrónica y otras formas de vigilancia (Art. 235 CPP; CNUDOT - Típica Nominada)", "n": "Utilización de dispositivos técnicos de captación de imagen, de seguimiento y de localización (Equivalente en Colombia: Arts. 239 y 240 CPP)", "c": [["FINALIDAD", "Seguimiento y geolocalización electrónica en tiempo real de personas y bienes (mediante GPS, triangulación de celdas de telefonía o drones) y captación subrepticia de imágenes (fotografía/video) sin reproducir sonido."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Intimidad personal y expectativa razonable (Art. 15 CN), libertad de locomoción (Art. 24 CN), autodeterminación informativa. (En España: Intimidad Art. 18.1 CE y Propia imagen Art. 18.1 CE)."], ["FUNDAMENTACIÓN", "Motivos razonablemente fundados sobre personas investigadas o bienes utilizados en el ilícito. Constituye una actualización tecnológica de la vigilancia tradicional que amplía su alcance y precisión."], ["CONTROL JUDICIAL", "Control Judicial Posterior: Sometido a revisión formal y material de legalidad ante el JCG dentro de las 36 horas siguientes a la expedición/ejecución del acto (Sentencia C-881/14)."]]}, {"g": "Vigilancia electrónica y otras formas de vigilancia (Art. 235 CPP; CNUDOT - Típica Nominada)", "n": "Registro de dispositivos de almacenamiento masivo de información (Equivalente en Colombia: Art. 236 CPP / Convenio de Budapest, Arts. 16, 17, 19)", "c": [["FINALIDAD", "Registro estático, acceso, examen e informática forense (copia espejo, código hash) sobre soportes físicos o medios digitales incautados (corpus mechanicum: celulares, computadores, discos duros, USB, servidores) para extraer datos almacenados."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Derecho al entorno virtual, intimidad digital reforzada, Habeas Data e inviolabilidad de documentos privados (Art. 15 CN). (En España: Entorno virtual y Habeas Data Art. 18.4 CE)."], ["FUNDAMENTACIÓN", "Motivos razonablemente fundados de que el sistema fue medio de transmisión o depósito de evidencia probatoria. Exige estricta preservación de la cadena de custodia."], ["CONTROL JUDICIAL", "Control Judicial Posterior: Tramitado dentro de las 36 horas posteriores por aplicación analógica de las reglas de registros y allanamientos (CSJ STP2633-2025). (Excepción por Liberalidad: No requiere control judicial cuando la víctima o un interlocutor entrega voluntariamente el celular o los chats — Autos CSJ AP3439-2024 y AP4384-2018)."]]}, {"g": "Vigilancia electrónica y otras formas de vigilancia (Art. 235 CPP; CNUDOT - Típica Nominada)", "n": "Registro remoto sobre equipos informáticos (Equivalente en Colombia: Art. 242B CPP / Ley 1908 de 2018)", "c": [["FINALIDAD", "Infiltración a distancia, clandestina y potencialmente prolongada en equipos o sistemas informáticos mediante software especializado (spyware, malware, troyanos) para acceder al entorno virtual e intervenir canales cerrados cifrados."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Intimidad en el entorno virtual, secreto de comunicaciones virtuales cerradas (Art. 15 CN), confidencialidad del sistema informático (Ley 1273 de 2009). (En España: Art. 18.1, 18.3 y 18.4 CE)."], ["FUNDAMENTACIÓN", "Demostrar que la organización criminal (GDO/GAO) opera a través de canales cerrados de comunicación virtual y que la medida es indispensable tras superar el test de proporcionalidad."], ["CONTROL JUDICIAL", "Control Judicial Previo: Requiere autorización previa motivada del Juez de Control de Garantías (Art. 242B Parágrafo CPP)."]]}, {"g": "", "n": "Agentes encubiertos y operaciones encubiertas (Arts. 241, 242, 242A CPP - Típica Nominada)", "c": [["FINALIDAD", "Infiltración de policía judicial, particulares o miembros de GDO/GAO en estructuras delictivas o redes de corrupción para recaudar EMP/EF."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Intimidad del domicilio (Art. 28 CN), intimidad personal e historial (Art. 15 CN), secreto de comunicaciones (Art. 15 CN), confianza legítima (Art. 83 CN). Proscripción del agente provocador."], ["FUNDAMENTACIÓN", "Orden escrita del Director de Fiscalía frente a actividad criminal actual y continua de asociación. Proscripción del agente provocador."], ["CONTROL JUDICIAL", "Control Judicial Posterior: Dentro de las 36 horas posteriores a la conclusión de la operación. (Exige Control Judicial Previo si ingresa a morada o trabajo. Sentencia C-156/16)."]]}, {"g": "", "n": "Entrega vigilada (Art. 243 CPP - Típica Nominada)", "c": [["FINALIDAD", "Permitir la salida, tránsito o entrada de remesas ilícitas (drogas, armas, divisas, moneda) para identificar la cadena criminal completa y sus cabecillas."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Inviolabilidad de envíos postales (Art. 15 CN), libertad de circulación (Art. 24 CN), intimidad comercial e industrial (Art. 15 CN)."], ["FUNDAMENTACIÓN", "Autorización del Director de Fiscalía. Prohibición absoluta de inducir o sembrar la idea criminal (agente provocador)."], ["CONTROL JUDICIAL", "Control Judicial Posterior: Sometida a revisión de legalidad ante el JCG dentro de las 36 horas siguientes a la finalización de la operación (Art. 243 CPP)."]]}, {"g": "", "n": "Agente encubierto informático (Art. 242B CPP / Ley 1908 de 2018 - Típica Emergente)", "c": [["FINALIDAD", "Infiltración subrepticia en canales cerrados de comunicación virtual, foros cifrados o comunidades privadas para investigar cibercrímenes y GDO/GAO."], ["DERECHOS FUNDAMENTALES INVOLUCRADOS", "Derecho al entorno virtual, intimidad en canales cerrados (Art. 15 CN), secreto de comunicaciones telemáticas cifradas (Art. 15 inc. 3 CN), confidencialidad de sistemas (Ley 1273 de 2009). (En España: Art. 282 bis 6 y 7 LECrim)."], ["FUNDAMENTACIÓN", "Acreditación de que la red criminal opera en canales cerrados virtuales. Habilitado para intercambiar/enviar archivos ilícitos por su contenido."], ["CONTROL JUDICIAL", "Control Judicial Previo: Requiere autorización previa obligatoria del JCG para la infiltración e interferencia activa en canales cerrados (Art. 242B Parágrafo CPP)."]]}], "t": "Representación gráfica No. 2: Síntesis sobre las TEI"}}</script>

<script>
/* Matriz de la fuente (cuarta pasada, 25/11/2026). Una tabla del documento se muestra entera si cabe con letra legible; si no, se
   recorre por filas: a la izquierda, la lista de filas (agrupadas si la tabla trae grupos) y a la derecha, todas las columnas de la
   fila elegida, cada una con su encabezado. Así no se pierde qué va con qué (antes la tabla iba en pestañas por columna) y nada
   queda cortado ni con barra de desplazamiento.
   datos[m] = {t: título, cab: encabezado de la primera columna, filas: [{g: grupo o '', n: nombre de la fila, c: [[encabezado, texto], …]}]}. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), Z = document.getElementById('mz'), L = document.getElementById('lista'), P = document.getElementById('panel'), AV = document.getElementById('avance');
  if (!d) return;
  lz.setAttribute('aria-label', 'Tabla: ' + d.t);
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[\^(\d+)\]/g, '<sup>$1</sup>'); }
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  /* ¿el contenido cabe en su caja con «aire» píxeles de sobra? Se mide por el borde de los hijos (scrollHeight no baja del alto de la caja). */
  function cabe(caja, aire) { var c = caja.getBoundingClientRect(), b = 0; [].forEach.call(caja.children, function (h) { b = Math.max(b, h.getBoundingClientRect().bottom); }); return b <= c.bottom - aire * (c.height / Math.max(1, caja.clientHeight)); }
  function parr(t) { return String(t).split('\n').map(function (x) { return '<p>' + esc(x) + '</p>'; }).join(''); }
  /* nombre corto para la lista: sin el paréntesis de equivalencias o artículos; el nombre completo va en el panel */
  function corto(t) { var i = t.indexOf(' ('); return i > 12 ? t.slice(0, i) : t; }
  var N = d.filas.length, C = d.filas[0].c.map(function (c) { return c[0]; });

  /* 1) entera, como tabla, si cabe */
  function entera() {
    var cols = '<div class="th">' + esc(may(d.cab || '')) + '</div>' + C.map(function (c) { return '<div class="th">' + esc(may(c.toLowerCase())) + '</div>'; }).join('');
    var g0 = null, cuerpo = d.filas.map(function (f) {
      var grupo = f.g && f.g !== g0 ? '<div class="tg">' + esc(f.g) + '</div>' : ''; g0 = f.g;
      return grupo + '<div class="tn">' + esc(f.n) + '</div>' + f.c.map(function (c) { return '<div class="td">' + parr(c[1]) + '</div>'; }).join('');
    }).join('');
    var T = document.createElement('div'); T.className = 'mzt'; T.style.gridTemplateColumns = 'minmax(150px,.8fr) repeat(' + C.length + ',1fr)'; T.innerHTML = cols + cuerpo;
    Z.style.display = 'none'; lz.insertBefore(T, Z);
    /* tabla corta: letra grande; baja solo si hace falta. Se mide arriba (align-content:start) y al final se centra. */
    function medir(min) { var fz = 18.2; T.style.alignContent = 'start'; T.style.setProperty('--fz', fz + 'px'); while (!cabe(T, 4) && fz > min) { fz -= 0.4; T.style.setProperty('--fz', fz + 'px'); } var ok = cabe(T, 0); T.style.alignContent = ''; return ok; }
    if (!medir(12.6)) { T.remove(); Z.style.display = ''; return false; }
    AV.innerHTML = '<i class="fas fa-table-list" aria-hidden="true"></i> Tabla completa: ' + N + ' filas';
    /* la letra del curso llega después de la primera medida, y el marco puede cambiar de tamaño: se vuelve a medir */
    function otra() { medir(11.6); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(otra, 40); });
    window.addEventListener('resize', function () { setTimeout(otra, 160); }); setTimeout(otra, 900);
    return true;
  }
  if (N <= 5 && entera()) return;

  /* 2) por filas */
  var vistos = {}, botones = [], g0 = null;
  d.filas.forEach(function (f, k) {
    if (f.g && f.g !== g0) { var h = document.createElement('h4'); h.textContent = corto(f.g); L.appendChild(h); }
    g0 = f.g;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'fila' + (f.g ? ' en-grupo' : ''); b.setAttribute('role', 'tab');
    b.innerHTML = '<span class="n">' + (k + 1) + '</span><span>' + esc(corto(f.n)) + '</span>';
    b.addEventListener('click', function () { ver(k); });
    L.appendChild(b); botones.push(b);
  });
  /* la lista completa a la vista: se aprieta de a poco hasta caber (con dos píxeles de aire, por los redondeos del zoom) */
  function apretar() { L.classList.remove('c1', 'c2', 'c3', 'c4'); ['c1', 'c2', 'c3', 'c4'].some(function (c) { if (cabe(L, 2)) return true; L.classList.add(c); return false; }); }
  apretar();
  function ver(k) {
    var f = d.filas[k];
    botones.forEach(function (b, i) { b.classList.toggle('activa', i === k); b.setAttribute('aria-selected', i === k ? 'true' : 'false'); });
    vistos[k] = 1; botones[k].classList.add('visto');
    var ceja = f.g ? f.g : (d.cab || '');
    P.innerHTML = '<h3>' + (ceja ? '<small>' + esc(ceja) + '</small>' : '') + esc(f.n) + '</h3><div class="celdas' + (f.c.length < 2 ? ' una' : '') + '">' +
      f.c.map(function (c) { return '<div class="celda"><h5>' + esc(c[0]) + '</h5>' + parr(c[1]) + '</div>'; }).join('') + '</div>';
    /* todo a la vista: la letra baja de a poco hasta que las columnas de la fila quepan en el panel */
    var X = P.querySelector('.celdas'), fz = 15;
    X.style.setProperty('--fz', fz + 'px');
    while (!cabe(X, 2) && fz > 11.8) { fz -= 0.3; X.style.setProperty('--fz', fz + 'px'); }
    X.style.overflow = cabe(X, 0) ? '' : 'auto';
    var n = Object.keys(vistos).length;
    AV.innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Recorrió las ' + N + ' filas.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-table-list" aria-hidden="true"></i> Elija cada fila de la izquierda · vistas: <b>' + n + ' de ' + N + '</b>';
  }
  ver(0);
  /* la letra del curso llega después de la primera medida, y el marco puede cambiar de tamaño: se vuelve a medir */
  function otra() { apretar(); var a = botones.findIndex(function (b) { return b.classList.contains('activa'); }); ver(a < 0 ? 0 : a); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(otra, 40); });
  window.addEventListener('resize', function () { setTimeout(otra, 160); }); setTimeout(otra, 900);
})();
</script>
