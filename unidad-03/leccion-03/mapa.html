<script type="application/json" id="datos">{"1": {"t": "Comprensión, práctica y control judicial de técnicas especiales de investigación", "r": [{"h": "injerencias en los derechos fundamentales", "p": [["", "Como se ha visto hasta el momento, los actos de investigación en el marco del proceso penal implican, en no pocos casos, injerencias en los derechos fundamentales. A nivel transnacional, es posible identificar ciertos derechos fundamentales sobre los cuales repercuten estas técnicas, como ocurre en España con el derecho a la intimidad, a la inviolabilidad del domicilio, al secreto de las comunicaciones y, de manera más general, a la libertad individual, a la integridad física corporal, a la propiedad y, finalmente, a la autodeterminación informativa[^0]."], ["nota", "[^0] Constitución Española, arts.15, 17.3, 18.1, 18.2, 18.3, 18.4, 19 y 33; al igual que el Convenio Europeo de Derechos Humanos."]]}, {"h": "lucha contra la criminalidad organizada", "p": [["", "En la denominada lucha contra la criminalidad organizada, el caso no es distinto. Las técnicas empleadas para realizar estas acciones de investigación, en el campo de la investigación penal contra la Delincuencia Organizada Transnacional (DOT), pretenden obtener datos, información, conocimiento y elementos de convicción para identificar e individualizar a los involucrados en los delitos que se investigan, también para identificar organizaciones, personas, interacciones, redes, bienes, contactos y, con base en ello, constituirse como fuente de prueba en el marco de un proceso penal."], ["", "Siendo esta la finalidad de los métodos de investigación descritos, como es de esperarse, supone una intervención cada vez más intensa sobre los derechos fundamentales; reduciéndose cada vez más las garantías de los procesados dentro del proceso penal contemporáneo."]]}, {"h": "Técnicas Especiales de Investigación (TEI)", "p": [["", "Estas actividades tan singulares, de acuerdo con la literatura especializada, se denominan Técnicas Especiales de Investigación (TEI) y, en el ámbito de la persecución de la delincuencia organizada, revisten un carácter compuesto e integrado en dos dimensiones: una (a) cuantitativa y otra (b) cualitativa. La primera, en cuanto se incluyen múltiples actividades, complejas y prolongadas, ejecutadas por organizaciones y operaciones delictivas también complejas. La segunda, por la necesidad de especialización de los profesionales que investigan, por el uso de técnicas investigativas o métodos especializados."], ["", "Sobre esto último, la Oficina de las Naciones Unidas contra la Droga y el Delito (UNODC) insiste en que las TEI son instrumentos o elementos especializados de investigación cualitativa en la lucha contra la DOT, tanto así que se expresa, por parte de expertos, su énfasis en la interacción entre los delincuentes y con los delincuentes."]]}, {"h": "criterios recurrentes", "p": [["", "De acuerdo con lo anterior, pueden identificarse algunos criterios recurrentes en los discursos de justificación jurídica que resultan relevantes para la definición y comprensión de las TEI. A grandes rasgos, son los siguientes:"], ["vin", "Naturaleza técnica y específica, al ser métodos de investigación social o científica aplicados exclusivamente a la criminalidad organizada y que exigen un marco conceptual claro con formación especializada."], ["vin", "Injerencia en derechos fundamentales, lo cual impone una estricta doble condición normativa sujeta a reserva legal y a reserva judicial mediante autorización motivada."], ["vin", "Carácter excepcional, que demanda la valoración del caso concreto, la búsqueda de medios menos lesivos y una solicitud fundamentada antes de su uso."], ["vin", "Finalidad constitucionalmente legítima y orientación a resultados, esto es, por razones político-criminales a la prevención, identificación y desestructuración de la delincuencia organizada local y transnacional."], ["vin", "Gestión de la información privilegiada, en tanto se impone un riguroso control sobre la cadena de custodia, la fuente de la prueba y su incorporación al proceso."]]}], "ilus": "dialogo-carpeta.webp", "raiz": ""}, "5": {"t": "Vigilancia electrónica y otras formas de vigilancia (TEI típica nominada)", "r": [{"h": "procesos de vigilancia", "p": [["", "El desarrollo de las sociedades contemporáneas ha transformado sustancialmente las intervenciones y procesos de vigilancia empleados en la investigación penal, que cada vez son más automatizados y ejecutados a través de medios digitales. Frente a las modalidades tradicionales de seguimiento y observación, los medios electrónicos ofrecen una amplia gama de posibilidades: obtener, almacenar y procesar grandes volúmenes de información relativa a las comunicaciones, los desplazamientos, las relaciones y los comportamientos de las personas que se encuentran sometidas a investigación."], ["", "Dicho cambio de paradigma ha favorecido, asimismo, el tránsito desde formas predominantemente físicas de documentación hacia fuentes de información digital, cuya obtención y utilización plantean particulares desafíos jurídicos, especialmente en lo atinente a la prueba."]]}, {"h": "CNUDOT", "p": [["", "Efectivamente, la CNUDOT reconoce expresamente la “vigilancia electrónica y otras formas de vigilancia” como una de las TEI susceptibles de ser empleadas por la FGN para combatir la delincuencia organizada; constituyéndose como una TEI típica nominada. No obstante, conviene distinguir la vigilancia, entendida en sentido amplio, de la vigilancia electrónica como TEI. La primera comprende actividades tradicionales de seguimiento y observación que, mientras no trasciendan la expectativa razonable de intimidad, pueden desarrollarse a título de actividades ordinarias de policía."], ["", "La segunda, por su parte, comprende ciertas modalidades de vigilancia que, mediante el empleo de tecnologías electrónicas, comportan una injerencia particularmente nociva en torno a la esfera de protección jurídica de la persona investigada y que, por ello, requieren de reglamentaciones y controles judiciales rigurosos."]]}, {"h": "manifestaciones de esta técnica", "p": [["", "Entre las manifestaciones de esta técnica, es posible encontrar actos de investigación como la búsqueda selectiva en bases de datos, la entrega de listados de llamadas, identificación de los posicionamientos geográficos de teléfonos, interceptación de accesos a internet y mensajería instantánea, intervención y volcado de los dispositivos electrónicos (teléfono y ordenador), grabación a través de medios electrónicos, seguimiento y captación de imágenes a través de drones, entre otros."], ["", "Su utilización adquiere especial relevancia en las investigaciones sobre delincuencia organizada, en las cuales las estructuras criminales pueden valerse de medios tecnológicos para desarrollar sus actividades y dificultar su detección por las autoridades."]]}, {"h": "artículo 235 del CPP", "p": [["", "Mientras que en Colombia el artículo 235 del CPP contempla la Interceptación de comunicaciones de forma genérica sobre cualquier red de comunicaciones, en marcos normativos comparados —como la Ley Orgánica 13/2015 de España— existen modalidades tipificadas de forma sumamente específica."], ["", "Particularmente, se destacan cinco: (a) intervención de las comunicaciones telefónicas y telemáticas; (b) captación y grabación de comunicaciones orales mediante la utilización de dispositivos electrónicos; (c) utilización de dispositivos técnicos de captación de imagen, de seguimiento y de localización; (d) registro de dispositivos de almacenamiento masivo de información; (e) registro remoto sobre equipos informáticos."]]}], "ilus": "m-vigilancia.webp", "raiz": ""}, "8": {"t": "Captación y grabación de comunicaciones orales mediante la utilización de dispositivos electrónicos", "r": [{"h": "LO 13/2015", "p": [["", "En España, hasta la LO 13/2015, esta práctica de investigación no se encontraba regulada en el proceso penal. De tal manera, el legislador ibérico consideró que era necesario legislar sobre el particular y superar aquella “omisión histórica”, de cara a las nuevas tendencias delictuales. Dentro del debate en el parlamento, hubo dos destacables: de una parte, conforme al principio de reserva judicial, se formuló la exigencia de que sea el juez de instrucción el que legitime el acto de injerencia."], ["", "Y, en segundo lugar, reafirmó la necesidad de que la medida se justifique o motive con base en el cumplimiento de los principios rectores de especialidad, excepcionalidad, idoneidad, necesidad y proporcionalidad, como las demás medidas que hemos abordado."]]}, {"h": "instalación de dispositivos tecnológicos", "p": [["", "Esta técnica, natural de España, consiste en la instalación de dispositivos tecnológicos de escucha y grabación que, de acuerdo con la norma, pueden ser puestos de manera subrepticia en el interior o en el exterior del domicilio o de un lugar cerrado. Esta técnica incluye dos modalidades de injerencia en las libertades de la persona investigada. De una parte, la intervención del audio producto de sus comunicaciones a través de conversaciones o interacción directa con otros sin ningún tipo de intermediación. De otra parte, la imagen asociada a ese audio."]]}, {"h": "vida privada de los investigados", "p": [["", "Lo anterior implica, por supuesto, una fuerte intromisión por parte de los órganos de investigación judicial en la vida privada de los investigados y eventualmente de terceros no investigados que interactúen con él en lugares de naturaleza pública y privada, en atención a la Ley de Enjuiciamiento Criminal (LECrim). Por lo tanto, esta medida no deja de representar altos riesgos de afectación directa hacia los derechos fundamentales, entre ellos, el derecho a la intimidad, el derecho a su propia imagen, el secreto de las comunicaciones, la protección de los datos personales e incluso la inviolabilidad del domicilio."]]}, {"h": "formas de intromisión menos intensas", "p": [["", "“Son imaginables formas de intromisión menos intensas que la que se desarrolla en el interior del domicilio. La colocación de dispositivos de grabación en un restaurante en el que va a producirse un encuentro entre investigados, la instalación de micrófonos en el interior de un vehículo que es habitual lugar de encuentro con otros sospechosos y, en fin, la grabación en una oficina en la que se prevé que va a concertarse la estrategia delictiva, son medidas de investigación que, pese a su incidencia directa en el espacio de privacidad, toleran una autorización judicial conforme a los criterios más extendidos de valoración indiciaria."], ["", "Pero nada de esto es equiparable a la grabación de las conversaciones de todos aquellos que, además del investigado, conviven en el mismo domicilio."]]}], "ilus": "", "raiz": ""}, "10": {"t": "Utilización de dispositivos técnicos de captación de imagen, de seguimiento y de localización", "r": [{"h": "utilización de dispositivos técnicos de captación", "p": [["", "La utilización de dispositivos técnicos de captación de imagen, de seguimiento y de localización, es también otra TEI española. Esta implica el uso de dispositivos técnicos que puedan captar imágenes, el uso de dispositivos técnicos con la capacidad para hacer seguimientos y, además, el uso de dispositivos técnicos de geolocalización del investigado. Estos dos últimos, son dispositivos que permiten fijar a una persona en el espacio pero que no reproducen su imagen o el sonido."]]}, {"h": "seguimiento mediante dispositivos electrónicos", "p": [["", "El seguimiento mediante dispositivos electrónicos puede efectuarse, fundamentalmente, a través de dos modalidades. En la primera, se emplean los dispositivos utilizados por el propio investigado —como teléfonos móviles, ordenadores, smartphones o tabletas—, cuya utilización puede requerir la colaboración de los proveedores de servicios de comunicación para acceder a los datos necesarios para establecer su ubicación. En la segunda, la localización se obtiene mediante el uso de dispositivos de las fuerzas de seguridad instalados o utilizados directamente por las autoridades encargadas de la investigación."], ["", "En ambos supuestos, la tecnología permite trasladar el seguimiento tradicional al ámbito de la localización electrónica, ampliando significativamente la capacidad de las autoridades para determinar los desplazamientos y movimientos de una persona."]]}, {"h": "actualización tecnológica", "p": [["", "Como señala Merkel (2017, p. 252), no se trata, en sentido estricto, de una técnica completamente novedosa. Por el contrario, constituye una actualización tecnológica de la clásica actividad de seguimiento, con una única novedad: las posibilidades que ofrecen las tecnologías de la información y las comunicaciones para incrementar su precisión, continuidad y alcance."], ["", "Precisamente por este motivo, aunque el seguimiento posee una larga tradición en la labor investigativa, su modalidad electrónica se encuentra en boga a causa de que el desarrollo tecnológico ha ampliado las posibilidades de vigilancia hasta alcanzar niveles de intensidad difícilmente previsibles en sus manifestaciones tradicionales."]]}, {"h": "modalidad de utilización de dispositivos técnicos", "p": [["", "Por otro lado, es menester señalar que la modalidad de utilización de dispositivos técnicos para captar la imagen del investigado ha sido catalogada como una excepción a la obligatoriedad de la orden judicial previa (Merkel, 2017, p. 252). De acuerdo con la literatura especializada, se trata de una medida que no afecta de manera intensa el derecho a la intimidad o el derecho a la propia imagen, lo que llevaría como consecuencia la posibilidad legítima de pretermitir la orden judicial previa."], ["", "Sin embargo, aunque esta medida es la más leve de las actividades de vigilancia reguladas en el proceso penal español, también es cierto que se trata una medida que se ejecuta sin el conocimiento del afectado y de manera subrepticia, todo lo cual debería ser suficiente para aplicar las garantías asociadas a la tutela y protección de la autodeterminación informativa del afectado, tanto de acceso a su información como al control de esta."]]}], "ilus": "m-vigilancia.webp", "raiz": ""}, "15": {"t": "Marco normativo internacional, transnacional y nacional", "r": [{"h": "registro de dispositivos de almacenamiento masivo", "p": [["", "En el ámbito internacional, el registro de dispositivos de almacenamiento masivo de información encuentra su principal fundamento en el Convenio sobre la Ciberdelincuencia de Budapest de 2001, primer instrumento internacional vinculante en materia de investigación de delitos informáticos."], ["", "Este convenio establece mecanismos para la preservación, registro, obtención e incautación de datos informáticos almacenados, especialmente en sus artículos 16 (conservación rápida de datos informáticos almacenados), 17 (conservación y revelación parcial de datos de tráfico), 19 (registro y confiscación de datos informáticos almacenados), 20 (recolección en tiempo real de datos de tráfico) y 21 (interceptación del contenido de las comunicaciones)."], ["", "Dicho instrumento faculta a los Estados para adoptar medidas de investigación sobre sistemas y dispositivos electrónicos, siempre que se respeten los derechos fundamentales y las garantías procesales."]]}, {"h": "artículo 17", "p": [["", "El ejercicio de esta facultad investigativa, en cambio, debe armonizarse con los instrumentos internacionales de protección de los derechos humanos. Desde este punto de vista, el artículo 17 del Pacto Internacional de Derechos Civiles y Políticos y el artículo 11 de la Convención Americana sobre Derechos Humanos prohíben las injerencias arbitrarias o ilegales en la vida privada de los ciudadanos o personas."], ["", "En el sistema regional europeo para la protección de derechos humanos, el artículo 8 del Convenio Europeo de Derechos Humanos, desarrollado ampliamente por la jurisprudencia del Tribunal Europeo de Derechos Humanos, protege la información contenida en dispositivos electrónicos como parte de la esfera privada."]]}, {"h": "Reglamento (Ue) 2016/679", "p": [["", "Asimismo, el Reglamento (Ue) 2016/679 del Parlamento Europeo y del Consejo del 27 de Abril de 2016 y la Directiva 2002/58/CE de la Unión Europea sobre privacidad y comunicaciones electrónicas consolidan estándares para la protección de los datos almacenados en equipos terminales, al igual que para el acceso estatal a dicha información bajo criterios de legalidad, necesidad y proporcionalidad."], ["", "El párrafo 21 de la Directiva 2002/58/CE establece que los Estados deben adoptar medidas para evitar el acceso no autorizado a las comunicaciones a fin de proteger la confidencialidad de las mismas, incluidos tanto sus contenidos como cualquier dato relacionado con ellas, por medio de las redes públicas de comunicaciones y los servicios de comunicaciones electrónicas disponibles al público. Por esto, la legislación nacional de algunos Estados miembros prohíbe solamente el acceso intencionado no autorizado a las comunicaciones."]]}, {"h": "tratamiento de datos personales", "p": [["", "Se reconoce, también, que el tratamiento de datos personales puede estar justificado cuando resulte estrictamente necesario y proporcionado para garantizar la seguridad de las redes y de los sistemas de información. En este contexto, el considerando 49 del Reglamento General de Protección de Datos (RGPD) admite que determinadas autoridades públicas y organismos especializados puedan acceder y tratar información digital con el fin de prevenir, detectar e investigar incidentes de ciberseguridad, accesos no autorizados, ataques informáticos o la propagación de software malicioso."]]}], "ilus": "", "raiz": ""}, "18": {"t": "Legislación comparada", "r": [{"h": "registro de dispositivos de almacenamiento masivo de información", "p": [["", "Con relación al registro de dispositivos de almacenamiento masivo de información, la legislación no contempla una norma específica que desarrolle, en estricto sentido, el registro de dispositivos de almacenamiento masivo de información. Sin embargo, es posible que se realice este tipo de actividades de investigación en tanto la recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones."]]}, {"h": "transmisión de datos a través de redes de comunicación", "p": [["", "La norma que regula este tipo de actividades de indagación e investigación en Colombia, hace referencia a la información producto de la transmisión de datos a través de redes de comunicación, por lo que, en principio, podría sostener que la TEI se encuadra dentro de una especie de interceptación de comunicaciones."], ["", "No obstante, durante su ejecución, la norma prevé escenarios de retención o aprehensión de equipos terminales, dispositivos o servidores que hayan podido haberse usado como medio de almacenamiento físico o virtual, análogo o digital, con el propósito de que se descubra, recolecte, analice y custodie la información recuperada, a partir de procedimientos técnicos de informática forense."]]}, {"h": "medida de registro de equipos", "p": [["", "De tal modo, la TEI examinada se trata de una medida de registro de equipos orientada a la obtención de información producto de la transmisión de datos a través de redes de comunicación. La finalidad de la medida constituye un objeto diferente: no es el registro del equipo para obtener la información contenida en el equipo, sino la obtención de la información producto de la transmisión de datos."], ["", "Luego entonces, se presenta una seria incógnita, cuya respuesta parece ser negativa: ¿la información contenida en el equipo, que no corresponde a información producto de la transmisión de datos, se pueda recoger, analizar, custodiar y usar como prueba?"]]}, {"h": "Manual Único de Policía Judicial", "p": [["", "En consonancia con lo anterior, el Manual Único de Policía Judicial de 2025 prevé que el registro a equipos electrónicos o dispositivos de almacenamiento corresponde a un actuación que exige una orden de fiscal, mientras que el registro a medios electrónicos o similares resulta ser una actuación sometida a control judicial posterior;"], ["", "es decir, cuyos resultados —una vez finalizadas— deben ser comunicadas, sin sobrepasar las 12 horas, mediante informe, por el servidor de policía de judicial al fiscal del caso, con el fin de que, dentro de las veinticuatro 24 horas siguientes del recibido, comparezca ante el juez con función de control de garantías para solicitar su legalidad."]]}, {"h": "serio riesgo para con los derechos fundamentales", "p": [["", "Así pues, es posible afirmar que este tipo de actividades de investigación representan un serio riesgo para con los derechos fundamentales, al implicar la recuperación de información transmitida por una red, normalmente conservada por operadores o proveedores de servicios, aunque ya haya finalizado la comunicación. Por si fuera poco, al aplicarse las reglas análogas de la técnica del registros y allanamientos y no preverse expresamente un control previo, la recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones únicamente requiere de un control posterior de un JCG."], ["", "Lo anterior resulta manifiestamente desproporcionado, como quiera que el registro de dispositivos de almacenamiento masivo de información requiere como regla general de un control judicial previo, y esta TEI se limita a recaer sobre un dispositivo físico (computador, disco duro, USB, celular, servidor, tarjeta SD, etc.) a fin de intentar acceder a la información allí almacenada."]]}], "ilus": "investigacion-lupa.webp", "raiz": ""}, "21": {"t": "Registro remoto sobre equipos informáticos", "r": [{"h": "registro remoto de equipos informáticos", "p": [["", "El registro remoto de equipos informáticos constituye una de las modalidades de investigación tecnológica con mayor capacidad de injerencia en los derechos fundamentales, debido a que permite acceder, sin conocimiento del titular o usuario, a la información almacenada en un dispositivo o sistema informático. Su particularidad no reside únicamente en el empleo de medios tecnológicos, sino en la posibilidad de efectuar una intervención a distancia, clandestina y potencialmente prolongada, capaz de alcanzar una cantidad considerable de información perteneciente a la esfera privada del investigado."], ["", "De ahí que la doctrina haya advertido sobre los riesgos que comporta su utilización."]]}, {"h": "Bachmaier Winter (2017)", "p": [["", "Bachmaier Winter (2017), por su parte, considera que el registro remoto de equipos informáticos constituye una de las medidas más novedosas incorporadas —al no existir una norma expresa que permitiera su práctica— por la reforma de la Ley de Enjuiciamiento Criminal de 2015, pero también una de las más invasivas para los derechos fundamentales (Bachmaier Winter, 2017, pp. 1-36)."]]}, {"h": "dos modalidades de acceso remoto", "p": [["", "Desde el punto de vista técnico, pueden distinguirse dos modalidades de acceso remoto. La primera, corresponde al denominado computer network, mediante el cual se accede a datos contenidos en un equipo que ha sido previamente localizado o intervenido y, a partir de este, se obtiene información disponible a través de una red accesible. La segunda, corresponde al remote search of computers, consistente en el acceso a equipos que no se encuentran físicamente localizados o disponibles para las autoridades, mediante la utilización de programas especializados que permiten ingresar al sistema sin conocimiento ordinario de su usuario."], ["", "Esta segunda modalidad es la que plantea mayores dificultades desde la perspectiva de las garantías constitucionales, por cuanto el empleo de spyware, malware, troyanos u otros programas de acceso remoto puede permitir que las autoridades ingresen subrepticiamente en un sistema informático y obtengan información que, de otro modo, permanecería bajo el control exclusivo de su titular."]]}, {"h": "diferencia respecto del registro físico", "p": [["", "La diferencia respecto del registro físico resulta particularmente relevante para el análisis judicial. En el registro ordinario de un dispositivo de almacenamiento masivo existe un acceso directo al objeto material sobre el cual recae la diligencia; en el registro remoto, por el contrario, existe un acceso a distancia, clandestino y potencialmente prolongado al sistema informático. Esta diferencia formal produce una consecuencia material: la autoridad puede encontrarse en condiciones de acceder, durante el período autorizado, a una multiplicidad de contenidos que exceden ampliamente la información inicialmente buscada."], ["", "Por ello, la medida no puede concebirse como una autorización genérica para explorar la totalidad de la vida digital de una persona."]]}, {"h": "situación colombiana", "p": [["", "La situación colombiana presenta una dificultad adicional, en vista de que no existe una regulación procesal expresa y específica de esta TEI, como sí ocurre en España. De cualquier manera, en las legislaciones en que existen figuras jurídicas similares, existe un límite fundamental relacionado con el grado de sospecha exigible. La especial intensidad de esta técnica impide que su autorización se fundamente en meras intuiciones, conjeturas o sospechas subjetivas."], ["", "Aun cuando no existe plena uniformidad acerca del contenido de categorías como “sospechas razonables”, “indicios racionales” o “delito probable”, para efectos del control judicial resulta indispensable que la Fiscalía explique de manera verificable el origen de la información que sustenta la solicitud y la relación existente entre esa información, el hecho investigado y el dispositivo que pretende ser intervenido."]]}], "ilus": "m-dispositivos.webp", "raiz": ""}, "23": {"t": "Agentes encubiertos", "r": [{"h": "¿En qué consiste la técnica y para qué se utiliza?", "p": [["", "Según el Manual Único de Policía Judicial de la FGN (2025), la operación encubierta es:"]]}, {"h": "infiltrar o penetrar un grupo delictivo organizado", "p": [["", "“una técnica especial de investigación con la que uno o varios agentes con funciones de policía judicial, servidores públicos sin funciones de policía judicial o particulares, son autorizados para infiltrar o penetrar un grupo delictivo organizado mediante, con el fi n de buscar EMP y EF, ubicar e identificar partícipes, bienes, instrumentos y productos en la comisión de una conducta punible y recolectar información que resulte de interés para la investigación penal."]]}, {"h": "operaciones encubiertas", "p": [["", "Las operaciones encubiertas se podrán utilizar contra la corrupción, cuando se verifique la posible existencia de hechos constitutivos de delitos contra la administración pública en una entidad pública, en los términos del artículo 242 A de la Ley 906 de 2004.”"]]}], "ilus": "m-encubierto.webp", "raiz": ""}, "33": {"t": "¿En qué consiste la técnica y para qué se utiliza?", "r": [{"h": "artículo 243 de la Ley 906 de 2004", "p": [["", "La entrega vigilada, regulada en el artículo 243 de la Ley 906 de 2004, se refiere a una técnica «consistente en dejar que remesas ilícitas o sospechosas salgan del territorio de uno o más Estados, lo atraviesen o entren en él, con el conocimiento» (Convención de las Naciones Unidas contra la Delincuencia Organizada Transnacional, 2000). Esto con el fin de identificar a sus responsables, establecer las formas en que opera la organización delictiva y obtener elementos materiales probatorios y evidencia física, sin que se obstaculice prematuramente la investigación."]]}, {"h": "doctrina especializada", "p": [["", "La doctrina especializada (Escalante, 2026, p. 174) y los instrumentos internacionales (OEA, 2019, p. 99.) tipifican la Entrega vigilada con arreglo a tres criterios preponderantes: (a) la cantidad de Estados involucrados, (b) el grado de modificación del objeto material y (c) el área o ámbito de circulación."]]}, {"h": "entrega directa e indirecta", "p": [["vin", "Sobre el primero (a), es posible distinguir entre entrega directa e indirecta. La directa, se presenta cuando participan solamente dos países, bien donde se origina o inicia y donde termina o destino final. En contraposición, la indirecta ocurre cuando existen o se involucran, como mínimo, tres Estados y uno de estos es solamente de tránsito."]]}, {"h": "entregas vigiladas con y sin sustitución", "p": [["vin", "Con respecto a la segunda (b), existen entregas vigiladas con y sin sustitución. Existe sustitución cuando los bienes usados son sustituidos en forma total o parcial, por objetos o sustancias similares e inofensivas con apariencia original a la ilícita. No habrá lugar a dicha sustitución en caso de que los bienes usados sean objeto de vigilancia pasiva por parte de las agencias policiales, sin ser sustituidos parcial o totalmente."]]}, {"h": "entregas controladas", "p": [["vin", "Frente a la última de las distinciones (c), la doctrina ha diferenciado tres tipos de existen entregas controladas (i) nacional o tránsito controlado interno, (ii) interna o exportación controlada y (iii) externa o tránsito internacional controlado (Escalante, 2026, p. 173-174)."], ["vin", "La primera (i) se presenta cuando se tiene pleno conocimiento que los bienes usados tienen su origen, tránsito y destino solamente a nivel nacional y se encuentran bajo la vigilancia y control de las autoridades."], ["vin", "La segunda (ii) tiene lugar cuando las autoridades competentes de los Estados participantes la solicitan o la requieren, para que el paso o tránsito de los bienes usados sea asegurado sin problemas por el Estado de destino."], ["vin", "La tercera (iii) ocurre cuando la remisión y circulación, de los bienes usados, tiene su origen en un Estado distinto y transita para otro Estado intermediario produciéndose el requerimiento y solicitud por las autoridades para el correspondiente resguardo desde su origen, tránsito y destino a un tercer país."]]}], "ilus": "m-entrega-vigilada.webp", "raiz": "¿En qué consiste la técnica y para qué se utiliza?"}, "38": {"t": "Discusión", "r": [{"h": "problemática de orden dogmático", "p": [["vin", "Existe una problemática de orden dogmático, relacionada con la perfección o no del delito que se investiga y del tipo de responsabilidad que se puede imputar a un sujeto cuando se ha practicado una entrega vigilada y con ella se interviene, se interrumpe o se evita la comisión del delito que se está investigando."], ["vin", "Específicamente, subsisten problemas con respecto al tipo de autoría o participación, tentativa o consumación en aquellos casos en los que la conducta es realizada con el aporte, la ayuda, vigilancia o interrupción del agente que realiza la entrega vigilada, como en el caso, de acuerdo con el cual, los acusados en ningún momento tuvieron la posesión mediata o inmediata ni la disponibilidad real de la sustancia contenida en el paquete recogido, por lo que el delito no llegó a consumarse."]]}, {"h": "Al respecto, existen tres hipótesis", "p": [["vin", "Al respecto, existen tres hipótesis:"], ["vin", "Se consuma el delito para todos los partícipes, independientemente de si el receptor logró la posesión física o disponibilidad real de la droga."], ["vin", "Los intervinientes en el acuerdo previo responden a título de delito consumado, aun cuando la intervención policial impida la entrega."], ["vin", "Al igual que en la primera hipótesis, se configura el delito consumado siempre que exista un acuerdo previo (ex ante) entre remitente y destinatario, pues la sola puesta en marcha del transporte otorga la posesión mediata del estupefaciente a todos los coautores, independientemente de si la carga llega a su destino final o si es interceptada tempranamente por la policía."], ["vin", "Cuando el receptor decide prestar su ayuda o recibir el envío en un momento en que la sustancia ya se encuentra bajo control policial, su conducta se sanciona como tentativa inidónea punible."], ["vin", "Sanciona como tentativa inidónea la intervención ex post del sujeto que decide colaborar cuando la sustancia ya ha sido fiscalizada y se encuentra bajo el control exclusivo de la autoridad, escenario en el cual la acción no alcanza a lesionar el bien jurídico de la salud pública, pero exterioriza un dolo perfeccionado."]]}], "ilus": "investigacion-lupa.webp", "raiz": "Discusión"}, "44": {"t": "¿Cuáles son sus requisitos de procedencia?", "r": [{"h": "Ley 1908 de 2018", "p": [["", "En Colombia, la Ley 1908 de 2018 introdujo la figura del agente encubierto informático con la finalidad de fortalecer la investigación y judicialización de las organizaciones criminales en el país. Esta normatividad no tenía por objeto específico la adopción de medidas de investigación y judicialización de la criminalidad organizada que opera a partir de la comisión de delitos a través de medios informáticos, sino la implementación del acuerdo de paz firmado en Colombia."], ["", "En el debate parlamentario, se incluyó esta TEI, tomando como referente la regulación prevista en el ordenamiento jurídico español, con el propósito de fortalecer la investigación eficiente de los delitos de los GAO, especialmente, por su vinculación con el conflicto armado."]]}, {"h": "carga para el funcionario investigador", "p": [["", "La regulación colombiana impone una carga para el funcionario investigador, en la medida en que la solicitud de control previo de legalidad debe demostrar la existencia de dicha organización criminal y, además, actuar a través de comunicaciones mantenidas en canales cerrados de comunicación virtual."]]}], "ilus": "m-dispositivos.webp", "raiz": "¿Cuáles son sus requisitos de procedencia?"}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se

/* Cuarta pasada (revisión como usuario, 25/11/2026): la frase que anuncia la lista va arriba (intro) y no como un concepto más; si

(function () {

  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');

  function numero(r, k) {

    return '<span class="num">' + (k + 1) + '</span>';
  }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;

  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */

  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);

  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58) - altoIntro;
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */

    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function prox(k) { for (var j = k + 1; j < N; j++) if (!d.r[j].entero) return j; return N; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */

  }
  function mostrar() {

    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +

    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = prox(actual.k); if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    if (ult) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight, ew = e.offsetWidth;
    /* al lado de la rama si hay sitio (en la franja ancha casi siempre lo hay); si no, debajo o encima */
    var gx, gy = Math.max(8, Math.min(H - gh - 8, y + e.offsetHeight / 2 - gh / 2));
    if (x + ew + 10 + gw <= W - 8) gx = x + ew + 10;
    else if (x - 10 - gw >= 8) gx = x - 10 - gw;
    else { gx = Math.min(Math.max(10, x + ew / 2 - gw / 2), W - gw - 10); gy = y + e.offsetHeight + 6; if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6); if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) gy = Math.max(8, Math.min(H - gh - 8, y)); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  /* cuarta pasada: la letra del curso llega después de la primera medida (y en Genially el marco va con zoom); si con la letra
     ya cargada el mapa no cabe, baja un paso de tamaño o pasa a leerse por ventanas. Nunca queda texto fuera del marco. */
  function reajustar() {
    function sobra() { return ramas.scrollHeight > TOPE - 2 || mc.scrollHeight > mc.clientHeight + 1; }
    ['g4', 'g3', 'g2', 'g1'].forEach(function (c) { if (sobra()) mc.classList.remove(c); });
    if (!resumen && sobra()) { resumen = true; pintar(true); avance(); }
    trazar();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(reajustar, 40); });
  setTimeout(reajustar, 1200);
  /* si el marco cambia de forma (dividida ↔ franja ancha) después de cargar, el mapa se vuelve a armar para esa forma */
  window.addEventListener('resize', function () { setTimeout(function () { if (document.documentElement.classList.contains('ancho') !== ANCHO) location.reload(); }, 200); });
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
