<script type="application/json" id="datos">{"1": {"t": "Técnicas de investigación y control judicial", "r": [{"h": "técnicas de investigación", "p": [["", "Las técnicas de investigación constituyen herramientas esenciales para el esclarecimiento de los hechos y la obtención de elementos materiales probatorios y evidencia física durante la actuación penal. No obstante, algunas de ellas pueden comportar una injerencia en el ejercicio de derechos fundamentales, circunstancia que demanda el sometimiento de su práctica a límites constitucionales y legales y, en algunos casos puntuales a que se refiere el CPP, al control del JCG."]]}, {"h": "alcance del control judicial", "p": [["", "A este respecto, el alcance del control judicial dependerá de la naturaleza de la actuación investigativa y del grado de injerencia sobre los derechos fundamentales a que haya lugar. De ahí que el ordenamiento jurídico establezca distintos mecanismos de intervención judicial, a fin de verificar la conjunción de los respectivos parámetros constitucionales y legales; los cuales pueden operar antes de la ejecución de la medida (control previo) o con posterioridad a esta (control posterior)."]]}, {"h": "divergencias entre ambas modalidades", "p": [["", "Para comprender las divergencias entre ambas modalidades, es preciso mencionar que, en el marco del control previo, el juez debe determinar la procedencia de la restricción del respectivo derecho fundamental (piénsese, por ejemplo, en la necesidad de una inspección corporal). En cambio, el control posterior implica que el juez debe establecer si una actuación se ajustó a los lineamientos constitucionales y legales que regulan su práctica (como sucede, entre otros supuestos, con la diligencia de interceptación de comunicaciones)."]]}, {"h": "el juez deberá determinar", "p": [["", "En este último evento, el juez deberá determinar: (a) si era posible realizar el procedimiento sin un control previo; (b) si la orden fue expedida por la autoridad facultada para ello, esto es, el fiscal; (c) si la orden contiene una motivación suficiente, incluyendo la aplicación del principio de proporcionalidad o, también denominado, prohibición de exceso; (d) si el procedimiento se ajustó a las disposiciones legales; (e) si se intervino en la menor proporción posible las garantías fundamentales, y (f) si el control se efectuó dentro del término fijados por la ley."]]}], "ilus": "p-alto-documento-2.webp", "raiz": ""}, "4": {"t": "Desarrollo general de las audiencias preliminares referentes a técnicas de investigación", "r": [{"h": "tres fases", "p": [["vin", "Ahora bien, en cuanto al desarrollo propiamente dicho de las audiencias preliminares, para estos efectos, es posible dividirlo metodológicamente en tres fases: (a) proceder jurisdiccional, (b) intervención de la fiscalía y (c) decisión judicial."]]}, {"h": "Proceder jurisdiccional", "p": [["vin", "En cuanto a la primera fase, se prevé que el juez instale la audiencia y, de tal forma, enuncie su objeto en los términos de la solicitud presentada, verifique la presencia del solicitante y establezca las pautas propias del procedimiento, a saber: (a) las intervenciones, dirigidas al juez o al imputado, deben ser concretas, claras, puntuales y sin argumentos repetitivos; (b) antes de iniciar las intervenciones, de común acuerdo con las partes, se fijará el tiempo necesario para su desarrollo; (c) la lectura de documentos se limita a lo estrictamente necesario;"], ["", "y (d) se requerirá para que la intervención de partes compuestas por pluralidad de sujetos se limite a los intereses de sus representados."]]}], "ilus": "sustentacion-audiencia.webp", "raiz": ""}, "5": {"t": "Intervención de la fiscalía", "r": [{"h": "Contextualizar sobre la actuación investigativa", "p": [["vin", "Contextualizar sobre la actuación investigativa;"]]}, {"h": "Identificar la técnica de investigación", "p": [["vin", "Identificar la técnica de investigación que se realizó, pretende realizarse o se somete a control;"]]}, {"h": "Señalar la finalidad de la respectiva diligencia", "p": [["vin", "Señalar la finalidad de la respectiva diligencia;"]]}, {"h": "Fundamentar la solicitud", "p": [["vin", "Fundamentar la solicitud;"]]}, {"h": "Delimitar el objeto de la diligencia", "p": [["vin", "Delimitar el objeto de la diligencia;"]]}, {"h": "Justificar constitucionalmente la solicitud", "p": [["vin", "Justificar constitucionalmente la solicitud;"]]}, {"h": "Precisar las condiciones de ejecución", "p": [["vin", "Precisar las condiciones de ejecución;"]]}, {"h": "Concluir con una petición concreta al juez", "p": [["vin", "Concluir con una petición concreta al juez."]]}], "ilus": "p-dialogo-carpeta-2.webp", "intro": "Con respecto a la segunda fase, se debe indicar que, por su calidad de solicitante, el ente acusador debe desplegar determinadas actuaciones durante el desarrollo de su intervención al interior de la respectiva audiencia preliminar. De manera sistemática, dicha parte procesal deberá observar los siguientes “pasos”:", "raiz": ""}, "11": {"t": "Intervención de la fiscalía", "r": [{"h": "acta de la diligencia", "p": [["vin", "Asimismo, se exige presentar otro tipo de información relevante, como que los bienes incautados se limitaron a los señalados en la orden (salvo que se presente un caso de flagrancia), así como el acta de la diligencia, indicando los lugares registrados, los objetos ocupados o incautados y las personas capturadas. Para estos efectos, también resultará esencial el hecho de que la Fiscalía indique lo relevante en torno al desarrollo de la diligencia, precisando: (a) si la técnica de investigación se surtió dentro del horario de 6:00 a.m. a 6:00 p.m."], ["", "(en caso de realizarse fuera de este horario, deberá explicar los motivos que llevaron a esa decisión, y acreditar que hubo citación al Ministerio Público); y (b) si hubo oposición o medidas policivas y firma de personas que atendieron la diligencia."]]}, {"h": "informe de policía judicial", "p": [["", "En cualquier evento, esta parte procesal deberá exhibir el informe de policía judicial relativo a los resultados de diligencia, indicando que se allegó en término, y acreditar que se encuentra dentro del término de legalización de la diligencia de allanamiento (Art. 237 CPP)."]]}], "ilus": "sustentacion-audiencia.webp", "raiz": ""}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se
   lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana pequeña junto a ella.
   Texto literal de la escena: datos[m] = {t: título, raiz: texto del nodo central ('' si Genially ya lo dice), ilus, r: [{h: rótulo,
   p: [[clase, texto], …]}]}.
   Tercera pasada (Sebastián, 24/11/2026): en la franja ancha de Genially el mapa va con la idea al centro y las ramas a los dos
   lados; el rótulo que ya está en el arranque del párrafo no se repite (va resaltado dentro del texto); el nodo central no repite
   el título de la diapositiva; la última parte de una ventana lleva al concepto siguiente o termina (no hay botón que no lleve a nada). */
/* Cuarta pasada (revisión como usuario, 25/11/2026): la frase que anuncia la lista va arriba (intro) y no como un concepto más; si
   los conceptos ya vienen numerados en el texto («1. …»), el círculo lleva ese número y el texto no lo repite; las llamadas de nota
   al pie («[^3]») van como superíndice y la nota, marcada como nota; ningún renglón empieza con un guion suelto. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var propios = 0;
  d.r.forEach(function (r) {
    r.p.forEach(function (x) { x[1] = String(x[1]).replace(/^[-–]\s+/, ''); });
    var t0 = r.p.length ? r.p[0][1] : '', mn = /^\[\^(\d+)\]\s*/.exec(t0), mp = /^(\d{1,2})\.\s+(?=\S)/.exec(t0) || /^\(([a-z])\)\s+(?=\S)/.exec(t0);
    if (mn) { r.nota = mn[1]; r.p[0][1] = t0.slice(mn[0].length); }
    else if (mp) { r.propio = mp[1]; r.corte = mp[0].length; propios++; }
  });
  /* la lista ya viene numerada o con letras en el texto («1. …», «(a) …»): el círculo lleva esa marca y el texto no la repite */
  if (propios >= 2) d.r.forEach(function (r) { if (r.propio) { r.p[0][1] = r.p[0][1].slice(r.corte); r.h = String(r.h).replace(/^\(([a-z])\)\s+|^\d{1,2}\.\s+/, ''); } }); else d.r.forEach(function (r) { r.propio = null; });
  function numero(r, k) {
    if (r.nota) return '<span class="num nnota" title="Nota al pie ' + r.nota + '">' + r.nota + '</span>';
    if (propios >= 2) return r.propio ? '<span class="num">' + r.propio + '</span>' : '<span class="num sin-n" aria-hidden="true"><i class="fas fa-angle-right"></i></span>';
    return '<span class="num">' + (k + 1) + '</span>';
  }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[\^(\d+)\]/g, '<sup>$1</sup>'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var altoIntro = 0;
  if (d.intro) {
    var pi = document.createElement('p'); pi.className = 'intro'; pi.innerHTML = esc(d.intro); lz.insertBefore(pi, mc);
    altoIntro = pi.offsetHeight + 8; mc.style.paddingTop = (altoIntro + 14) + 'px';
  }
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      /* cuarta pasada: en el mapa por ventanas, el concepto que ya cabe entero se lee ahí mismo (no lleva «Clic para leer completo») */
      var entero = resumen && r.p.length === 1 && todo.length <= lim;
      r.entero = entero; if (entero) leidos[k] = 1;
      var boton = resumen && !entero;
      var e = document.createElement(boton ? 'button' : 'div'); e.className = 'rama' + (leidos[k] && boton ? ' visto' : '') + (r.nota ? ' es-nota' : '');
      if (boton) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var breve = (!resumen || entero) && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '">' + numero(r, k) + '<span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin">' + numero(r, k) + '<span>' + marca(boton ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3>' + numero(r, k) + '<span>' + esc(may(r.h)) + '</span></h3>') +
        (boton ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (boton) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58) - altoIntro;
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function prox(k) { for (var j = k + 1; j < N; j++) if (!d.r[j].entero) return j; return N; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return prox(actual.k) < N
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (prox(actual.k) + 1) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = prox(actual.k); if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    if (ult) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight, ew = e.offsetWidth;
    /* al lado de la rama si hay sitio (en la franja ancha casi siempre lo hay); si no, debajo o encima */
    var gx, gy = Math.max(8, Math.min(H - gh - 8, y + e.offsetHeight / 2 - gh / 2));
    if (x + ew + 10 + gw <= W - 8) gx = x + ew + 10;
    else if (x - 10 - gw >= 8) gx = x - 10 - gw;
    else { gx = Math.min(Math.max(10, x + ew / 2 - gw / 2), W - gw - 10); gy = y + e.offsetHeight + 6; if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6); if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) gy = Math.max(8, Math.min(H - gh - 8, y)); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  /* cuarta pasada: la letra del curso llega después de la primera medida (y en Genially el marco va con zoom); si con la letra
     ya cargada el mapa no cabe, baja un paso de tamaño o pasa a leerse por ventanas. Nunca queda texto fuera del marco. */
  function reajustar() {
    function sobra() { return ramas.scrollHeight > TOPE - 2 || mc.scrollHeight > mc.clientHeight + 1; }
    ['g4', 'g3', 'g2', 'g1'].forEach(function (c) { if (sobra()) mc.classList.remove(c); });
    if (!resumen && sobra()) { resumen = true; pintar(true); avance(); }
    trazar();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(reajustar, 40); });
  setTimeout(reajustar, 1200);
  /* si el marco cambia de forma (dividida ↔ franja ancha) después de cargar, el mapa se vuelve a armar para esa forma */
  window.addEventListener('resize', function () { setTimeout(function () { if (document.documentElement.classList.contains('ancho') !== ANCHO) location.reload(); }, 200); });
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
</script>
