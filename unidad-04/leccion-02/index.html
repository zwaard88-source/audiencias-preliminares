 de 2002 y desarrollado en la Ley 906 de 2004 ha estimulado una discusión más detallada sobre el fundamento y límites del concepto “motivos fundados”.", "Como se anotó, la Corte ha reproducido la definición prevista por la sentencia C-024 de 1994, pero ha abordado adicionalmente aspectos fundamentales como la finalidad, la necesidad de concreción, precisión y determinación, el respaldo probatorio y el control de legalidad por el JCG a los motivos fundados.", "A continuación, se expone sintéticamente las consideraciones esenciales de la Corte frente a cada uno de estos aspectos:"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "implementación del modelo procesal penal acusatorio", "segs": [0], "obj": "libros"}, {"label": "definición prevista por la sentencia C-024 de 1994", "segs": [1], "obj": "tribunal"}, {"label": "consideraciones esenciales de la Corte", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2. Sustentación probatoria y respuesta estratégica a las controversias de las partes", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["implementación del modelo procesal penal acusatorio", "definición prevista por la sentencia C-024 de 1994", "consideraciones esenciales de la Corte"], "titulo_genially": "Sustentación probatoria y respuesta estratégica a las controversias de las partes", "ilustracion": "trio-dialogo.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "trio-dialogo.webp", "pos": "fondo"}, "escenario": {"bioma": "centro", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "puntos", "segmentos": ["La posibilidad de fundamentar afectaciones a derechos fundamentales a partir de criterios vagos e indeterminados es negada por la Corte Constitucional. Aunque no es identificable una doctrina específica sobre la determinabilidad de los motivos fundados o de la motivación de una orden de afectación a derechos fundamentales, la Corte reitera la desaprobación a prácticas de investigación penal “sin motivación y finalidad concreta” (CConst., Sentencia C-822 de 2005, num. VIII. 5.3.1.7.).", "Para la Corte, en la autorización de una medida de investigación debe indicarse, a partir de motivos razonablemente fundados, la relevancia de la diligencia frente al plan de investigación o, incluso, el programa metodológico de la Fiscalía (CConst., Sentencia C-822 de 2005, num. VIII. 5.3.1.7.). En ese sentido, se reprueban las medidas de investigación con fundamentaciones indeterminadas o abstractas.", "Al respecto, la Corte es mucho más enfática cuando analiza el nivel de motivación que se demanda desde el Art. 300 CPP respecto a la facultad de captura excepcional por parte de la Fiscalía. Las expresiones “motivos serios y de fuerza mayor” fueron declaradas inexequibles, bajo el argumento de que daban lugar a las más variadas hipótesis y supuestos que dejan a la discrecionalidad del propio fiscal la determinación de las circunstancias y motivos de captura (CConst., C-185 de 2008, num. V. 5.).", "La Corte establece una relación directa entre excepcionalidad de la detención sin autorización judicial previa y restricción de la discrecionalidad fiscal con la concreción, precisión, determinación de los motivos que se exigen como respaldo a la orden de captura. En ese sentido, la Corte encuentra en el juicio de necesidad objetiva de tal medida el fundamento de la excepcionalidad de la figura.", "La determinación objetiva de necesidad parte de la discusión en torno a motivos concretos, precisos y determinados (CConst., C-185 de 2008, num. V. 5.)."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "posibilidad de fundamentar afectaciones a derechos", "segs": [0, 1], "obj": "libros"}, {"label": "nivel de motivación", "segs": [2, 3, 4], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "2.1. Finalidad y concreción de los motivos fundados", "grupo": null, "titulos_fuente": ["2.1. Finalidad y concreción de los motivos fundados"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["posibilidad de fundamentar afectaciones a derechos", "nivel de motivación"], "titulo_genially": "Finalidad y concreción de los motivos fundados", "ilustracion": "investigacion-lupa.webp", "relleno": "dialogo-carpeta.webp"}, {"layout": "esquema", "segmentos": ["En el análisis del Art. 221 CPP, relevante para la comprensión del problema sobre el respaldo probatorio a los motivos fundados, la Corte presenta unas consideraciones necesarias para la interpretación del mismo. La Corte comienza por reafirmar la exigencia de respaldo probatorio a los motivos fundados para ordenar un registro y allanamiento incorporada por el Art. 221 inc. 1 CPP y la prohibición de registros y allanamientos arbitrarios sujetos a la discrecionalidad del fiscal.", "Sobre esa razón, en concordancia con el Art. 221 CPP, reitera la obligación de soporte o respaldo de la orden del fiscal al menos en un informe, declaración jurada o elementos materiales probatorios y evidencia física. Para la Corte, dicho respaldo es una garantía de la viabilidad de la diligencia, “a fin de que el juez pueda acceder a una información que le permita realizar un efectivo control de legalidad” (CConst., Sentencia C-637 de 2005, num. VI. 3.).", "También analiza el Art. 221 inc. 2 CPP que advertía que la declaración jurada de testigo o informante sirve como respaldo probatorio. Frente a la declaración de informante, el Art. 221 señalaba que la policía judicial sólo debía precisar su identificación al fiscal y explicar por qué razón le resulta confiable (crítica de la redacción inicial del Art. 221 CPP Fernández, 2005, p. 61). Este artículo establecía la reserva total de los datos del informante frente a otras partes e intervinientes en el proceso. Esta restricción del acceso al informante fue declarada inconstitucional.", "Para la Corte es inadmisible que el fiscal no cuente con la facultad de interrogar a un informante con el fin de apreciar mejor su credibilidad.", "La Corte consideró insuficiente una evaluación a la credibilidad del testigo sólo a partir de la información dada por la policía judicial sobre la identificación del informante y la simple explicación de las razones por las cuales a la policía judicial le resulta confiable (CConst., C-637 de 2005, num. VI. 3; sobre la extensión del control de garantías a los elementos probatorios que respalden la necesidad de injerencia véase también CConst., Sentencia 806 de 2009, num. VI. 5.; al respecto Bernal/Montealegre, 2013, T. II, p. 259; Guerrero, 2007, p. 344).", "De esta manera, la Corte desarrolla un doble sentido de respaldo probatorio a los motivos fundados. Por un lado, como obligación de respaldo a la orden del fiscal al menos en un informe, declaración jurada o elementos materiales probatorios. Por otro lado, desde su aspecto funcional, un acceso no restringido del fiscal y el JCG a los medios probatorios con que se soportan los motivos fundados (CConst., C-637 de 2005, num. VI. 3). Dicho acceso amplio debe conducir a un doble juicio (fáctico y jurídico), a partir del cual se decida o confirme una afectación a derechos fundamentales."], "parrafo": [0, 2, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Sentencia C-637 de 2005", "segs": [0, 1], "obj": "casa"}, {"label": "Art. 221 inc. 2 CPP", "segs": [2, 3], "obj": "personas"}, {"label": "credibilidad del testigo", "segs": [4], "obj": "libros"}, {"label": "doble sentido de respaldo probatorio", "segs": [5], "obj": "lupa"}]}], "rotulo": null, "seccion": "2.2. Respaldo probatorio a los motivos fundados", "grupo": null, "titulos_fuente": ["2.2. Respaldo probatorio a los motivos fundados"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Sentencia C-637 de 2005", "Art. 221 inc. 2 CPP", "credibilidad del testigo", "doble sentido de respaldo probatorio"], "titulo_genially": "Respaldo probatorio a los motivos fundados", "ilustracion": "p-dialogo-carpeta-2.webp", "relleno": "lee-libro-explica.webp", "arte": {"img": "p-dialogo-carpeta-2.webp", "pos": "izq"}, "escenario": {"bioma": "despacho", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "acordeon", "segmentos": ["La Corte declara que la reserva de datos del informante planteado por el Art. 221 inc. 2 CPP debe entenderse en el sentido de no reservados al JCG (CConst., C-673 de 2005, num. VI. 3). Para la Corte este tipo de reservas impedirían un efectivo examen de los motivos fundados. Por un lado, reduciría la posibilidad de un control formal y material a la medida de investigación. Por otro lado, impediría un análisis de proporcionalidad de la medida (CConst., C-673 de 2005, num. VI. 3). Sin embargo, la Corte legitima cierto nivel de reserva de los datos.", "Bajo el argumento de la seguridad del informante justifica que los datos del mismo no sean de acceso público (CConst., C-673 de 2005, num. VI. 3). Adicional a lo anterior, con fundamento en el Art. 155 CPP afirma que aunque el JCG tenga acceso a los datos del informante, estos no pueden publicarse durante la audiencia de control de legalidad a otras partes o intervinientes (CConst., C-673 de 2005, num. VI. 3)."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "reserva de datos del informante", "segs": [0], "obj": "libros"}, {"label": "seguridad del informante", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2.3. De la reserva en las audiencias de control de legalidad", "grupo": null, "titulos_fuente": ["2.3. De la reserva en las audiencias de control de legalidad"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["reserva de datos del informante", "seguridad del informante"], "titulo_genially": "De la reserva en las audiencias de control de legalidad", "ilustracion": "p-alto-documento-2.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "p-alto-documento-2.webp", "pos": "der"}}, {"layout": "esquema", "segmentos": ["Una objeción es la facultad procesal que poseen las partes en audiencias para confrontar la intervención de la contraparte. Este recurso se utiliza cuando se considera que una pregunta incumple los parámetros normativos del código, especialmente si vulnera los derechos o la dignidad de las personas. En el desarrollo de la audiencia, sirve para regular la declaración de la contraparte, los testigos u otros intervinientes, garantizando que el esclarecimiento de los hechos se construya de manera ordenada a través de una línea de tiempo estructurada en modo, tiempo y lugar.", "Para responder de manera efectiva a las objeciones de la defensa en una audiencia penal bajo el sistema acusatorio, lo aconsejable es fundamentar técnicamente y dirigirte exclusivamente al juez con una postura persuasiva. Cuando la defensa objeta una pregunta o consideración de la fiscalía, el juez dará el uso de la palabra para que se exponga el contraargumento antes de decidir si la acepta o la rechaza."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "facultad procesal", "segs": [0], "obj": "libros"}, {"label": "objeciones de la defensa", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2.4. Cómo responder en audiencia a las objeciones de la defensa", "grupo": null, "titulos_fuente": ["2.4. Cómo responder en audiencia a las objeciones de la defensa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["facultad procesal", "objeciones de la defensa"], "titulo_genially": "Cómo responder en audiencia a las objeciones de la defensa", "ilustracion": "terminos-reloj.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "terminos-reloj.webp", "pos": "fondo"}, "escenario": {"bioma": "audiencia", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "rejilla", "segmentos": ["Antes de intervenir con una objeción, es indispensable dominar las herramientas más recurrentes dentro de las audiencias preliminares. Las principales objeciones que pueden enfrentarse en una audiencia podrían ser las siguientes:", "i. Improcedencia: Aplica cuando el planteamiento o el elemento probatorio se introduce fuera de la etapa procesal correspondiente o incumple las formalidades que exige la ley para su validez.", "ii. Relevancia o Pertinencia: Se utiliza cuando los datos que se pretenden obtener no guardan un vínculo directo con la teoría del caso ni con los hechos materia de controversia.", "iii. Especulación: Sirve para frenar preguntas que obliguen al testigo a emitir opiniones sobre eventos que no presenció o que lo induzcan a adivinar. Por ejemplo, si la contraparte interroga con un: ¿Qué piensa usted que hizo el imputado esa noche?, se debe interponer una objeción por especulación para bloquear una declaración basada en conjeturas."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "principales objeciones", "segs": [0], "obj": "tribunal", "ilus": "sustentacion-audiencia.webp"}, {"label": "Improcedencia", "segs": [1], "obj": "escalones", "ilus": "entrega-carpeta.webp"}, {"label": "Relevancia o Pertinencia", "segs": [2], "obj": "carpetas", "ilus": "investigacion-lupa.webp"}, {"label": "Especulación", "segs": [3], "obj": "personas", "ilus": "captura-detenido.webp"}]}], "rotulo": null, "seccion": "2.4.1. Categorías habituales de objeciones", "grupo": null, "titulos_fuente": ["2.4.1. Categorías habituales de objeciones"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["principales objeciones", "Improcedencia", "Relevancia o Pertinencia", "Especulación"], "titulo_genially": "Categorías habituales de objeciones (1 de 2)", "ilustracion": "p-explica-brazos-2.webp", "relleno": "clasificacion-carpetas.webp"}, {"layout": "fichas", "segmentos": ["Por otro lado, identificar las equivocaciones más habituales de la contraparte te dará una ventaja estratégica. Es muy común ver que los litigantes confundan la pertinencia de una prueba con el momento oportuno para presentarla, o que dejen pasar preguntas capciosas que dañan su propia teoría del caso.", "Para que tu objeción sea contundente, argumenta con precisión, rapidez y síntesis. Emplea fórmulas directas como: “Objeción, Su Señoría, la pregunta es improcedente” o “Objeción, por especulación”, seguidas de un sustento legal o lógico muy breve. Esta postura no solo proyecta dominio técnico, sino que te ayuda a mantener la dirección del debate.", "La estrategia para responder en sala podría estructurarse de la siguiente manera:"], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "identificar las equivocaciones más habituales", "segs": [0], "obj": "expediente"}, {"label": "precisión, rapidez y síntesis", "segs": [1], "obj": "documento"}, {"label": "estrategia para responder en sala", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2.4.1. Categorías habituales de objeciones", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["identificar las equivocaciones más habituales", "precisión, rapidez y síntesis", "estrategia para responder en sala"], "titulo_genially": "Categorías habituales de objeciones (2 de 2)", "ilustracion": "clasificacion-carpetas.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "clasificacion-carpetas.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["Defender la pregunta (No ha lugar): Si la objeción de la defensa es infundada, explíque brevemente al juez por qué la pregunta cumple con las reglas procesales.", "Ejemplo: ante una objeción por “impertinencia\": \"Señoría, la pregunta es pertinente porque busca establecer la ubicación espacio-temporal del testigo en el momento de los hechos, lo cual es relevante para la teoría del caso\"."], "parrafo": [0, 1], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Defender la pregunta (No ha lugar)", "segs": [0], "obj": "tribunal"}, {"label": "Ejemplo", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "2.4.2. Formas técnicas de contestar:", "grupo": null, "titulos_fuente": ["2.4.2. Formas técnicas de contestar:"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Defender la pregunta (No ha lugar)", "Ejemplo"], "titulo_genially": "Formas técnicas de contestar:", "ilustracion": "p-trio-1.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "p-trio-1.webp", "pos": "izq"}, "escenario": {"bioma": "sala", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "puntos", "segmentos": ["Si nota que comete un error técnico en la estructura (por ejemplo, una pregunta compuesta o ambigua), no se desgaste en la audiencia debatiendo. Acepte tácitamente la objeción y corrija la pregunta inmediatamente.", "Ejemplo: \"Sustituyo la pregunta, Su Señoría. Procedo a plantearla de manera separada\"."], "parrafo": [0, 1], "vineta": [1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "error técnico en la estructura", "segs": [0], "obj": "tribunal"}, {"label": "Ejemplo", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "2.4.3. Reformular la pregunta:", "grupo": null, "titulos_fuente": ["2.4.3. Reformular la pregunta:"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["error técnico en la estructura", "Ejemplo"], "titulo_genially": "Reformular la pregunta:", "ilustracion": "corren-carpetas.webp", "relleno": "sustentacion-audiencia.webp"}, {"layout": "esquema", "segmentos": ["Si la objeción es totalmente correcta (por ejemplo, se te escapó un argumento relevante en alguna consideración) y no hay forma de rescatarla sin alterar el fondo, retírela para mantener la fluidez.", "Ejemplo: \"Retiro la pregunta, Señor Juez\"."], "parrafo": [0, 1], "vineta": [1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "objeción es totalmente correcta", "segs": [0], "obj": "documento"}, {"label": "Ejemplo", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2.4.4. Retirar la pregunta:", "grupo": null, "titulos_fuente": ["2.4.4. Retirar la pregunta:"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["objeción es totalmente correcta", "Ejemplo"], "titulo_genially": "Retirar la pregunta:", "ilustracion": "p-trio-2.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "p-trio-2.webp", "pos": "der"}, "escenario": {"bioma": "audiencia", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "giro", "segmentos": ["i. Dirigirse siempre al Juez: Nunca discuta ni confronte directamente al abogado defensor. Quien resuelve es la autoridad judicial.", "ii. Esperar el turno: Cuando la contraparte diga \"¡Objeción!\", se debe detener inmediatamente el interrogatorio y no hablar hasta que el juez conceda explícitamente la palabra.", "iii. Ser breve y contundente: El debate de una objeción debe durar segundos. Estructurar la respuesta bajo la fórmula de: Premisa jurídica + Hecho del caso + Conclusión.", "iv. Control sobre el lenguaje corporal: Mantener un tono de voz firme, sereno y profesional. Demostrar frustración o enojo debilita los fundamentos de la estrategia."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Dirigirse siempre al Juez", "segs": [0], "obj": "tribunal"}, {"label": "Esperar el turno", "segs": [1], "obj": "documento"}, {"label": "Ser breve y contundente", "segs": [2], "obj": "carpetas"}, {"label": "Control sobre el lenguaje corporal", "segs": [3], "obj": "corazon"}]}], "rotulo": null, "seccion": "2.4.5. Reglas de Oro en Sala", "grupo": null, "titulos_fuente": ["2.4.5. Reglas de Oro en Sala"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Dirigirse siempre al Juez", "Esperar el turno", "Ser breve y contundente", "Control sobre el lenguaje corporal"], "titulo_genially": "Reglas de Oro en Sala", "ilustracion": "p-explica-brazos.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-explica-brazos.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["Las discusiones de la Corte Constitucional sobre el alcance del principio de reserva judicial en la decisión sobre una afectación de derechos fundamentales en el proceso penal son relevantes, por lo menos, en dos aspectos. Primero, delimita las prescripciones del CPP sobre las medidas que no requieren autorización judicial previa y restringe las mismas a lo determinado por el Art. 250 num 2 CN. Segundo, incorpora unas cargas especiales para la activación de las competencias excepcionales de afectación por parte de la FGN y las competencias de autorización o confirmación del JCG.", "En uno u otro ámbito, las excepciones legales a la autorización judicial previa implican no sólo una estricta fundamentación sobre la base de motivos fundados, sino, también, una valoración en clave del principio de proporcionalidad.", "En ese sentido, la jurisprudencia de la Corte reitera ampliamente la importancia de decisiones de afectación sobre la base de un juicio de pertinencia, idoneidad, necesidad y estricta proporcionalidad (CConst., C-822 de 2005, num. VIII. 5.1); a lo cual se añade el fin legítimo contenido en la Directiva 001 (Fiscalía General de la Nación, 2020).", "Del análisis jurisprudencial sobre el fundamento de la reserva judicial se encuentra que la Corte tiene dos niveles de argumentación. El primero es teórico constitucional y parte de la premisa de que en los casos de afectación de derechos fundamentales siempre será necesaria la autorización judicial previa (CConst., C-822 de 2005, num. VIII. 5.1). Esta consideración de la Corte tiene su respectivo fundamento normativo en el Art. 250 num. 3 CN y su desarrollo legal está previsto entre los 246-250 CPP.", "Frente a este tipo de medida (con autorización judicial previa), como segundo nivel de argumentación, la Corte determina que implican dos grados de afectación (medio e intenso) (CConst., C-822 de 2005, num. VIII. 5.1) y para la determinación de dichos grados de afectación, la Corte establece unos presupuestos abiertos que conducen a un análisis caso a caso.", "En ese sentido, la definición del nivel de afectación depende de la medida misma, las condiciones de realización, los intereses afectados y el impacto sobre derechos fundamentales (CConst., C-822 de 2005, num. VIII. 5.1). De esta manera, si bien en un primer nivel el criterio de la “afectación a derechos fundamentales” puede reclamar una validez general independiente de la naturaleza de la medida, en un segundo nivel argumentativo la Corte relativiza dicha validez planteando unos elementos de juicio para la determinación del nivel de afectación, señalando que sólo en las afectaciones medias o intensas es necesaria la autorización judicial."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "discusiones de la Corte Constitucional", "segs": [0, 1], "obj": "libros"}, {"label": "estricta proporcionalidad", "segs": [2], "obj": "carpetas"}, {"label": "fundamento de la reserva judicial", "segs": [3, 4], "obj": "escudo"}, {"label": "nivel de afectación", "segs": [5], "obj": "documento"}]}], "rotulo": null, "seccion": "2.5. Fundamento de la reserva judicial", "grupo": null, "titulos_fuente": ["2.5. Fundamento de la reserva judicial"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["discusiones de la Corte Constitucional", "estricta proporcionalidad", "fundamento de la reserva judicial", "nivel de afectación"], "titulo_genially": "Fundamento de la reserva judicial (1 de 2)", "ilustracion": "dialogo-carpeta.webp", "relleno": "lee-libro-explica.webp", "arte": {"img": "dialogo-carpeta.webp", "pos": "fondo"}, "escenario": {"bioma": "fiscalia", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "fichas", "segmentos": ["La validez general del principio de reserva judicial se relativiza con dos tesis adicionales. Por un lado, a partir de una interpretación exegética del art. 250 num. 2 CN plantea que frente a las medidas allí enunciadas (registros, allanamientos, incautaciones e interceptaciones de comunicaciones) se puede exceptuar la solicitud de autorización judicial previa (CConst., C-336 de 2007, num. VI. 14).", "Por otro lado, del análisis de la naturaleza de dichas medidas, considera que la “necesidad y oportunidad” en el recaudo de la información justifican dicha excepción a la intervención previa del JCG a los fines de autorizar dichas medidas (CConst., C-336 de 2007, num. VI. 14). De la jurisprudencia respecto a los niveles de afectación no queda claro qué puede entenderse por un nivel “bajo” de afectación, ni cómo se determina una afectación media o intensa.", "Tampoco queda claro el fundamento para entender que una intervención del JCG previo a la ejecución de la medida puede restringir la oportunidad de recaudo de la información. Además, no hace una evaluación sistemática de otras medidas que por su afectación media o alta a derechos fundamentales deberían regirse por el principio de reserva judicial, pero frente a las que solo se exige un control posterior de acuerdo con el Art. 250 num. 2."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "validez general del principio de reserva", "segs": [0, 1], "obj": "telefono"}, {"label": "oportunidad de recaudo de la información", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "2.5. Fundamento de la reserva judicial", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["validez general del principio de reserva", "oportunidad de recaudo de la información"], "titulo_genially": "Fundamento de la reserva judicial (2 de 2)", "ilustracion": "entrega-carpeta.webp", "relleno": "lee-libro-explica.webp"}]}</script>
