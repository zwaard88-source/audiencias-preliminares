<main class="lienzo" id="lienzo">
  <svg class="trazos" id="svg" aria-hidden="true"></svg>
  <div class="mc" id="mc"></div>
  <div class="globo" id="globo" role="dialog" aria-modal="false"><div class="gcab"><h3 id="gh"></h3><button class="cerrar" id="gx">Clic para cerrar <i class="fas fa-xmark" aria-hidden="true"></i></button></div><div id="gp"></div></div>
  <div class="pie"><button class="btn-chico" data-pantalla></button></div>

<script type="application/json" id="datos">{"1": {"t": "Sustentación probatoria y respuesta estratégica a las controversias de las partes", "r": [{"h": "implementación del modelo procesal penal acusatorio", "p": [["", "La implementación del modelo procesal penal acusatorio incorporado por el Acto Legislativo 03 de 2002 y desarrollado en la Ley 906 de 2004 ha estimulado una discusión más detallada sobre el fundamento y límites del concepto “motivos fundados”."]]}, {"h": "reproducido la definición prevista por la sentencia", "p": [["", "Como se anotó, la Corte ha reproducido la definición prevista por la sentencia C-024 de 1994, pero ha abordado adicionalmente aspectos fundamentales como la finalidad, la necesidad de concreción, precisión y determinación, el respaldo probatorio y el control de legalidad por el JCG a los motivos fundados."]]}, {"h": "expone sintéticamente las consideraciones esenciales", "p": [["", "A continuación, se expone sintéticamente las consideraciones esenciales de la Corte frente a cada uno de estos aspectos:"]]}], "ilus": "sustentacion-audiencia.webp"}, "3": {"t": "Respaldo probatorio a los motivos fundados", "r": [{"h": "Sentencia C-637 de 2005", "p": [["", "En el análisis del Art. 221 CPP, relevante para la comprensión del problema sobre el respaldo probatorio a los motivos fundados, la Corte presenta unas consideraciones necesarias para la interpretación del mismo. La Corte comienza por reafirmar la exigencia de respaldo probatorio a los motivos fundados para ordenar un registro y allanamiento incorporada por el Art. 221 inc. 1 CPP y la prohibición de registros y allanamientos arbitrarios sujetos a la discrecionalidad del fiscal."], ["", "Sobre esa razón, en concordancia con el Art. 221 CPP, reitera la obligación de soporte o respaldo de la orden del fiscal al menos en un informe, declaración jurada o elementos materiales probatorios y evidencia física. Para la Corte, dicho respaldo es una garantía de la viabilidad de la diligencia, “a fin de que el juez pueda acceder a una información que le permita realizar un efectivo control de legalidad” (CConst., Sentencia C-637 de 2005, num. VI. 3.)."]]}, {"h": "Art. 221 inc. 2 CPP", "p": [["", "También analiza el Art. 221 inc. 2 CPP que advertía que la declaración jurada de testigo o informante sirve como respaldo probatorio. Frente a la declaración de informante, el Art. 221 señalaba que la policía judicial sólo debía precisar su identificación al fiscal y explicar por qué razón le resulta confiable (crítica de la redacción inicial del Art. 221 CPP Fernández, 2005, p. 61). Este artículo establecía la reserva total de los datos del informante frente a otras partes e intervinientes en el proceso. Esta restricción del acceso al informante fue declarada inconstitucional."], ["", "Para la Corte es inadmisible que el fiscal no cuente con la facultad de interrogar a un informante con el fin de apreciar mejor su credibilidad."]]}, {"h": "credibilidad del testigo", "p": [["", "La Corte consideró insuficiente una evaluación a la credibilidad del testigo sólo a partir de la información dada por la policía judicial sobre la identificación del informante y la simple explicación de las razones por las cuales a la policía judicial le resulta confiable (CConst., C-637 de 2005, num. VI. 3; sobre la extensión del control de garantías a los elementos probatorios que respalden la necesidad de injerencia véase también CConst., Sentencia 806 de 2009, num. VI. 5.; al respecto Bernal/Montealegre, 2013, T. II, p. 259; Guerrero, 2007, p. 344)."]]}, {"h": "doble sentido de respaldo probatorio", "p": [["", "De esta manera, la Corte desarrolla un doble sentido de respaldo probatorio a los motivos fundados. Por un lado, como obligación de respaldo a la orden del fiscal al menos en un informe, declaración jurada o elementos materiales probatorios. Por otro lado, desde su aspecto funcional, un acceso no restringido del fiscal y el JCG a los medios probatorios con que se soportan los motivos fundados (CConst., C-637 de 2005, num. VI. 3). Dicho acceso amplio debe conducir a un doble juicio (fáctico y jurídico), a partir del cual se decida o confirme una afectación a derechos fundamentales."]]}], "ilus": "lee-libro-explica.webp"}, "5": {"t": "Cómo responder en audiencia a las objeciones de la defensa", "r": [{"h": "facultad procesal", "p": [["", "Una objeción es la facultad procesal que poseen las partes en audiencias para confrontar la intervención de la contraparte. Este recurso se utiliza cuando se considera que una pregunta incumple los parámetros normativos del código, especialmente si vulnera los derechos o la dignidad de las personas. En el desarrollo de la audiencia, sirve para regular la declaración de la contraparte, los testigos u otros intervinientes, garantizando que el esclarecimiento de los hechos se construya de manera ordenada a través de una línea de tiempo estructurada en modo, tiempo y lugar."]]}, {"h": "Para responder de manera efectiva", "p": [["", "Para responder de manera efectiva a las objeciones de la defensa en una audiencia penal bajo el sistema acusatorio, lo aconsejable es fundamentar técnicamente y dirigirte exclusivamente al juez con una postura persuasiva. Cuando la defensa objeta una pregunta o consideración de la fiscalía, el juez dará el uso de la palabra para que se exponga el contraargumento antes de decidir si la acepta o la rechaza."]]}], "ilus": "sustentacion-audiencia.webp"}, "8": {"t": "Formas técnicas de contestar:", "r": [{"h": "Defender la pregunta (No ha lugar)", "p": [["vin", "Defender la pregunta (No ha lugar): Si la objeción de la defensa es infundada, explíque brevemente al juez por qué la pregunta cumple con las reglas procesales."]]}, {"h": "Ejemplo", "p": [["vin", "Ejemplo: ante una objeción por “impertinencia\": \"Señoría, la pregunta es pertinente porque busca establecer la ubicación espacio-temporal del testigo en el momento de los hechos, lo cual es relevante para la teoría del caso\"."]]}], "ilus": "sustentacion-audiencia.webp"}, "10": {"t": "Retirar la pregunta:", "r": [{"h": "se te", "p": [["", "Si la objeción es totalmente correcta (por ejemplo, se te escapó un argumento relevante en alguna consideración) y no hay forma de rescatarla sin alterar el fondo, retírela para mantener la fluidez."]]}, {"h": "Ejemplo", "p": [["vin", "Ejemplo: \"Retiro la pregunta, Señor Juez\"."]]}], "ilus": "sustentacion-audiencia.webp"}, "12": {"t": "Fundamento de la reserva judicial", "r": [{"h": "discusiones de la Corte Constitucional", "p": [["", "Las discusiones de la Corte Constitucional sobre el alcance del principio de reserva judicial en la decisión sobre una afectación de derechos fundamentales en el proceso penal son relevantes, por lo menos, en dos aspectos. Primero, delimita las prescripciones del CPP sobre las medidas que no requieren autorización judicial previa y restringe las mismas a lo determinado por el Art. 250 num 2 CN. Segundo, incorpora unas cargas especiales para la activación de las competencias excepcionales de afectación por parte de la FGN y las competencias de autorización o confirmación del JCG."], ["", "En uno u otro ámbito, las excepciones legales a la autorización judicial previa implican no sólo una estricta fundamentación sobre la base de motivos fundados, sino, también, una valoración en clave del principio de proporcionalidad."]]}, {"h": "estricta proporcionalidad", "p": [["", "En ese sentido, la jurisprudencia de la Corte reitera ampliamente la importancia de decisiones de afectación sobre la base de un juicio de pertinencia, idoneidad, necesidad y estricta proporcionalidad (CConst., C-822 de 2005, num. VIII. 5.1); a lo cual se añade el fin legítimo contenido en la Directiva 001 (Fiscalía General de la Nación, 2020)."]]}, {"h": "fundamento de la reserva judicial", "p": [["", "Del análisis jurisprudencial sobre el fundamento de la reserva judicial se encuentra que la Corte tiene dos niveles de argumentación. El primero es teórico constitucional y parte de la premisa de que en los casos de afectación de derechos fundamentales siempre será necesaria la autorización judicial previa (CConst., C-822 de 2005, num. VIII. 5.1). Esta consideración de la Corte tiene su respectivo fundamento normativo en el Art. 250 num. 3 CN y su desarrollo legal está previsto entre los 246-250 CPP."], ["", "Frente a este tipo de medida (con autorización judicial previa), como segundo nivel de argumentación, la Corte determina que implican dos grados de afectación (medio e intenso) (CConst., C-822 de 2005, num. VIII. 5.1) y para la determinación de dichos grados de afectación, la Corte establece unos presupuestos abiertos que conducen a un análisis caso a caso."]]}, {"h": "nivel de afectación", "p": [["", "En ese sentido, la definición del nivel de afectación depende de la medida misma, las condiciones de realización, los intereses afectados y el impacto sobre derechos fundamentales (CConst., C-822 de 2005, num. VIII. 5.1). De esta manera, si bien en un primer nivel el criterio de la “afectación a derechos fundamentales” puede reclamar una validez general independiente de la naturaleza de la medida, en un segundo nivel argumentativo la Corte relativiza dicha validez planteando unos elementos de juicio para la determinación del nivel de afectación, señalando que sólo en las afectaciones medias o intensas es necesaria la autorización judicial."]]}], "ilus": "lee-libro-explica.webp"}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página a la izquierda y todas sus ramas a la vista.
   Si el texto cabe, se lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana
   pequeña junto a ella. Texto literal de la escena: datos[m] = {t: título, r: [{h: rótulo, p: [[clase, texto], …]}]}. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  function parrafos(p) { return p.map(function (x) { return '<p class="' + x[0] + '">' + esc(x[1]) + '</p>'; }).join(''); }
  var arriba = d.r.length > 6;
  mc.className = 'mc' + (arriba ? ' arriba' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz';
  raiz.innerHTML = '<h2>' + esc(may(d.t)) + '</h2>' + (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : '');
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var e = document.createElement(resumen ? 'button' : 'div'); e.className = 'rama' + (leidos[k] ? ' visto' : '');
      if (resumen) e.type = 'button';
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = arriba ? 78 : (d.r.length >= 5 ? 105 : 190);
      var breve = !resumen && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      e.innerHTML = breve ? '<h3 class="solo"><span class="num">' + (k + 1) + '</span><span>' + esc(may(todo)) + '</span></h3>' :
        '<h3><span class="num">' + (k + 1) + '</span><span>' + esc(may(r.h)) + '</span></h3>' +
        (resumen ? '<p>' + esc(corta(todo, lim)) + '</p><span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(r.p));
      if (resumen) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  function cabe() { return mc.scrollHeight <= mc.clientHeight + 1 && ramas.scrollHeight <= ramas.clientHeight + 1 && nodos.every(function (n) { return n.offsetTop + n.offsetHeight <= ramas.offsetTop + ramas.clientHeight + 2 || arriba; }); }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var alto = ramas.scrollHeight;
  var resumen = total > 1250 || alto > (arriba ? 400 : 452) || mc.scrollHeight > mc.clientHeight + 1;
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta tres pasos) mientras quepa */
  ['g1', 'g2', 'g3'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > (arriba ? 400 : 440) || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function mostrar() {
    document.getElementById('gp').innerHTML = parrafos(partes[parte]) + (partes.length > 1 ? '<div class="partes"><button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span><button class="btn-chico" id="ps"' + (parte < partes.length - 1 ? '' : ' disabled') + '>Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>' : '');
    var a = document.getElementById('pa'), s = document.getElementById('ps');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (parte === partes.length - 1 && actual) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight;
    var gx = Math.min(Math.max(10, x + e.offsetWidth / 2 - gw / 2), W - gw - 10), gy = y + e.offsetHeight + 6;
    if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6);
    if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) { gy = Math.max(8, Math.min(H - gh - 8, y)); gx = x - gw - 8 > 8 ? x - gw - 8 : Math.min(W - gw - 8, x + 30); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() { if (!resumen) return; var n = Object.keys(leidos).length; document.getElementById('avance').innerHTML = '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + d.r.length + '</b>'; }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, R = raiz.getBoundingClientRect(), s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(R);
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect());
      if (!arriba) { var x1 = a.l + a.w, y1 = a.t + a.h / 2, x2 = c.l, y2 = c.t + c.h / 2, xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, izq = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = izq ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
</script>
