<script type="application/json" id="datos">{"2": {"t": "Anotación preliminar", "r": [{"h": "realizabilidad de los parámetros jurisprudenciales", "p": [["", "La capacidad de control del JCG a los motivos fundados y, de esta manera, la realizabilidad de los parámetros jurisprudenciales de motivación a medidas de investigación, viene siendo subrogada por aspectos relativos tanto a la estructura de formación subyacente al concepto motivos fundados como también a deficiencias estructurales de la función de control de garantías como ámbito de verificación. Por un lado, se trata de una noción jurídica indeterminada con un reducido potencial de control que, como se anotó, es tratada de manera diferenciada en la sistemática del CPP."], ["", "Adicional a ello, su concreción supone fundamentalmente un ejercicio discrecional del fiscal que toma cuerpo especialmente en el juicio de probabilidad que va implícito en la determinación de cada inferencia razonable."]]}, {"h": "competencias reservadas al JCG", "p": [["", "Por otro lado, desde el punto de vista de la estructura de control, las competencias reservadas al JCG para la efectiva protección judicial de derechos fundamentales en la etapa de la investigación penal se ven reducidas, además, por los siguientes factores: primero, por la orientación preventiva y de carácter policial, en especial de la etapa de indagación preliminar, a partir de la cual el monopolio penal y judicial del uso de la fuerza se ve desplazado a las fuerzas de Policía. Segundo, por cuestiones relativas a los presupuestos y a la metodología de control sobre los actos de investigación por parte de la FGN y la Policía Judicial."]]}, {"h": "deficiente control judicial de los motivos fundados", "p": [["", "Un deficiente control judicial de los motivos fundados para la autorización o confirmación de la legalidad de una medida investigativa supone la limitación de la protección judicial de derechos fundamentales. A pesar de que son claros los costos de un limitado ejercicio de verificación a la motivación de este tipo de medidas, pareciera que en el proceso penal colombiano se concibiera esto no como un escenario de rupturas, sino que con la relajación de los presupuestos de verificación judicial a las diligencias de investigación penal se proyecta un recurso compensatorio y cierta unidad frente a la insuficiencia de fundamentación."], ["", "A ello contribuye la estructura del proceso penal derivada del Acto Legislativo 03 de 2002, si se tienen en cuenta las continuas reformas que viene delimitando un escenario de tendencia inquisitiva en materia de protección a derechos fundamentales del investigado (Zuluaga, 2011, pp. 23 ss.)."]]}, {"h": "orientación punitiva", "p": [["", "Esta dinámica restrictiva imprime en el JCG una orientación punitiva, lo que favorece posturas distante de los derroteros del Estado Social de Derecho y, por consiguiente, puede generar inconsistencias con la idea fundamental que inspira la figura del JCG: un “juez de las libertades” que actúa como garante de los derechos de los procesados y de la indemnidad de los mismos de cara a cualquier injerencia indebida."]]}], "ilus": "lee-libro-explica.webp", "raiz": ""}, "7": {"t": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "r": [{"h": "sustentación de una solicitud ante el JCG", "p": [["", "La sustentación de una solicitud ante el JCG requiere una intervención ordenada, coherente y orientada argumentativamente a la demostración del cumplimiento de los presupuestos constitucionales y legales de la decisión pretendida. En ese sentido, la exposición del fiscal puede estructurarse en los siguientes momentos:"]]}, {"h": "Identificación del problema jurídico", "p": [["vin", "Identificación del problema jurídico: delimitar la cuestión que debe resolver el JCG, a partir de la naturaleza de la actuación y de los presupuestos que deben verificarse. Son problemas jurídicos frecuentes, por ejemplo, establecer si se cumplen los requisitos para legalizar una captura, autorizar o controlar una medida investigativa, o imponer una medida de aseguramiento."], ["vin", "“¿Los elementos materiales probatorios, la evidencia física y la información legalmente obtenida permiten inferir razonablemente que Juan Durán representa un peligro para la seguridad de la víctima, María Pérez, en los términos del artículo 311 del CPP, y que resulta necesaria la imposición de una medida de aseguramiento para protegerla?”"]]}, {"h": "Formulación de pretensiones", "p": [["vin", "Formulación de pretensiones: precisar de manera expresa y concreta la decisión que se solicita al juez, indicando su alcance y el fundamento procesal que la habilita."], ["vin", "“La Fiscalía solicita la imposición de una medida de aseguramiento privativa de la libertad en establecimiento carcelario contra Juan Durán, al considerar que se encuentran satisfechos los presupuestos del artículo 308 del CPP y que existe un peligro para la seguridad de la víctima, conforme al artículo 311 del mismo estatuto. En consonancia con ello, solicita que también se declare acreditada la insuficiencia de las medidas no privativas de la libertad para cumplir los fines constitucionales de la medida».”"]]}, {"h": "Exposición de los hechos relevantes", "p": [["vin", "Exposición de los hechos relevantes: presentar, de forma cronológica, clara y selectiva, las circunstancias fácticas que sustentan la solicitud; teniendo en cuenta que los hechos con relevancia jurídica corresponden a acontecimientos que ocurren en el mundo fenomenológico (visible o apreciable en términos sensoriales) o en el mundo abstracto (subjetivo), de los cuales se predica una determinada consecuencia jurídica."]]}], "ilus": "sustentacion-audiencia.webp", "raiz": ""}, "11": {"t": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "r": [{"h": "Tiempo", "p": [["vin", "Tiempo: 12 y 14 de marzo de 2026."]]}, {"h": "Lugar", "p": [["vin", "Lugar: Bogotá D. C., lugar desde el cual la víctima recibió la oferta de inversión y realizó las transferencias."]]}, {"h": "Modo", "p": [["vin", "Modo: contacto telefónico con la víctima, ofrecimiento de una rentabilidad mensual e indicación de una cuenta bancaria para recibir los recursos."]]}, {"h": "Sustentación probatoria", "p": [["vin", "Sustentación probatoria: individualizar los elementos materiales probatorios, la evidencia física y la información legalmente obtenida que sirven de fundamento a la solicitud. Debe explicarse qué información aporta cada elemento y cuál es su relación con los hechos expuestos, sin limitarse a enumerarlos o reproducir su contenido."], ["vin", "“La Fiscalía cuenta con (i) las denuncias presentadas por tres de las personas afectadas, (ii) los comprobantes de las transferencias realizadas y (iii) las respuestas de la entidad financiera obtenidas mediante la diligencia investigativa. Estos últimos registros permiten establecer que los recursos ingresaron a la cuenta objeto de investigación y que, posteriormente, fueron retirados mediante operaciones efectuadas desde distintos canales bancarios. La información obtenida guarda relación directa con la finalidad de identificar a las personas que intervinieron en la recepción y disposición de los recursos”."]]}, {"h": "Formula de inferencia", "p": [["vin", "Formula de inferencia: explicitar el razonamiento que conecta la información obtenida con la conclusión que se pretende demostrar. Esto implica identificar las premisas fácticas y probatorias, explicar las reglas de experiencia, conocimientos científicos o inferencias lógicas empleadas y justificar por qué permiten tener por satisfecho el presupuesto correspondiente, de acuerdo con el estándar de conocimiento exigible en la actuación."], ["vin", "“A partir del contenido de los mensajes, la reiteración de las comunicaciones y el episodio de intimidación presenciado por el testigo, es posible inferir que el comportamiento del imputado no corresponde a un hecho aislado. Por el contrario, la persistencia de las actuaciones después de la terminación de la relación permite considerar que existe un riesgo concreto de que vuelva a intimidar o agredir a la víctima”."]]}], "ilus": "investigacion-lupa.webp", "raiz": ""}, "14": {"t": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "r": [{"h": "Conclusión y formulación de la solicitud", "p": [["vin", "Conclusión y formulación de la solicitud: sintetizar las razones fácticas, probatorias y jurídicas que sustentan la solicitud y precisar nuevamente la decisión que se espera del juez."]]}, {"h": "inferencia razonable de autoría o participación", "p": [["vin", "«La Fiscalía considera que los elementos materiales probatorios, la evidencia física y la información legalmente obtenida permiten sustentar la inferencia razonable de autoría o participación de Juan Durán, así como la existencia de un peligro para la seguridad de María Pérez, en los términos de los artículos 308 y 311 del CPP."]]}, {"h": "medidas no privativas de la libertad", "p": [["", "Asimismo, estima que las medidas no privativas de la libertad resultan insuficientes para proteger a la víctima."]]}, {"h": "medida de aseguramiento privativa de la libertad", "p": [["", "En consecuencia, solicita que se imponga a Juan Durán medida de aseguramiento privativa de la libertad en establecimiento carcelario, por encontrarse satisfechos los presupuestos legales para su procedencia»."]]}], "ilus": "p-dialogo-carpeta-2.webp", "raiz": ""}, "18": {"t": "Conciliación preprocesal (Art. 522 CPP)", "r": [{"h": "artículo 74", "p": [["", "La conciliación constituye un requisito de procedibilidad para el ejercicio de la acción penal cuando se trata de delitos querellables (artículo 74 CPP). Puede adelantarse ante el fiscal competente, un centro de conciliación o un conciliador reconocido legalmente."]]}, {"h": "archivo de las diligencias", "p": [["", "En caso de que se realice ante el fiscal, este mismo cita al querellante y al querellado a la correspondiente diligencia. Si se alcanza un acuerdo, procede el archivo de las diligencias; de lo contrario, se ejerce la acción penal, si resulta procedente, sin perjuicio de que las partes puedan acudir posteriormente a la mediación. En contraposición, si la conciliación se desarrolla ante un centro o conciliador reconocido, deberá remitirse al fiscal copia del acta para que proceda conforme al resultado obtenido."]]}, {"h": "inasistencia injustificada", "p": [["", "Puede ocurrir el evento en que alguno de los citados sea incapaz, caso en el cual deberá concurrir su representante legal. En todo caso, la inasistencia injustificada produce consecuencias distintas según el interviniente:"], ["vin", "La del querellante: se entiende como desistimiento de su pretensión."], ["vin", "La del querellado: da lugar al ejercicio de la acción penal, si fuere procedente."]]}, {"h": "Ejemplo", "p": [["", "Ejemplo: Pedro causa lesiones personales a Fanny en una discusión. Como se trata de un delito querellable, Fanny presenta querella ante la Fiscalía. Durante la audiencia de conciliación, Juan se compromete a pagar los gastos médicos y María acepta la propuesta. Al obtenerse un acuerdo a partir del mecanismo restaurativo, se archivan las diligencias."]]}], "ilus": "m-restaurativa.webp", "raiz": ""}, "20": {"t": "Mediación (Arts. 523-527 CPP)", "r": [{"h": "mediación", "p": [["", "La mediación es un mecanismo en el que interviene un tercero neutral, particular o servidor público designado por el Fiscal General de la Nación o su delegado, para facilitar el intercambio de opiniones entre la víctima y el imputado o acusado y procurar una solución al conflicto. Puede comprender compromisos de reparación, restitución o resarcimiento de los perjuicios; la realización o abstención de conductas determinadas; la prestación de servicios a la comunidad, o la presentación de disculpas o perdón."]]}, {"h": "artículo 524 del CPP", "p": [["", "Conforme al artículo 524 del CPP, la mediación procede desde la formulación de imputación y hasta antes del inicio de la etapa de juicio oral, en los delitos perseguibles de oficio cuyo mínimo de pena no exceda de cinco (5) años de prisión. La excepción radica en que el delito sobre el cual versa la actuación se debe referir a un bien jurídico protegido que no sobrepase la órbita personal del afectad, así como que las partes acepten expresa y voluntariamente someter el asunto a una solución restaurativa."], ["", "La mediación puede ser solicitada por la víctima o por el imputado o acusado ante el fiscal, el JCG o el juez de conocimiento, según corresponda."]]}, {"h": "delitos cuyo mínimo de pena exceda de cinco años", "p": [["", "En los delitos cuyo mínimo de pena exceda de cinco años, aunque no proceda la misma actuación, sus resultados sí pueden ser considerados para el otorgamiento de determinados beneficios durante la actuación, la dosificación de la pena o el cumplimiento de la sanción."]]}, {"h": "Ejemplo", "p": [["", "Ejemplo: Pedro es imputado por el delito de daño en bien ajeno (Art. 265), al ocasionar abolladuras en el vehículo de Fanny. Durante la investigación, ambos aceptan voluntariamente acudir a un mediador. En el encuentro, Pedro reconoce el daño, indicando que lo propició de manera voluntaria, y se compromete a reparar el vehículo y ofrecer disculpas. El mediador documenta el resultado y remite el informe a la autoridad correspondiente para los efectos previstos en el artículo 526 del CPP."]]}], "ilus": "", "raiz": ""}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se
   lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana pequeña junto a ella.
   Texto literal de la escena: datos[m] = {t: título, raiz: texto del nodo central ('' si Genially ya lo dice), ilus, r: [{h: rótulo,
   p: [[clase, texto], …]}]}.
   Tercera pasada (Sebastián, 24/11/2026): en la franja ancha de Genially el mapa va con la idea al centro y las ramas a los dos
   lados; el rótulo que ya está en el arranque del párrafo no se repite (va resaltado dentro del texto); el nodo central no repite
   el título de la diapositiva; la última parte de una ventana lleva al concepto siguiente o termina (no hay botón que no lleve a nada). */
/* Cuarta pasada (revisión como usuario, 25/11/2026): la frase que anuncia la lista va arriba (intro) y no como un concepto más; si
   los conceptos ya vienen numerados en el texto («1. …»), el círculo lleva ese número y el texto no lo repite; las llamadas de nota
   al pie («[^3]») van como superíndice y la nota, marcada como nota; ningún renglón empieza con un guion suelto. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var propios = 0;
  d.r.forEach(function (r) {
    r.p.forEach(function (x) { x[1] = String(x[1]).replace(/^[-–]\s+/, ''); });
    var t0 = r.p.length ? r.p[0][1] : '', mn = /^\[\^(\d+)\]\s*/.exec(t0), mp = /^(\d{1,2})\.\s+(?=\S)/.exec(t0) || /^\(([a-z])\)\s+(?=\S)/.exec(t0);
    if (mn) { r.nota = mn[1]; r.p[0][1] = t0.slice(mn[0].length); }
    else if (mp) { r.propio = mp[1]; r.corte = mp[0].length; propios++; }
  });
  /* la lista ya viene numerada o con letras en el texto («1. …», «(a) …»): el círculo lleva esa marca y el texto no la repite */
  if (propios >= 2) d.r.forEach(function (r) { if (r.propio) { r.p[0][1] = r.p[0][1].slice(r.corte); r.h = String(r.h).replace(/^\(([a-z])\)\s+|^\d{1,2}\.\s+/, ''); } }); else d.r.forEach(function (r) { r.propio = null; });
  function numero(r, k) {
    if (r.nota) return '<span class="num nnota" title="Nota al pie ' + r.nota + '">' + r.nota + '</span>';
    if (propios >= 2) return r.propio ? '<span class="num">' + r.propio + '</span>' : '<span class="num sin-n" aria-hidden="true"><i class="fas fa-angle-right"></i></span>';
    return '<span class="num">' + (k + 1) + '</span>';
  }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[\^(\d+)\]/g, '<sup>$1</sup>'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var altoIntro = 0;
  if (d.intro) {
    var pi = document.createElement('p'); pi.className = 'intro'; pi.innerHTML = esc(d.intro); lz.insertBefore(pi, mc);
    altoIntro = pi.offsetHeight + 8; mc.style.paddingTop = (altoIntro + 14) + 'px';
  }
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      /* cuarta pasada: en el mapa por ventanas, el concepto que ya cabe entero se lee ahí mismo (no lleva «Clic para leer completo») */
      var entero = resumen && r.p.length === 1 && todo.length <= lim;
      r.entero = entero; if (entero) leidos[k] = 1;
      var boton = resumen && !entero;
      var e = document.createElement(boton ? 'button' : 'div'); e.className = 'rama' + (leidos[k] && boton ? ' visto' : '') + (r.nota ? ' es-nota' : '');
      if (boton) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var breve = (!resumen || entero) && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '">' + numero(r, k) + '<span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin">' + numero(r, k) + '<span>' + marca(boton ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3>' + numero(r, k) + '<span>' + esc(may(r.h)) + '</span></h3>') +
        (boton ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (boton) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58) - altoIntro;
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function prox(k) { for (var j = k + 1; j < N; j++) if (!d.r[j].entero) return j; return N; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return prox(actual.k) < N
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (prox(actual.k) + 1) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
