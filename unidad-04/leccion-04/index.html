<script type="application/json" id="contenido">{"juego": {"clave": "ap-juego-u4-l4", "niveles": ["Observador", "Analista", "Garante de la audiencia", "Referente en audiencias"]}, "ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#2F4F45", "teal": "#587E6D", "oxido": "#2F4F45", "coral": "#C8754F", "crema": "#F6DDCB", "niebla": "#E3EDE7", "hielo": "#F7F5EF", "celeste": "#CFE0D6", "madera": "#587E6D", "piso": "#CFE0D6", "gris": "#CFE0D6", "amarillo": "#C8754F"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 4", "unit": 4, "lesson": 4, "heading": "Lección 4. Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "scenes": [{"layout": "puntos", "segmentos": ["La depuración de las falencias tanto de concreción, precisión y determinabilidad como de contradicción en la génesis de los motivos fundados para la decisión de una medida investigativa, encuentra en el control por parte del JCG a las actuaciones propias de la FGN y de la Policía Judicial uno de los filtros más importantes. De esta manera, la supervisión judicial de las medidas investigativas y, con ello, de la construcción de motivos fundados, permite asegurar la mínima afectación de derechos fundamentales del investigado (esta ha sido una reiterada posición de la CConst.", "Al respecto, véase sentencias C-025 de 2009, Consideraciones; C-185 de 2008, Consideraciones; C-186 de 2008, Consideraciones; C-740 de 2008, Consideraciones; A-089 de 2007, Consideraciones; C-336 de 2007; C-396 de 2007, Consideraciones; C-789 de 2006, Consideraciones; C-673 de 2005, Consideraciones; C-822 de 2005, Consideraciones; C-1260 de 2005, Consideraciones; C-1092 de 2003, Consideraciones).", "En ese sentido, el control del JCG funcionaría como un recurso primario de salvaguarda, especialmente de derechos tan susceptibles de intervención durante la investigación penal, como la libertad personal y aquellos vinculados al ámbito de las comunicaciones privadas, la correspondencia y el domicilio."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "génesis de los motivos fundados", "segs": [0, 1], "obj": "lupa"}, {"label": "control del JCG", "segs": [2], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "Lección 4. Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["génesis de los motivos fundados", "control del JCG"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "ilustracion": "fundamento-documento.webp", "relleno": "dialogo-carpeta.webp"}, {"layout": "esquema", "segmentos": ["La capacidad de control del JCG a los motivos fundados y, de esta manera, la realizabilidad de los parámetros jurisprudenciales de motivación a medidas de investigación, viene siendo subrogada por aspectos relativos tanto a la estructura de formación subyacente al concepto motivos fundados como también a deficiencias estructurales de la función de control de garantías como ámbito de verificación. Por un lado, se trata de una noción jurídica indeterminada con un reducido potencial de control que, como se anotó, es tratada de manera diferenciada en la sistemática del CPP.", "Adicional a ello, su concreción supone fundamentalmente un ejercicio discrecional del fiscal que toma cuerpo especialmente en el juicio de probabilidad que va implícito en la determinación de cada inferencia razonable.", "Por otro lado, desde el punto de vista de la estructura de control, las competencias reservadas al JCG para la efectiva protección judicial de derechos fundamentales en la etapa de la investigación penal se ven reducidas, además, por los siguientes factores: primero, por la orientación preventiva y de carácter policial, en especial de la etapa de indagación preliminar, a partir de la cual el monopolio penal y judicial del uso de la fuerza se ve desplazado a las fuerzas de Policía. Segundo, por cuestiones relativas a los presupuestos y a la metodología de control sobre los actos de investigación por parte de la FGN y la Policía Judicial.", "Un deficiente control judicial de los motivos fundados para la autorización o confirmación de la legalidad de una medida investigativa supone la limitación de la protección judicial de derechos fundamentales. A pesar de que son claros los costos de un limitado ejercicio de verificación a la motivación de este tipo de medidas, pareciera que en el proceso penal colombiano se concibiera esto no como un escenario de rupturas, sino que con la relajación de los presupuestos de verificación judicial a las diligencias de investigación penal se proyecta un recurso compensatorio y cierta unidad frente a la insuficiencia de fundamentación.", "A ello contribuye la estructura del proceso penal derivada del Acto Legislativo 03 de 2002, si se tienen en cuenta las continuas reformas que viene delimitando un escenario de tendencia inquisitiva en materia de protección a derechos fundamentales del investigado (Zuluaga, 2011, pp. 23 ss.).", "Esta dinámica restrictiva imprime en el JCG una orientación punitiva, lo que favorece posturas distante de los derroteros del Estado Social de Derecho y, por consiguiente, puede generar inconsistencias con la idea fundamental que inspira la figura del JCG: un “juez de las libertades” que actúa como garante de los derechos de los procesados y de la indemnidad de los mismos de cara a cualquier injerencia indebida."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "realizabilidad de los parámetros jurisprudenciales", "segs": [0, 1], "obj": "libros"}, {"label": "competencias reservadas al JCG", "segs": [2], "obj": "escudo"}, {"label": "deficiente control judicial de los motivos fundados", "segs": [3, 4], "obj": "tribunal"}, {"label": "Esta dinámica restrictiva imprime en el JCG", "segs": [5], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "4.1.1. Anotación preliminar", "grupo": null, "titulos_fuente": ["4.1.1. Anotación preliminar"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["realizabilidad de los parámetros jurisprudenciales", "competencias reservadas al JCG", "deficiente control judicial de los motivos fundados", "Esta dinámica restrictiva imprime en el JCG"], "titulo_genially": "Anotación preliminar", "ilustracion": "clasificacion-carpetas.webp", "relleno": "revisan-documento.webp", "arte": {"img": "clasificacion-carpetas.webp", "pos": "fondo"}, "escenario": {"bioma": "despacho", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "rejilla", "segmentos": ["De la estructura conceptual vinculada a los motivos fundados se destacan dos elementos nucleares para la determinación de los mismos. En primer lugar, la referencia a un conjunto articulado de hechos (situación objetiva) de cuyo análisis se desprende; en segundo lugar, una inferencia razonable o conclusión objetiva. Este ejercicio de conclusión objetiva a partir de una base fáctica corresponde, más concretamente, a lo que una parte mayoritaria de la doctrina reconoce como un juicio de probabilidad[^18].", "Como examen de probabilidad, con la determinación de un motivo fundado se evalúa una determinada circunstancia y la modalidad de su ocurrencia, es decir, responde a la pregunta sobre cómo y si es probable que una persona haya participado en un hecho punible y que éste haya sucedido de una determinada manera.", "[^18] Así se menciona en la misma sentencia C-024 de 1994, num. II 7.2., donde se dice que “más allá de la simple sospecha, la detención debe estar entonces basada en situaciones objetivas que permitan concluir con cierta probabilidad y plausibilidad que la persona está vinculada a actividades criminales”.", "La probabilidad a la que conduce el tratamiento de los motivos fundados en el CPP es una deducción basada en un ejercicio de valoración de hechos que permite concluir la ocurrencia de una situación. El análisis circunstancial y modal que se ve implicado en un juicio de probabilidad sobre un hecho cierto que supuestamente constituye un delito, replica la estructura de un pronóstico. Este tipo de juicios lógico-predictivos propio de los pronósticos no son extraños al derecho penal colombiano.", "Como ejemplos se pueden mencionar el Art. 63 num. 3 Código Penal (en adelante “CP”) para los casos en que se debe valorar el comportamiento futuro de una persona para decidir sobre la suspensión de la ejecución de la pena, es decir, si los antecedentes personales, sociales y familiares del sentenciado resultan indicativos de que no existe necesidad de ejecución de la pena.", "El Art. 300 num. 2 que incorpora “la probabilidad fundada de alterar los medios probatorios” como una de las causales de la captura excepcional por orden de la Fiscalía. Asimismo, el Art. 308 num. 3 CPP que incorpora como requisito de la medida de aseguramiento que resulte probable que el imputado no comparecerá al proceso o que no cumplirá la sentencia. Lo que caracteriza este tipo de pronóstico es que sobre la base de presupuestos fácticos y normativos conocidos se ha de derivar un hecho desconocido."], "parrafo": [0, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "estructura conceptual vinculada a los motivos fundados", "segs": [0, 1, 2], "obj": "lupa", "ilus": "lee-libro-explica.webp"}, {"label": "juicio de probabilidad", "segs": [3, 4], "obj": "documento", "ilus": "revisan-documento.webp"}, {"label": "Art. 300 num. 2", "segs": [5], "obj": "puertaCerrada", "ilus": "alto-documento.webp"}]}], "rotulo": null, "seccion": "4.1.2. Del control de un concepto jurídico indeterminado", "grupo": null, "titulos_fuente": ["4.1.2. Del control de un concepto jurídico indeterminado"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["estructura conceptual vinculada a los motivos fundados", "juicio de probabilidad", "Art. 300 num. 2"], "titulo_genially": "Del control de un concepto jurídico indeterminado (1 de 3)", "ilustracion": "p-trio-2.webp", "relleno": "revisan-documento.webp"}, {"layout": "giro", "segmentos": ["A diferencia de los ejemplos anteriores, la concreción de probabilidad circunscrita a los motivos fundados posee unas características especiales. Un motivo fundado debe estar vinculado a una base fáctica determinada, es decir, debe hacer referencia a una persona y a un hecho concreto, razón por la cual se explica también que – en principio – esté excluida la posibilidad de establecer un motivo fundado y ejecutar medidas de investigación penal contra personas indeterminadas. Este elemento, como ya se ha visto, es recogido por la doctrina de la Corte Constitucional como parte del concepto motivos fundados.", "A pesar de que es asumido como un componente esencial, la base fáctica objetiva viene condicionada por dos asuntos adicionales y distintivos del proceso de determinación de un motivo fundado. Por un lado, a partir de una situación fáctica objetiva no se intenta deducir un hecho futuro incierto, sino que se discute si un determinado asunto tuvo lugar en el pasado.", "Por otro lado, este ejercicio lógico deductivo ocurre no al final de la investigación penal, sino que es paralelo a los resultados de investigación. Por lo tanto, el pronóstico que se vincula al ejercicio de establecer un motivo fundado no es el de una predicción, sino que se trata de una deducción a partir de un conjunto articulado de hechos. No es una manifestación predictiva sobre un determinado suceso, sino que es una expresión de probabilidad de un suceso o circunstancia del pasado. Por esta razón, la delimitación de la probabilidad se representa como un pronóstico retrospectivo.", "En ese sentido, se puede decir que la comprensión de un motivo fundado se basa en tres presupuestos concretos. Por un lado, se trata de un análisis que está vinculado a un ámbito subjetivo determinado y una base fáctica concreta. Por otro lado, se trata de un juicio de probabilidad que responde a la pregunta sobre cómo y si es probable que un determinado hecho punible haya sucedido de una determinada manera. Finalmente, el planteamiento circunstancial y modal que se ve implicado en un juicio de probabilidad sobre un hecho cierto que supuestamente constituye un delito replica la estructura de un pronóstico.", "Concretamente, con la determinación de un motivo fundado se lleva a cabo un pronóstico retrospectivo, esto es, es una expresión de probabilidad de un suceso o circunstancia del pasado. En síntesis, el concepto motivo fundado representa, en ese sentido, un pronóstico retrospectivo sobre la probabilidad de autoría o participación.", "Esto es notorio, por ejemplo, en los Arts. 233, 234, 235 CPP que para los casos de intervención en las comunicaciones exigen que se infiera que existe información útil o relevante para la investigación. Asimismo, el Art. 236 CPP que conduce a inferir un hecho cierto como la transmisión de datos. En tanto juicios lógico-deductivos en torno a la probabilidad de participación en un hecho punible, a la determinación de un motivo fundado en todos estos casos le es inherente un margen de discrecionalidad que canaliza cada operador judicial en la concreción de las respectivas inferencias razonables."], "parrafo": [0, 3, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "concreción de probabilidad circunscrita", "segs": [0, 1], "obj": "lupa"}, {"label": "ejercicio lógico deductivo", "segs": [2], "obj": "documento"}, {"label": "comprensión de un motivo fundado", "segs": [3, 4], "obj": "carpetas"}, {"label": "Arts. 233, 234, 235 CPP", "segs": [5], "obj": "telefono"}]}], "rotulo": null, "seccion": "4.1.2. Del control de un concepto jurídico indeterminado", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["concreción de probabilidad circunscrita", "ejercicio lógico deductivo", "comprensión de un motivo fundado", "Arts. 233, 234, 235 CPP"], "titulo_genially": "Del control de un concepto jurídico indeterminado (2 de 3)", "ilustracion": "p-lee-libro.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-lee-libro.webp", "pos": "izq"}}, {"layout": "fichas", "segmentos": ["Dicho margen de discrecionalidad se concreta no sólo ante la ausencia de un desarrollo legal que delimite la estructura y aplicación judicial del pronóstico requerido por cada artículo, sino, también, en tanto no es claro cuáles factores deben analizarse para determinar la probabilidad aludida, es decir, cuáles elementos para la determinación de un motivo fundado deben y pueden ser incorporados en la probabilidad.", "Este punto es ampliamente discutido a nivel comparativo en la doctrina análoga a la de los motivos fundados, donde se reconoce que independientemente de los elementos que soportan la determinación de probabilidad, el único componente ineludible es la incertidumbre.", "El dilema de la indeterminación inherente a la estructura de definición de un motivo fundado no logra ser resuelto a partir de planteamientos de la Corte Constitucional acerca de la exigencia de concreción y precisión de la motivación de una injerencia en derechos fundamentales durante la fase de investigación. La exigencia de concreción, precisión y determinación que se deriva del Art. 250 CN (véase CConst., C-185 de 2008, num. V. 5.), desde la cual la Corte evalúa el Art. 300 CPP, no es discutida frente a los rezagos de discrecionalidad que están vinculados a los pronósticos retrospectivos que supone la determinación de un motivo fundado.", "En ese sentido, se podría hablar de dos niveles divergentes de definición de un motivo fundado. Por un lado, uno enlazado al juicio de determinación del motivo que tiene que resolver los dilemas de probabilidad sin que exista una estructura lógico-deductiva que oriente tal juicio de probabilidad.", "Por otro lado, el escenario “correctivo” que a partir de la contradicción entre partes en la audiencia de control busca supervisar las falencias de la motivación de una medida.", "En segundo lugar, ante la ausencia de un procedimiento que permita deducir a partir de claves lógicas y sistemáticas un motivo fundado, los dilemas de probabilidad encuentran un escenario correctivo en la confrontación propia de las audiencias de control judicial. Si bien esta confrontación tampoco se orienta por criterios objetivos o sustanciales para la determinación de una probabilidad, el proceso de argumentación jurídica permite reducir el margen de discrecionalidad inherente al primer nivel de formación."], "parrafo": [2, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "margen de discrecionalidad", "segs": [0, 1], "obj": "documento"}, {"label": "dilema de la indeterminación inherente", "segs": [2, 3], "obj": "libros"}, {"label": "escenario “correctivo”", "segs": [4], "obj": "tribunal"}, {"label": "dilemas de probabilidad", "segs": [5], "obj": "escalones"}]}], "rotulo": null, "seccion": "4.1.2. Del control de un concepto jurídico indeterminado", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["margen de discrecionalidad", "dilema de la indeterminación inherente", "escenario “correctivo”", "dilemas de probabilidad"], "titulo_genially": "Del control de un concepto jurídico indeterminado (3 de 3)", "ilustracion": "alto-documento.webp", "relleno": "lee-libro-explica.webp", "arte": {"img": "alto-documento.webp", "pos": "izq"}}, {"layout": "puntos", "segmentos": ["Como se ha dicho, la intervención en las audiencias preliminares requiere que los sujetos y partes procesales desarrollen una argumentación jurídica clara, coherente y respaldada en elementos de conocimiento disponibles. No basta con enunciar una disposición normativa o formular una solicitud: resulta necesario explicar por qué los hechos relevantes, los fundamentos jurídicos y los elementos materiales probatorios, la evidencia física y la información legalmente obtenida justifican la decisión que se solicita al JCG.", "En este contexto, la teoría del caso reviste especial importante: constituye una herramienta de organización y presentación de la información relevante para sustentar la respectiva pretensión procesal. Su construcción supone articular tres dimensiones:", "Fáctica: identificación y organización de los hechos jurídicamente relevantes que sustentan la solicitud, con delimitación de las circunstancias de tiempo, modo y lugar que resulten pertinentes.", "Jurídica: identificación de las disposiciones constitucionales y legales que regulan la actuación, así como de los presupuestos normativos que deben acreditarse para obtener la decisión solicitada.", "Probatoria: identificación de los elementos materiales probatorios, la evidencia física y la información legalmente obtenida que respaldan los hechos expuestos, y explicación en torno a su pertinencia y el alcance de las inferencias que permiten formular.", "La articulación de estas dimensiones debe responder, en efecto, a la naturaleza de cada audiencia preliminar y a la finalidad de la intervención. Por ello, la teoría del caso no puede entenderse como una exposición definitiva sobre la responsabilidad penal del investigado, sino como una construcción argumentativa escalonada, ajustada al objeto de la actuación y al estándar de conocimiento exigible en cada instancia ante la cual se solicita."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "intervención en las audiencias preliminares", "segs": [0], "obj": "tribunal"}, {"label": "del caso reviste especial importante", "segs": [1, 2, 3, 4], "obj": "carpetas"}, {"label": "a la naturaleza de cada audiencia preliminar", "segs": [5], "obj": "documento"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": ["4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["intervención en las audiencias preliminares", "del caso reviste especial importante", "a la naturaleza de cada audiencia preliminar"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (1 de 9)", "ilustracion": "trio-dialogo.webp", "relleno": "entrega-carpeta.webp"}, {"layout": "esquema", "segmentos": ["La sustentación de una solicitud ante el JCG requiere una intervención ordenada, coherente y orientada argumentativamente a la demostración del cumplimiento de los presupuestos constitucionales y legales de la decisión pretendida. En ese sentido, la exposición del fiscal puede estructurarse en los siguientes momentos:", "Identificación del problema jurídico: delimitar la cuestión que debe resolver el JCG, a partir de la naturaleza de la actuación y de los presupuestos que deben verificarse. Son problemas jurídicos frecuentes, por ejemplo, establecer si se cumplen los requisitos para legalizar una captura, autorizar o controlar una medida investigativa, o imponer una medida de aseguramiento.", "“¿Los elementos materiales probatorios, la evidencia física y la información legalmente obtenida permiten inferir razonablemente que Juan Durán representa un peligro para la seguridad de la víctima, María Pérez, en los términos del artículo 311 del CPP, y que resulta necesaria la imposición de una medida de aseguramiento para protegerla?”", "Formulación de pretensiones: precisar de manera expresa y concreta la decisión que se solicita al juez, indicando su alcance y el fundamento procesal que la habilita.", "“La Fiscalía solicita la imposición de una medida de aseguramiento privativa de la libertad en establecimiento carcelario contra Juan Durán, al considerar que se encuentran satisfechos los presupuestos del artículo 308 del CPP y que existe un peligro para la seguridad de la víctima, conforme al artículo 311 del mismo estatuto. En consonancia con ello, solicita que también se declare acreditada la insuficiencia de las medidas no privativas de la libertad para cumplir los fines constitucionales de la medida».”", "Exposición de los hechos relevantes: presentar, de forma cronológica, clara y selectiva, las circunstancias fácticas que sustentan la solicitud; teniendo en cuenta que los hechos con relevancia jurídica corresponden a acontecimientos que ocurren en el mundo fenomenológico (visible o apreciable en términos sensoriales) o en el mundo abstracto (subjetivo), de los cuales se predica una determinada consecuencia jurídica."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [1, 2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "sustentación de una solicitud ante", "segs": [0], "obj": "documento"}, {"label": "Identificación del problema jurídico", "segs": [1, 2], "obj": "puertaCerrada"}, {"label": "Formulación de pretensiones", "segs": [3, 4], "obj": "puertaAbierta"}, {"label": "Exposición de los hechos relevantes", "segs": [5], "obj": "reloj"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["sustentación de una solicitud ante", "Identificación del problema jurídico", "Formulación de pretensiones", "Exposición de los hechos relevantes"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (2 de 9)", "ilustracion": "p-alto-documento.webp", "relleno": "captura-detenido.webp", "arte": {"img": "p-alto-documento.webp", "pos": "der"}, "escenario": {"bioma": "audiencia", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "rejilla", "segmentos": ["La exposición debe concentrarse en los hechos pertinentes para resolver el problema jurídico, los sin incorporar información irrelevante. Los hechos jurídicamente relevantes no pueden confundirse los hechos jurídicamente relevantes con: los medios de prueba, las circunstancias procesales (aceptación de cargos, capturas, medidas de aseguramiento), las consecuencias jurídicas (quantum de la pena) o las circunstancias de tiempo, modo y lugar.", "Si bien estas últimas complementan los hechos jurídicamente relevantes, lo cierto es que son nociones completamente distintas. Mientras los hechos jurídicamente relevantes se refieren a supuestos fácticos que corresponden a los elementos constitutivos del tipo penal y sus circunstancias propias (agravación, atenuación, entre otros); las circunstancias de tiempo, modo y lugar delimitan la conducta atribuida y permitir su adecuación jurídica, al servir de base para construir inferencias sobre los hechos que deben demostrarse.", "Hecho Jurídicamente Relevante:", "«El investigado, Juan Durán, indujo y mantuvo en error a María Pérez mediante la simulación de una oportunidad de inversión que prometía rendimientos económicos. Como consecuencia de ese engaño, obtuvo que la víctima realizara dos transferencias bancarias por un valor total de trece millones de pesos ($13.000.000), con lo cual obtuvo un incremento patrimonial correlativo al detrimento económico ocasionado a aquella»."], "parrafo": [0, 1, 2, 3], "vineta": [2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "exposición", "segs": [0], "obj": "puertaCerrada", "ilus": "captura-detenido.webp"}, {"label": "Si bien estas últimas complementan los hechos", "segs": [1], "obj": "documento", "ilus": "terminos-reloj.webp"}, {"label": "Hecho Jurídicamente Relevante", "segs": [2], "obj": "carpetas", "ilus": "corren-carpetas.webp"}, {"label": "«El investigado", "segs": [3], "obj": "reloj", "ilus": "dialogo-carpeta.webp"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["exposición", "Si bien estas últimas complementan los hechos", "Hecho Jurídicamente Relevante", "«El investigado"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (3 de 9)", "ilustracion": "p-explica-brazos-2.webp", "relleno": "entrega-carpeta.webp"}, {"layout": "fichas", "segmentos": ["Conducta: inducir y mantener en error a otra persona mediante la simulación de una oportunidad de inversión.", "Sujeto pasivo: María Pérez.", "Sujeto activo: Juan Durán.", "Resultado: Detrimento patrimonial de María Pérez, por valor de trece millones de pesos ($13.000.000), y el correlativo incremento patrimonial obtenido por el investigado"], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Conducta", "segs": [0], "obj": "personas"}, {"label": "Sujeto pasivo", "segs": [1], "obj": "documento"}, {"label": "Sujeto activo", "segs": [2], "obj": "carpetas"}, {"label": "Resultado", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Conducta", "Sujeto pasivo", "Sujeto activo", "Resultado"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (4 de 9)", "ilustracion": "entrega-carpeta.webp", "relleno": "investigacion-lupa.webp"}, {"layout": "giro", "segmentos": ["Componente subjetivo: Actuación dolosa del investigado, consistente en conocer el carácter engañoso de la oferta de inversión y utilizarla voluntariamente para obtener un provecho ilícito.", "Circunstancias de tiempo, modo y lugar:", "“Las conductas ocurrieron los días 12 y 14 de marzo de 2026, en Bogotá D. C. El investigado contactó telefónicamente a la víctima, le ofreció una rentabilidad mensual del 20 % sobre el capital invertido y le indicó una cuenta bancaria a la cual debía transferir el dinero. Las dos operaciones se realizaron por valores de ocho millones ($8.000.000) y cinco millones de pesos ($5.000.000), respectivamente”.", "Tiempo: 12 y 14 de marzo de 2026."], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Componente subjetivo", "segs": [0], "obj": "reloj"}, {"label": "Circunstancias de tiempo, modo y lugar", "segs": [1], "obj": "documento"}, {"label": "días 12 y 14 de marzo", "segs": [2], "obj": "telefono"}, {"label": "Tiempo", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Componente subjetivo", "Circunstancias de tiempo, modo y lugar", "días 12 y 14 de marzo", "Tiempo"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (5 de 9)", "ilustracion": "p-trio-3.webp", "relleno": "investigacion-lupa.webp", "arte": {"img": "p-trio-3.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["Lugar: Bogotá D. C., lugar desde el cual la víctima recibió la oferta de inversión y realizó las transferencias.", "Modo: contacto telefónico con la víctima, ofrecimiento de una rentabilidad mensual e indicación de una cuenta bancaria para recibir los recursos.", "Sustentación probatoria: individualizar los elementos materiales probatorios, la evidencia física y la información legalmente obtenida que sirven de fundamento a la solicitud. Debe explicarse qué información aporta cada elemento y cuál es su relación con los hechos expuestos, sin limitarse a enumerarlos o reproducir su contenido.", "“La Fiscalía cuenta con (i) las denuncias presentadas por tres de las personas afectadas, (ii) los comprobantes de las transferencias realizadas y (iii) las respuestas de la entidad financiera obtenidas mediante la diligencia investigativa. Estos últimos registros permiten establecer que los recursos ingresaron a la cuenta objeto de investigación y que, posteriormente, fueron retirados mediante operaciones efectuadas desde distintos canales bancarios. La información obtenida guarda relación directa con la finalidad de identificar a las personas que intervinieron en la recepción y disposición de los recursos”.", "Formula de inferencia: explicitar el razonamiento que conecta la información obtenida con la conclusión que se pretende demostrar. Esto implica identificar las premisas fácticas y probatorias, explicar las reglas de experiencia, conocimientos científicos o inferencias lógicas empleadas y justificar por qué permiten tener por satisfecho el presupuesto correspondiente, de acuerdo con el estándar de conocimiento exigible en la actuación.", "“A partir del contenido de los mensajes, la reiteración de las comunicaciones y el episodio de intimidación presenciado por el testigo, es posible inferir que el comportamiento del imputado no corresponde a un hecho aislado. Por el contrario, la persistencia de las actuaciones después de la terminación de la relación permite considerar que existe un riesgo concreto de que vuelva a intimidar o agredir a la víctima”."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [0, 1, 2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Lugar", "segs": [0], "obj": "escudo"}, {"label": "Modo", "segs": [1], "obj": "telefono"}, {"label": "Sustentación probatoria", "segs": [2, 3], "obj": "expediente"}, {"label": "Formula de inferencia", "segs": [4, 5], "obj": "lupa"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Lugar", "Modo", "Sustentación probatoria", "Formula de inferencia"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (6 de 9)", "ilustracion": "fundamento-documento.webp", "relleno": "investigacion-lupa.webp", "arte": {"img": "fundamento-documento.webp", "pos": "fondo"}, "escenario": {"bioma": "barrio", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "puntos", "segmentos": ["Fundamentación normativa: relacionar los hechos y las inferencias formuladas con las disposiciones constitucionales y legales aplicables. El fiscal debe identificar los requisitos normativos de procedencia y explicar, de manera individualizada, cómo se satisfacen en el caso concreto.", "«El artículo 308 del Código de Procedimiento Penal exige, además de la inferencia razonable de autoría o participación, que se acredite alguno de los fines constitucionales que justifican la imposición de una medida de aseguramiento. Conforme al artículo 311 del mismo estatuto se establece que procederá la medida de aseguramiento cuando “la seguridad de la víctima se encuentra en peligro por la libertad del imputado, cuando existan motivos fundados que permitan inferir que podrá atentar contra ella, su familia o sus bienes”.", "Adicionalmente, en caso de solicitarse una medida de aseguramiento privativa de la libertad, la Fiscalía debe acreditar que las medidas no privativas de la libertad son insuficientes para cumplir esa finalidad, en atención al artículo 307, parágrafo 2.º, del CPP»."], "parrafo": [0, 1, 2], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Fundamentación normativa", "segs": [0, 1], "obj": "libros"}, {"label": "artículo 307", "segs": [2], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Fundamentación normativa", "artículo 307"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (7 de 9)", "ilustracion": "revisan-documento.webp", "relleno": "captura-detenido.webp"}, {"layout": "fichas", "segmentos": ["Respuesta a las posibles objeciones: anticipar y responder los cuestionamientos que puedan formular los demás intervinientes, especialmente aquellos relacionados con la legalidad, pertinencia, suficiencia o alcance de los elementos de conocimiento, la solidez de las inferencias y el cumplimiento de los presupuestos normativos.", "«La defensa sostiene que los mensajes enviados por Juan Durán no constituyen amenazas explícitas y que su presencia en el lugar de trabajo de María Pérez no demuestra, por sí misma, un peligro para su seguridad. Sin embargo, la Fiscalía considera que estas circunstancias deben valorarse conjuntamente: los mensajes hacen referencia al lugar de residencia de la víctima y contienen exigencias para que retire la denuncia, mientras que el acercamiento posterior constituye una reiteración de dichas exigencias, con un mayor grado de intimidación.", "Por tanto, la convergencia de estos elementos permite sustentar que las actuaciones del imputado estuvieron dirigidas a intimidar a la víctima y que existe un riesgo concreto para su seguridad»."], "parrafo": [0, 1], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Respuesta a las posibles objeciones", "segs": [0], "obj": "lupa"}, {"label": "mensajes enviados por Juan Durán", "segs": [1, 2], "obj": "escudo"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Respuesta a las posibles objeciones", "mensajes enviados por Juan Durán"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (8 de 9)", "ilustracion": "trio-dialogo.webp", "relleno": "investigacion-lupa.webp", "arte": {"img": "trio-dialogo.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["Conclusión y formulación de la solicitud: sintetizar las razones fácticas, probatorias y jurídicas que sustentan la solicitud y precisar nuevamente la decisión que se espera del juez.", "«La Fiscalía considera que los elementos materiales probatorios, la evidencia física y la información legalmente obtenida permiten sustentar la inferencia razonable de autoría o participación de Juan Durán, así como la existencia de un peligro para la seguridad de María Pérez, en los términos de los artículos 308 y 311 del CPP.", "Asimismo, estima que las medidas no privativas de la libertad resultan insuficientes para proteger a la víctima.", "En consecuencia, solicita que se imponga a Juan Durán medida de aseguramiento privativa de la libertad en establecimiento carcelario, por encontrarse satisfechos los presupuestos legales para su procedencia»."], "parrafo": [0, 1], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Conclusión y formulación de la solicitud", "segs": [0], "obj": "tribunal"}, {"label": "artículos 308", "segs": [1], "obj": "reloj"}, {"label": "medidas no privativas de la libertad", "segs": [2], "obj": "puertaCerrada"}, {"label": "imponga a Juan Durán medida de aseguramiento", "segs": [3], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "4.2. Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Conclusión y formulación de la solicitud", "artículos 308", "medidas no privativas de la libertad", "imponga a Juan Durán medida de aseguramiento"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para la sustentación de solicitudes y la controversia en audiencias preliminares (9 de 9)", "ilustracion": "p-dialogo-carpeta.webp", "relleno": "explica-brazos.webp", "arte": {"img": "p-dialogo-carpeta.webp", "pos": "der"}, "escenario": {"bioma": "fiscalia", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "acordeon", "segmentos": ["La justicia restaurativa constituye una forma de abordar las consecuencias derivadas de la conducta punible mediante la participación activa de la víctima y del imputado, acusado o sentenciado en la búsqueda de soluciones orientadas a atender los daños ocasionados, asumir responsabilidades y promover la reparación y la reintegración en la comunidad.", "De acuerdo con el artículo 518 CPP, el resultado restaurativo se concreta en acuerdos encaminadoa a atender las necesidades y responsabilidades individuales y colectivas de las partes y a lograr la reintegración de la víctima y del infractor en la comunidad en busca de la reparación, la restitución y el servicio a la comunidad.", "A diferencia de una aproximación exclusivamente retributiva, la justicia restaurativa procura que los intervinientes participen en la solución de las cuestiones derivadas de la actuación delictiva, con independencia de su calidad al interior del proceso (recuérdese que las víctimas son sujetos procesales, y no así partes). Sin embargo, su aplicación no supone la eliminación de las garantías procesales, la renuncia automática a la acción penal ni la sustitución de las competencias propias de las autoridades judiciales. Se trata de mecanismos regulados legalmente, cuya procedencia depende de los presupuestos establecidos de manera restrictiva."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "justicia restaurativa", "segs": [0, 1], "obj": "libros"}, {"label": "A diferencia de una aproximación exclusivamente retributiva", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "4.3. Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos", "grupo": null, "titulos_fuente": ["4.3. Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["justicia restaurativa", "A diferencia de una aproximación exclusivamente retributiva"], "titulo_genially": "Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos (1 de 2)", "ilustracion": "p-lee-libro.webp", "relleno": "explica-brazos.webp", "arte": {"img": "p-lee-libro.webp", "pos": "izq"}}, {"layout": "rejilla", "segmentos": ["Los artículos 519 y 520 CPP establecen reglas que deben observarse en la aplicación de estos mecanismos restaurativos:", "Consentimiento libre y voluntario: la participación de la víctima y del imputado, acusado o sentenciado debe ser voluntaria. Cualquiera de ellos puede retirar su consentimiento durante este tipo de actuaciones.", "Proporcionalidad de los acuerdos: las obligaciones acordadas deben ser razonables y hallar un equilibrio en torno al daño ocasionado.", "Protección de las garantías procesales: la participación del imputado, acusado o sentenciado no constituye, por sí misma, prueba de que este admite su responsabilidad penal para efectos de actuaciones posteriores.", "Imparcialidad del facilitador: quien intervenga como facilitador debe actuar imparcialmente y procurar el respeto entre los participantes.", "Asesoría jurídica: las partes tienen derecho a consultar a un abogado.", "Ausencia de coacción: antes de remitir un asunto a un programa restaurativo, el fiscal o el juez debe informar a las partes sobre sus derechos, la naturaleza del proceso y sus posibles consecuencias, y verificar que no hayan sido coaccionadas ni inducidas mediante medios desleales. Esto es una consecuencia natural del desempeño imparcial de sus funciones."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [1, 2, 3, 4, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "artículos 519 y 520 CPP", "segs": [0, 1, 2], "obj": "libros", "ilus": "captura-detenido.webp"}, {"label": "Protección de las garantías procesales", "segs": [3, 4, 5], "obj": "escudo", "ilus": "explica-brazos.webp"}, {"label": "Ausencia de coacción", "segs": [6], "obj": "tribunal", "ilus": "clasificacion-carpetas.webp"}]}], "rotulo": null, "seccion": "4.3.1. Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos", "grupo": null, "titulos_fuente": ["4.3.1. Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["artículos 519 y 520 CPP", "Protección de las garantías procesales", "Ausencia de coacción"], "titulo_genially": "Justicia restaurativa en las audiencias preliminares: mecanismos de aplicación y ejemplos prácticos (2 de 2)", "ilustracion": "p-trio-1.webp", "relleno": "sustentacion-audiencia.webp"}, {"layout": "lamina", "segmentos": ["El artículo 521 del CPP contempla tres mecanismos de justicia restaurativa:", "Conciliación preprocesal (fase de investigación)", "Conciliación en el incidente de reparación integral (fase posterior a la declaratoria de responsabilidad penal)", "Mediación (audiencias preliminares)"], "parrafo": [0, 1, 2, 3], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "artículo 521 del CPP", "segs": [0, 1, 2, 3], "obj": "tribunal", "acomp": ["lupa", "escalones"]}]}], "rotulo": null, "seccion": "4.3.2. Mecanismos de justicia restaurativa en el proceso penal", "grupo": null, "titulos_fuente": ["4.3.2. Mecanismos de justicia restaurativa en el proceso penal"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["artículo 521 del CPP"], "titulo_genially": "Mecanismos de justicia restaurativa en el proceso penal", "ilustracion": "p-explica-brazos-2.webp", "relleno": "investigacion-lupa.webp"}, {"layout": "esquema", "segmentos": ["La conciliación constituye un requisito de procedibilidad para el ejercicio de la acción penal cuando se trata de delitos querellables (artículo 74 CPP). Puede adelantarse ante el fiscal competente, un centro de conciliación o un conciliador reconocido legalmente.", "En caso de que se realice ante el fiscal, este mismo cita al querellante y al querellado a la correspondiente diligencia. Si se alcanza un acuerdo, procede el archivo de las diligencias; de lo contrario, se ejerce la acción penal, si resulta procedente, sin perjuicio de que las partes puedan acudir posteriormente a la mediación. En contraposición, si la conciliación se desarrolla ante un centro o conciliador reconocido, deberá remitirse al fiscal copia del acta para que proceda conforme al resultado obtenido.", "Puede ocurrir el evento en que alguno de los citados sea incapaz, caso en el cual deberá concurrir su representante legal. En todo caso, la inasistencia injustificada produce consecuencias distintas según el interviniente:", "La del querellante: se entiende como desistimiento de su pretensión.", "La del querellado: da lugar al ejercicio de la acción penal, si fuere procedente.", "Ejemplo: Pedro causa lesiones personales a Fanny en una discusión. Como se trata de un delito querellable, Fanny presenta querella ante la Fiscalía. Durante la audiencia de conciliación, Juan se compromete a pagar los gastos médicos y María acepta la propuesta. Al obtenerse un acuerdo a partir del mecanismo restaurativo, se archivan las diligencias."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "artículo 74", "segs": [0], "obj": "escalones"}, {"label": "este mismo cita al querellante", "segs": [1], "obj": "carpetas"}, {"label": "Puede ocurrir el evento", "segs": [2, 3, 4], "obj": "documento"}, {"label": "Ejemplo", "segs": [5], "obj": "tribunal"}]}], "rotulo": null, "seccion": "4.3.2.1. Conciliación preprocesal (Art. 522 CPP)", "grupo": null, "titulos_fuente": ["4.3.2.1. Conciliación preprocesal (Art. 522 CPP)"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["artículo 74", "este mismo cita al querellante", "Puede ocurrir el evento", "Ejemplo"], "titulo_genially": "Conciliación preprocesal (Art. 522 CPP)", "ilustracion": "corren-carpetas.webp", "relleno": "trio-dialogo.webp", "arte": {"img": "corren-carpetas.webp", "pos": "fondo"}, "escenario": {"bioma": "sala", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "acordeon", "segmentos": ["La conciliación en el incidente de reparación integral se encuentra reconocido por el artículo 521 del CPP. A diferencia de la conciliación preprocesal, no opera como requisito de procedibilidad de la acción penal, sino que tiene lugar después de emitido el sentido del fallo condenatorio, cuando la víctima, el fiscal o el Ministerio Público, a instancia de aquella, solicitan la apertura del incidente de reparación integral, conforme al artículo 102 del CPP.", "Su finalidad consiste en procurar un acuerdo sobre la reparación de los daños ocasionados con la conducta punible. Para ello, el juez de conocimiento debe convocar a los intervinientes a una audiencia en la que se (i) formula la pretensión indemnizatoria y (ii) se promueve la conciliación. Si se alcanza un acuerdo, este se incorpora a la decisión correspondiente; si fracasa, el incidente continúa conforme al procedimiento legalmente establecido.", "Ejemplo: Pedro es condenado por el delito de hurto en una sentencia que ya se encuentra en firme. Fanny, víctima del delito, promueve el incidente de reparación integral para obtener el reconocimiento de los perjuicios ocasionados. Durante la primera audiencia, Pedro y Fanny llegan a un acuerdo: el primero se compromete a pagar el valor de los bienes sustraídos, los cuales no fueron recuperados, en un plazo de un mes. El juez incorpora el acuerdo en la decisión correspondiente."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "conciliación en el incidente de reparación", "segs": [0], "obj": "escudo"}, {"label": "Su finalidad", "segs": [1], "obj": "reloj"}, {"label": "Ejemplo", "segs": [2], "obj": "libros"}]}], "rotulo": null, "seccion": "4.3.2.2. Conciliación en el incidente de reparación integral (Art. 521 CPP)", "grupo": null, "titulos_fuente": ["4.3.2.2. Conciliación en el incidente de reparación integral (Art. 521 CPP)"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["conciliación en el incidente de reparación", "Su finalidad", "Ejemplo"], "titulo_genially": "Conciliación en el incidente de reparación integral (Art. 521 CPP)", "ilustracion": "p-explica-brazos.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "p-explica-brazos.webp", "pos": "der"}}, {"layout": "esquema", "segmentos": ["La mediación es un mecanismo en el que interviene un tercero neutral, particular o servidor público designado por el Fiscal General de la Nación o su delegado, para facilitar el intercambio de opiniones entre la víctima y el imputado o acusado y procurar una solución al conflicto. Puede comprender compromisos de reparación, restitución o resarcimiento de los perjuicios; la realización o abstención de conductas determinadas; la prestación de servicios a la comunidad, o la presentación de disculpas o perdón.", "Conforme al artículo 524 del CPP, la mediación procede desde la formulación de imputación y hasta antes del inicio de la etapa de juicio oral, en los delitos perseguibles de oficio cuyo mínimo de pena no exceda de cinco (5) años de prisión. La excepción radica en que el delito sobre el cual versa la actuación se debe referir a un bien jurídico protegido que no sobrepase la órbita personal del afectad, así como que las partes acepten expresa y voluntariamente someter el asunto a una solución restaurativa.", "La mediación puede ser solicitada por la víctima o por el imputado o acusado ante el fiscal, el JCG o el juez de conocimiento, según corresponda.", "En los delitos cuyo mínimo de pena exceda de cinco años, aunque no proceda la misma actuación, sus resultados sí pueden ser considerados para el otorgamiento de determinados beneficios durante la actuación, la dosificación de la pena o el cumplimiento de la sanción.", "Ejemplo: Pedro es imputado por el delito de daño en bien ajeno (Art. 265), al ocasionar abolladuras en el vehículo de Fanny. Durante la investigación, ambos aceptan voluntariamente acudir a un mediador. En el encuentro, Pedro reconoce el daño, indicando que lo propició de manera voluntaria, y se compromete a reparar el vehículo y ofrecer disculpas. El mediador documenta el resultado y remite el informe a la autoridad correspondiente para los efectos previstos en el artículo 526 del CPP."], "parrafo": [0, 1, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "mediación", "segs": [0], "obj": "escudo"}, {"label": "artículo 524 del CPP", "segs": [1, 2], "obj": "reloj"}, {"label": "sus resultados sí", "segs": [3], "obj": "documento"}, {"label": "Ejemplo", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "4.3.2.3. Mediación (Arts. 523-527 CPP)", "grupo": null, "titulos_fuente": ["4.3.2.3. Mediación (Arts. 523-527 CPP)"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["mediación", "artículo 524 del CPP", "sus resultados sí", "Ejemplo"], "titulo_genially": "Mediación (Arts. 523-527 CPP)", "ilustracion": "dialogo-carpeta.webp", "relleno": "alto-documento.webp", "arte": {"img": "dialogo-carpeta.webp", "pos": "fondo"}, "escenario": {"bioma": "barrio", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "puntos", "segmentos": ["La incorporación de la justicia restaurativa en el curso del proceso exige reconocer que no todos sus mecanismos se desarrollan en una audiencia preliminar, ni producen los mismos efectos procesales. Mientras que la conciliación preprocesal opera como requisito de procedibilidad en los delitos querellables y la conciliación en el incidente de reparación integral, una vez se ha anunciado el sentido del fallo; la mediación puede solicitarse desde la formulación de imputación y antes del inicio del juicio oral, a través de una audiencia preliminar.", "El conocimiento de estos mecanismos, ciertamente, permite a los intervinientes identificar oportunidades legales de solución restaurativa, orientar adecuadamente a las partes y solicitar las actuaciones que correspondan, sin confundirlas con la imposición de medidas de aseguramiento, la aceptación de cargos, los preacuerdos u otras figuras jurídico-procesales.", "En particular, la justicia restaurativa no debe entenderse como una vía para imponer acuerdos a la víctima o condicionar el ejercicio de sus derechos, pues su aplicación debe preservar como principio la voluntariedad, la proporcionalidad de las obligaciones y las garantías efectivas de todos los participantes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "incorporación de la justicia restaurativa", "segs": [0], "obj": "tribunal"}, {"label": "permite a los intervinientes identificar oportunidades legales", "segs": [1, 2], "obj": "documento"}]}], "rotulo": null, "seccion": "4.3.3. Alcance de la justicia restaurativa en las audiencias preliminares", "grupo": null, "titulos_fuente": ["4.3.3. Alcance de la justicia restaurativa en las audiencias preliminares"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["incorporación de la justicia restaurativa", "permite a los intervinientes identificar oportunidades legales"], "titulo_genially": "Alcance de la justicia restaurativa en las audiencias preliminares", "ilustracion": "sustentacion-audiencia.webp", "relleno": "explica-brazos.webp"}]}</script>
