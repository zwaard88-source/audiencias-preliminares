<script type="application/json" id="datos">{"1": {"t": "Los motivos fundados y audiencias preliminares", "r": [{"h": "diligencias de afectación a derechos fundamentales", "p": [["", "Todas las diligencias de afectación a derechos fundamentales en la fase de investigación del proceso penal colombiano deben estar respaldadas en motivos fundados (sobre la exigencia de motivación como condición para la injerencia en derechos fundamentales en Colombia véase sumariamente: Guerrero, 2007, pp. 168, 342 ss.). La exigencia de motivación de las órdenes a dichas intervenciones tiene un doble fundamento normativo."], ["", "En un primer nivel, el Art. 250 inc. 1 de la CN Nacional (en adelante “CN”) indica que el ejercicio de la investigación penal requiere que medien suficientes motivos y circunstancias fácticas que conduzcan a establecer la posible existencia de un delito. Con tal requerimiento lo que se propuso el legislador fue que “las razones que motivaron al fiscal para adoptar alguna de estas medidas durante la investigación, se encuentren apoyadas por motivos razonables, y no simples sospechas” (véase Gaceta del Congreso 134 (2002), V D)."]]}, {"h": "Sentencia C-1092 de 2003", "p": [["", "Para una evaluación de los antecedentes del Acto Legislativo 03 de 2002 (véase Corte Constitucional, Sentencia C-1092 de 2003, num. 4.1.1.1.). En un segundo nivel, el Código Procesal Penal (en adelante “CPP”) incorpora la exigencia de motivos fundados frente a todas las medidas reguladas por los artículos 213 a 250 CPP."]]}, {"h": "fundamento para decretar medidas", "p": [["", "Adicionalmente, dicha motivación también se exige como fundamento para decretar medidas cautelares reales (Arts. 83 inc. 2, 91 inc. 1 y 101 inc. 1) (al respecto Restrepo, 2007, p. 73; para la diferencia del comiso frente a la extinción de dominio, la expropiación y el decomiso administrativo pp. 30 ss.) y personales (Arts. 297, 308-311 CPP), así como para adelantar interrogatorios en la investigación preliminar (Art. 282), para realizar pruebas anticipadas (Art. 284 num. 3 CPP) (Sobre el carácter excepcional de dicha medida, CConst, Sentencias C-591 de 2005, C-1154 de 2005, también Corte Suprema de Justicia, Sala Penal, Rad. 25920, sentencia"], ["", "del 21.02.2007, Consideraciones) y para la práctica de testimonio a menor de 12 años (Art. 383 inc. 2)."]]}], "ilus": "dialogo-carpeta.webp", "raiz": ""}, "4": {"t": "Una aproximación al concepto “motivos fundados”", "r": [{"h": "tratamiento dado en el CPP", "p": [["", "El tratamiento dado en el CPP a la exigencia de motivación para la orden y ejecución de medidas de investigación penal, no es homogéneo. El CPP acoge diferentes formulaciones y expresiones para referirse a la exigencia de motivos fundados. Así, por ejemplo, habla de “motivos previamente definidos en la Ley” en alusión a las razones que pueden determinar la restricción de la libertad[^2] y a la afectación del derecho a la intimidad[^3]. En otros apartes, pero también con el fin de asegurar la motivación de las medidas, el CPP utiliza de forma más concreta el término “motivos fundados”[^4]."], ["", "En el mismo sentido, pero añadiendo un adverbio de modo, el CPP usa la expresión “motivos razonablemente fundados”, tanto respecto de las medidas de investigación que no requieren autorización judicial previa como de las que sí precisan dicha autorización[^5]."]]}, {"h": "motivos razonables", "p": [["", "Junto a esto, también hay formulaciones que no incorporan la expresión “fundados”, pero hacen alusión a ello bajo la referencia “motivos razonables”[^6]. En otros casos, se hace una simple remisión a “motivos graves”[^7] o “motivos serios”[^8]. Finalmente, en el Art. 308 CPP se desarrolla una formulación que no contiene expresamente el término motivos fundados, pero sí incorpora la exigencia de motivación, al punto de indicar, incluso, la “inferencia razonable” que se debe desprender de dicha fundamentación[^9]."], ["nota", "[^2] Art. 2 inc. 1 CPP: “Libertad. (…). Nadie podrá ser molestado en su persona ni privado de su libertad sino en virtud de mandamiento escrito de autoridad judicial competente, emitido con las formalidades legales y por motivos previamente definidos en la ley”. (énfasis fuera de texto)."]]}, {"h": "Art. 14 inc. 2 CPP", "p": [["nota", "[^3] Art. 14 inc. 2 CPP:, “No podrán hacerse registros, allanamientos ni incautaciones en domicilio, residencia, o lugar de trabajo, sino en virtud de orden escrita del Fiscal General de la Nación o su delegado, con arreglo de las formalidades y motivos previamente definidos en este código. (…)”. (énfasis fuera de texto)."]]}, {"h": "medidas cautelares sobre bienes susceptibles de comiso", "p": [["nota", "[^4] Así para las medidas cautelares sobre bienes susceptibles de comiso (Art 83 inc. 2), para la suspensión y cancelación de la personería jurídica (Art. 91 inc. 1), para la suspensión y cancelación de registros obtenidos fraudulentamente (Art. 101 inc. 1), respecto del respaldo probatorio para los motivos fundados (Art. 221 inc. 1 y 3), para la prórroga de la medida de interceptación de comunicaciones (Art. 235 inc. 3), para la práctica de interrogatorio a indiciado (Art. 282), de prueba anticipada (Art. 284) y en la determinación del “peligro para la víctima” como requisito para decretar medida de aseguramiento (Art. 311)."]]}], "ilus": "", "raiz": ""}, "8": {"t": "Una aproximación al concepto “motivos fundados”", "r": [{"h": "doble fundamento constitucional", "p": [["", "Según la Corte, esta definición tiene un doble fundamento constitucional. Primero, en el Art. 28 inc. 1 a partir del cual se exige una motivación concreta para las injerencias en derechos fundamentales, específicamente la libertad personal (CConst., C-024 de 1994, num. II. 6; también sentencia C-580 de 2002, num. 3.2. Artículo 7; C-805 de 2002, num. VI. 6 ss.)."]]}, {"h": "Sentencia T-508 de 2011", "p": [["", "Segundo, en el Art. 29 que consagra como derecho fundamental el debido proceso, especialmente el inc. 3 que establece el derecho de defensa y el inc. 4 que define la nulidad de las pruebas obtenidas con violación del debido proceso (CConst., C-805 de 2002, num. VI. 30; también CConst., Sentencia T-508 de 2011; C-592 de 2005; sobre el debido proceso como derecho fundamental véase Bernal/Montealegre, 2013, T. I, pp. 81 ss.; Calle, 2000, pp. 59 ss.; para un panorama del desarrollo legal del debido proceso en el ordenamiento colombiano véase Camargo, 2002, p. 105 ss.;"], ["", "una descripción de los subprincipios vinculados al debido proceso véase en Molina, 2002, p. 295 ss.; Suárez, , 2001, p. 220 ss.; sobre la nulidad de las pruebas obtenidas con violación del debido proceso véase Molina, 2012, p. 370)."]]}, {"h": "conceptualización de la Corte Constitucional", "p": [["", "Esta posición y conceptualización de la Corte Constitucional, que es confirmada en múltiples sentencias posteriores (La posición sobre los Arts. 28 y 29 CN como límites de las disposiciones y prácticas relativas a la restricción de la libertad ha sido confirmada en reiteradas sentencias de la CConst, entre otras, las sentencias C-179 de 1994; C-327 de 1997; C-251 de 2002; C-580 de 2002, num 3.2.;"]]}, {"h": "C-025 de 2009 y C-127 de 2011", "p": [["", "C-025 de 2009 y C-127 de 2011. Sobre la captura administrativa se presentó un cambio de posición con la sentencia C-176 de 2007 en la cual la Corte Constitucional volvió a evaluar la constitucionalidad de dicha forma de captura regulada por el Decreto 1355 de 1970. Al respecto véase Cuellar/Montealegre, 2013, T. II, p. 493 s.), también es recogida en el análisis a la reforma del Art. 250. En la evaluación del inc. 1 y num. 2 de dicho Artículo, como ya se anotó, la Corte reitera los argumentos presentados en la exposición de motivos del Acto Legislativo 03 de 2002, desde el cual se estableció la necesidad de una motivación razonable, diferente"], ["", "a la sospecha, a la hora de adoptar medidas de investigación (CConst., Sentencia C-1092 de 2003, num. 4.1.1.1.)."]]}, {"h": "conjunto articulado de hechos", "p": [["", "Sobre la base de los fundamentos constitucionales y la posición tomada por la Corte Constitucional desde la sentencia C-024 de 1994, se podría concluir que motivo fundado es 1) un conjunto articulado de hechos (situación objetiva), 2) respaldados en elementos materiales probatorios (respaldo probatorio), 3) de los que se concluye objetivamente (inferencia razonable), 4) la probabilidad de autoría o participación en un hecho punible, 5) no equivalentes a la mera sospecha o simple convicción del agente policial (alto estándar de razonabilidad)."], ["", "Adicional a los elementos que se desprenden de la definición dada por la Corte Constitucional, debe decirse que en el marco del Acto Legislativo 03 de 2002 la determinación sobre lo que es un motivo fundado también pasa por la verificación ex ante o ex post por el JCG (control judicial), naturalmente, en lo que corresponde a sus competencias como juez de libertades y de garantías."]]}], "ilus": "p-explica-brazos.webp", "raiz": ""}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se
   lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana pequeña junto a ella.
   Texto literal de la escena: datos[m] = {t: título, raiz: texto del nodo central ('' si Genially ya lo dice), ilus, r: [{h: rótulo,
   p: [[clase, texto], …]}]}.
   Tercera pasada (Sebastián, 24/11/2026): en la franja ancha de Genially el mapa va con la idea al centro y las ramas a los dos
   lados; el rótulo que ya está en el arranque del párrafo no se repite (va resaltado dentro del texto); el nodo central no repite
   el título de la diapositiva; la última parte de una ventana lleva al concepto siguiente o termina (no hay botón que no lleve a nada). */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var e = document.createElement(resumen ? 'button' : 'div'); e.className = 'rama' + (leidos[k] ? ' visto' : '');
      if (resumen) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      var breve = !resumen && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '"><span class="num">' + (k + 1) + '</span><span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin"><span class="num">' + (k + 1) + '</span><span>' + marca(resumen ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3><span class="num">' + (k + 1) + '</span><span>' + esc(may(r.h)) + '</span></h3>') +
        (resumen ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (resumen) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58);
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return actual.k < N - 1
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (actual.k + 2) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = actual.k + 1; if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    if (ult) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight, ew = e.offsetWidth;
    /* al lado de la rama si hay sitio (en la franja ancha casi siempre lo hay); si no, debajo o encima */
    var gx, gy = Math.max(8, Math.min(H - gh - 8, y + e.offsetHeight / 2 - gh / 2));
    if (x + ew + 10 + gw <= W - 8) gx = x + ew + 10;
    else if (x - 10 - gw >= 8) gx = x - 10 - gw;
    else { gx = Math.min(Math.max(10, x + ew / 2 - gw / 2), W - gw - 10); gy = y + e.offsetHeight + 6; if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6); if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) gy = Math.max(8, Math.min(H - gh - 8, y)); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  /* si el marco cambia de forma (dividida ↔ franja ancha) después de cargar, el mapa se vuelve a armar para esa forma */
  window.addEventListener('resize', function () { setTimeout(function () { if (document.documentElement.classList.contains('ancho') !== ANCHO) location.reload(); }, 200); });
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
</script>
