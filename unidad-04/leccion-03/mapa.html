<title>Mapa conceptual · Lección 3. Construcción de inferencias razonables de autoría y participación</title>

<main class="lienzo" id="lienzo">
  <svg class="trazos" id="svg" aria-hidden="true"></svg>
  <div class="mc" id="mc"></div>
  <div class="globo" id="globo" role="dialog" aria-modal="false"><div class="gcab"><h3 id="gh"></h3><button class="cerrar" id="gx">Clic para cerrar <i class="fas fa-xmark" aria-hidden="true"></i></button></div><div id="gp"></div></div>

<script type="application/json" id="datos">{"1": {"t": "Construcción de inferencias razonables de autoría y participación", "r": [{"h": "evidencia física y la información legalmente", "p": [["", "El artículo 308 de la Ley 906 de 2004 exige, como punto de partida que, de los elementos materiales probatorios, la evidencia física y la información legalmente obtenida se pueda inferir razonablemente que el imputado puede ser autor o partícipe de la conducta que se investiga. La inferencia razonable es un estado de conocimiento intermedio: más que una sospecha o una mera plausibilidad, menos que la certeza. No es un pronóstico de condena. Se construye con tres piezas:"]]}, {"h": "Hechos indicadores", "p": [["", "1. Hechos indicadores: Datos del expediente que constan en un elemento de conocimiento concreto: un acta de captura, un informe técnico, una entrevista, una extracción de datos con control judicial."]]}, {"h": "Regla de conexión", "p": [["", "2. Regla de conexión: Una máxima de la experiencia, una regla de la lógica o un principio técnico que permite pasar del hecho indicador al hecho que se quiere probar."]]}, {"h": "Hecho indicado", "p": [["", "3. Hecho indicado: El hecho jurídicamente relevante de la hipótesis de autoría o participación, formulado frente a un delito concreto, porque la procedencia de la detención preventiva depende del delito (artículo 313)."]]}], "ilus": "captura-detenido.webp"}, "3": {"t": "Desarrollo conceptual y dogmático", "r": [{"h": "inferencia razonable", "p": [["", "La inferencia razonable es uno de los componentes esenciales de los motivos fundados con los que se fundamentan las diferentes medidas investigativas reguladas por el Código Procesal Penal (CPP) colombiano (Guerrero, 2007, pp. 168, 342 ss.). No sólo es el elemento de cierre en el proceso judicial de determinación de los motivos fundados, sino, además, es un fundamento especial para la decisión judicial que autoriza o convalida una medida investigativa en el proceso penal."], ["", "Como elemento de cierre, la inferencia razonable representa una conclusión del proceso de análisis (deductivo o inductivo) de la situación fáctica-objetiva que debe estar respaldada probatoriamente en alguno de los elementos de conocimiento autorizados por el CPP."]]}, {"h": "diferentes niveles de probabilidad", "p": [["", "Este tipo de conclusiones da cuenta de diferentes niveles de probabilidad (acerca de los grados de conocimiento en las diferentes etapas del proceso penal véase Suarez, 2012, pp. 307 ss.), dependiendo de la fase del proceso en que se realicen, de la medida investigativa que se trate de autorizar o convalidar y de la intensidad en la injerencia del derecho fundamental afectado con la misma."], ["", "Como fundamento especial de algunas decisiones judiciales, la inferencia razonable exige unas conclusiones especiales dependiendo de si se trata de autorizar una medida investigativa, formular imputación o de fundamentar la presentación del escrito de acusación. En el caso de la autorización a medidas investigativas, el régimen de inferencias razonables incorporado por el CPP es heterogéneo."]]}, {"h": "descubrimiento de información útil", "p": [["", "Adicional a la inferencia de autoría o participación del investigado en un hecho punible, el CPP prevé otro tipo de inferencias dirigidas a fundamentar el descubrimiento de información útil para la investigación o, incluso, a fundamentar la mera intervención sobre la ocurrencia de un hecho punible a los fines neutralizar el mismo."]]}, {"h": "objetivos extra-procesales", "p": [["", "Estos tres niveles de inferencias razonables que se incorporan en el marco de los fundamentos de autorización o convalidación de medidas investigativas, adicionalmente, predisponen el aparato de investigación penal a objetivos extra-procesales. No se trata únicamente de la injerencia en derechos fundamentales por medio de medidas investigativas a presuntos autores o participes en un delito, sino, también, de la utilización con un carácter eminentemente táctico de medidas investigativas como instrumentos de reacción penal frente a la comisión de delitos."], ["", "Esta conducción de las medidas investigativas es notoria en las actividades de investigación encubiertas reguladas por el CPP como la vigilancia y seguimiento de personas (Art. 239), vigilancia de cosas (Art. 240), análisis e infiltración de organización criminal (Art. 241), la actuación de agentes encubiertos (Art. 242) y la entrega vigilada (Art. 243)."]]}], "ilus": "explica-brazos.webp"}, "5": {"t": "Inferencias vinculadas a expectativas de hallazgo probatorio", "r": [{"h": "clasificación de las inferencias razonables", "p": [["", "En el CPP no se encuentra ninguna clasificación de las inferencias razonables, pero la regulación de cada medida investigativa incorpora una mención expresa de las mismas. Más allá de la inferencia inculpatoria[^11], el CPP prevé inferencias que sólo están vinculadas a expectativas de hallazgo probatorio[^12]."], ["", "En otras medidas el tipo de inferencia no exige que el investigado sea autor o partícipe de un hecho punible o que exista información útil para la investigación, sino que el CPP plantea inferencias como la pertenencia a una organización criminal, la intervención en un hecho punible o el uso de algunos elementos para la comisión de hechos punibles[^13]."], ["", "En estos tipos de inferencias razonables se exige una conclusión sobre la ocurrencia de un hecho punible y sólo a partir de dicha conclusión; es decir, de la inferencia razonable, se determina el fin de cada medida, que en la mayoría de los casos consiste en encontrar información útil para la investigación."]]}, {"h": "descubrimiento probatorio", "p": [["", "En ese sentido, el descubrimiento probatorio a través de una medida investigativa se plantea en unos casos como el resultado de la inferencia razonable y, en otros casos, como el fin de la medida de investigación. Este tipo de inferencias conllevan a la realización de juicios de probabilidad, ya no de carácter retrospectivo, como en la inferencia inculpatoria, sino fundamentalmente prospectivo (sobre los juicios de probabilidad como condición para la determinación de motivos fundados véase Zuluaga, 2015, pp. 189 ss.)."], ["", "El carácter prospectivo del juicio de probabilidad se realiza básicamente sobre la utilidad de la información que se recolecta como consecuencia de la ejecución de una medida investigativa. A continuación, se analizan estos dos niveles de inferencia razonable."], ["nota", "[^11] Este tipo de inferencia es propia de los registros y allanamientos (Art. 220 CPP), así como de las condiciones para formular imputación (Art. 287 CPP)."]]}, {"h": "Así en la retención de correspondencia", "p": [["nota", "[^12] Así en la retención de correspondencia (art. 233 CPP), donde directamente se exige inferir que exista información útil para la investigación, como también en la regulación a la vigilancia y seguimiento de personas (Art. 239 CPP)."], ["nota", "[^13] Es el caso de la recuperación de información producto de la transmisión de datos (Art. 236 CPP), la vigilancia de cosas (Art. 240 CPP), el análisis e infiltración de organización criminal (Art. 241 CPP), la actuación de agentes encubiertos (Art. 242 CPP), la entrega vigilada (Art. 243 CPP) y la búsqueda selectiva en bases de datos (Art. 244 CPP)."]]}], "ilus": "clasificacion-carpetas.webp"}, "8": {"t": "Inferencias razonables acerca de la realización de hechos punibles", "r": [{"h": "planificación de estas medidas", "p": [["", "En desarrollo del programa metodológico, la planificación de estas medidas debe motivar la duración de la ejecución, las facultades de los investigadores infiltrados o encubiertos y la intensidad de las injerencias que se desarrollaran en la ejecución de las mismas (Bernal/ Montealegre, 2013, T. II., p. 278)."]]}, {"h": "viabilidad de la diligencia", "p": [["", "La viabilidad de la diligencia está condicionada, además, por el seguimiento que se haga a las reglas de la cadena de custodia, con lo que se determina el valor probatorio de la información recogida por los agentes encubiertos[^15]. De esto se deduce que la información obtenida durante la investigación encubierta no puede tener cualquier uso."], ["", "Más concretamente dicho, sin la verificación de autenticidad y su aseguramiento por medio de cadena de custodia, dicha información no puede considerarse introducida al proceso; es decir, no representa un medio de conocimiento, sólo se trataría de una fuente de actividad investigativa, esto es, una información extra-procesal a partir de la cual se puede programar diligencias investigativas[^16]."]]}, {"h": "valor probatorio", "p": [["", "Estos elementos materiales probatorios o evidencia física tendrían valor probatorio sólo en la medida que su recolección e incorporación procesal se adecuen a los requisitos de legalidad y ello sido verificado por el JCG (en ese sentido y con un análisis crítico de los requisitos de autorización véase Morales, 2009, p. 247; sobre los requisitos de incorporación procesal previstos entre los Arts. 254 a 266 CPP véase FGN, 2010, pp. 23 ss.)."], ["nota", "[^15] En términos del Artículo 279 CPP, “el elemento material probatorio y evidencia física, recogidos por agente encubierto o agente infiltrado, en desarrollo de operación legalmente programada, sólo podrá ser utilizado como fuente de actividad investigativa. Pero establecida su autenticidad y sometido a cadena de custodia, tiene el valor de cualquier otro elemento material probatorio y evidencia física”."]]}, {"h": "Según el Art", "p": [["nota", "[^16] Según el Art. 277 CPP, “los elementos materiales probatorios y la evidencia física son auténticos cuando han sido detectados, fijados, recogidos y embalados técnicamente, y sometidos a las reglas de cadena de custodia”."]]}], "ilus": "corren-carpetas.webp"}, "12": {"t": "Ejercicio No. 1: Silogismo probatorio (Drag and Drop)", "r": [{"h": "Fuente", "p": [["", "Fuente: elaboración propia."]]}, {"h": "forma correcta de ubicar las figuras", "p": [["", "**Esta es la forma correcta de ubicar las figuras flotantes (verdes) con relación a los tres conceptos sobre los cuales se pretende generar una adecuada comprensión (grises).**"]]}], "ilus": "clasificacion-carpetas.webp"}, "15": {"t": "Ejercicio No. 1: Silogismo probatorio (Drag and Drop)", "r": [{"h": "Respuesta", "p": [["", "Respuesta: C. Esta opción integra los distintos elementos materiales probatorios e información legalmente obtenida para construir una inferencia razonable sobre la posible intervención de Carlos Rodríguez en el homicidio. La identificación del hombre que sostenía un objeto con apariencia de arma de fuego, a partir de la descripción suministrada por el vecino, permite establecer una primera conexión entre Carlos y la posible ejecución de la conducta."], ["", "A ello se suman su salida del inmueble treinta segundos después de la detonación, el resultado del análisis balístico y la conducta posterior de Rodríguez, que vincula técnicamente el arma incautada con el proyectil recuperado del cuerpo de la víctima."]]}, {"h": "valoración conjunta de estos elementos", "p": [["", "La valoración conjunta de estos elementos permite formular una hipótesis de autoría sustentada en circunstancias convergentes, sin atribuir a ninguno de ellos, considerado aisladamente, un alcance demostrativo con el que no cuenta. De esta manera, se satisface el estándar de inferencia razonable previsto en el artículo 308 de la Ley 906 de 2004, sin confundirlo con la certeza (al menos judicial) exigida para proferir una sentencia condenatoria (Art. 381 CPP)."]]}], "ilus": "sustentacion-audiencia.webp"}}</script>
<script src="../comun/ap-propio.js?v=408b8e1d"></script>
<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página a la izquierda y todas sus ramas a la vista.
   Si el texto cabe, se lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana
   pequeña junto a ella. Texto literal de la escena: datos[m] = {t: título, r: [{h: rótulo, p: [[clase, texto], …]}]}. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  function parrafos(p) { return p.map(function (x) { return '<p class="' + x[0] + '">' + esc(x[1]) + '</p>'; }).join(''); }
  var arriba = d.r.length > 6;
  mc.className = 'mc' + (arriba ? ' arriba' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz';
  raiz.innerHTML = '<h2>' + esc(may(d.t)) + '</h2>' + (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : '');
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var e = document.createElement(resumen ? 'button' : 'div'); e.className = 'rama' + (leidos[k] ? ' visto' : '');
      if (resumen) e.type = 'button';
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = arriba ? 78 : (d.r.length >= 5 ? 105 : 190);
      var breve = !resumen && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      e.innerHTML = breve ? '<h3 class="solo"><span class="num">' + (k + 1) + '</span><span>' + esc(may(todo)) + '</span></h3>' :
        '<h3><span class="num">' + (k + 1) + '</span><span>' + esc(may(r.h)) + '</span></h3>' +
        (resumen ? '<p>' + esc(corta(todo, lim)) + '</p><span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(r.p));
      if (resumen) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  function cabe() { return mc.scrollHeight <= mc.clientHeight + 1 && ramas.scrollHeight <= ramas.clientHeight + 1 && nodos.every(function (n) { return n.offsetTop + n.offsetHeight <= ramas.offsetTop + ramas.clientHeight + 2 || arriba; }); }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var alto = ramas.scrollHeight;
  var resumen = total > 1250 || alto > (arriba ? 400 : 452) || mc.scrollHeight > mc.clientHeight + 1;
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta tres pasos) mientras quepa */
  ['g1', 'g2', 'g3'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > (arriba ? 400 : 440) || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* ventana pequeña junto a la rama; el texto largo se lee por partes */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { var out = [], act = [], n = 0; p.forEach(function (x) { if (act.length && n + x[1].length > 620) { out.push(act); act = []; n = 0; } act.push(x); n += x[1].length; }); if (act.length) out.push(act); return out; }
  function mostrar() {
    document.getElementById('gp').innerHTML = parrafos(partes[parte]) + (partes.length > 1 ? '<div class="partes"><button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span><button class="btn-chico" id="ps"' + (parte < partes.length - 1 ? '' : ' disabled') + '>Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>' : '');
    var a = document.getElementById('pa'), s = document.getElementById('ps');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (parte === partes.length - 1 && actual) { leidos[actual.k] = 1; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance(); }
  }
  function ubicar() {
    var e = actual.e, W = lz.clientWidth, H = lz.clientHeight, r = e.getBoundingClientRect(), b = lz.getBoundingClientRect(), z = b.width / W;
    var x = (r.left - b.left) / z, y = (r.top - b.top) / z, gw = G.offsetWidth, gh = G.offsetHeight;
    var gx = Math.min(Math.max(10, x + e.offsetWidth / 2 - gw / 2), W - gw - 10), gy = y + e.offsetHeight + 6;
    if (gy + gh > H - 8) gy = Math.max(8, y - gh - 6);
    if (gy < 8 || (gy < y + e.offsetHeight && gy + gh > y)) { gy = Math.max(8, Math.min(H - gh - 8, y)); gx = x - gw - 8 > 8 ? x - gw - 8 : Math.min(W - gw - 8, x + 30); }
    G.style.left = gx + 'px'; G.style.top = gy + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() { if (!resumen) return; var n = Object.keys(leidos).length; document.getElementById('avance').innerHTML = '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + d.r.length + '</b>'; }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, R = raiz.getBoundingClientRect(), s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(R);
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect());
      if (!arriba) { var x1 = a.l + a.w, y1 = a.t + a.h / 2, x2 = c.l, y2 = c.t + c.h / 2, xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, izq = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = izq ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
</script>
