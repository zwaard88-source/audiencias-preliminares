<script type="application/json" id="datos">{"1": {"t": "Construcción de inferencias razonables de autoría y participación", "r": [{"h": "Hechos indicadores", "p": [["", "1. Hechos indicadores: Datos del expediente que constan en un elemento de conocimiento concreto: un acta de captura, un informe técnico, una entrevista, una extracción de datos con control judicial."]]}, {"h": "Regla de conexión", "p": [["", "2. Regla de conexión: Una máxima de la experiencia, una regla de la lógica o un principio técnico que permite pasar del hecho indicador al hecho que se quiere probar."]]}, {"h": "Hecho indicado", "p": [["", "3. Hecho indicado: El hecho jurídicamente relevante de la hipótesis de autoría o participación, formulado frente a un delito concreto, porque la procedencia de la detención preventiva depende del delito (artículo 313)."]]}], "ilus": "m-inferencia.webp", "intro": "El artículo 308 de la Ley 906 de 2004 exige, como punto de partida que, de los elementos materiales probatorios, la evidencia física y la información legalmente obtenida se pueda inferir razonablemente que el imputado puede ser autor o partícipe de la conducta que se investiga. La inferencia razonable es un estado de conocimiento intermedio: más que una sospecha o una mera plausibilidad, menos que la certeza. No es un pronóstico de condena. Se construye con tres piezas:", "raiz": ""}, "3": {"t": "Desarrollo conceptual y dogmático", "r": [{"h": "inferencia razonable", "p": [["", "La inferencia razonable es uno de los componentes esenciales de los motivos fundados con los que se fundamentan las diferentes medidas investigativas reguladas por el Código Procesal Penal (CPP) colombiano (Guerrero, 2007, pp. 168, 342 ss.). No sólo es el elemento de cierre en el proceso judicial de determinación de los motivos fundados, sino, además, es un fundamento especial para la decisión judicial que autoriza o convalida una medida investigativa en el proceso penal."], ["", "Como elemento de cierre, la inferencia razonable representa una conclusión del proceso de análisis (deductivo o inductivo) de la situación fáctica-objetiva que debe estar respaldada probatoriamente en alguno de los elementos de conocimiento autorizados por el CPP."]]}, {"h": "diferentes niveles de probabilidad", "p": [["", "Este tipo de conclusiones da cuenta de diferentes niveles de probabilidad (acerca de los grados de conocimiento en las diferentes etapas del proceso penal véase Suarez, 2012, pp. 307 ss.), dependiendo de la fase del proceso en que se realicen, de la medida investigativa que se trate de autorizar o convalidar y de la intensidad en la injerencia del derecho fundamental afectado con la misma."], ["", "Como fundamento especial de algunas decisiones judiciales, la inferencia razonable exige unas conclusiones especiales dependiendo de si se trata de autorizar una medida investigativa, formular imputación o de fundamentar la presentación del escrito de acusación. En el caso de la autorización a medidas investigativas, el régimen de inferencias razonables incorporado por el CPP es heterogéneo."]]}, {"h": "descubrimiento de información útil", "p": [["", "Adicional a la inferencia de autoría o participación del investigado en un hecho punible, el CPP prevé otro tipo de inferencias dirigidas a fundamentar el descubrimiento de información útil para la investigación o, incluso, a fundamentar la mera intervención sobre la ocurrencia de un hecho punible a los fines neutralizar el mismo."]]}, {"h": "objetivos extra-procesales", "p": [["", "Estos tres niveles de inferencias razonables que se incorporan en el marco de los fundamentos de autorización o convalidación de medidas investigativas, adicionalmente, predisponen el aparato de investigación penal a objetivos extra-procesales. No se trata únicamente de la injerencia en derechos fundamentales por medio de medidas investigativas a presuntos autores o participes en un delito, sino, también, de la utilización con un carácter eminentemente táctico de medidas investigativas como instrumentos de reacción penal frente a la comisión de delitos."], ["", "Esta conducción de las medidas investigativas es notoria en las actividades de investigación encubiertas reguladas por el CPP como la vigilancia y seguimiento de personas (Art. 239), vigilancia de cosas (Art. 240), análisis e infiltración de organización criminal (Art. 241), la actuación de agentes encubiertos (Art. 242) y la entrega vigilada (Art. 243)."]]}], "ilus": "", "raiz": ""}, "5": {"t": "Inferencias vinculadas a expectativas de hallazgo probatorio", "r": [{"h": "clasificación de las inferencias razonables", "p": [["", "En el CPP no se encuentra ninguna clasificación de las inferencias razonables, pero la regulación de cada medida investigativa incorpora una mención expresa de las mismas. Más allá de la inferencia inculpatoria[^11], el CPP prevé inferencias que sólo están vinculadas a expectativas de hallazgo probatorio[^12]."], ["", "En otras medidas el tipo de inferencia no exige que el investigado sea autor o partícipe de un hecho punible o que exista información útil para la investigación, sino que el CPP plantea inferencias como la pertenencia a una organización criminal, la intervención en un hecho punible o el uso de algunos elementos para la comisión de hechos punibles[^13]."], ["", "En estos tipos de inferencias razonables se exige una conclusión sobre la ocurrencia de un hecho punible y sólo a partir de dicha conclusión; es decir, de la inferencia razonable, se determina el fin de cada medida, que en la mayoría de los casos consiste en encontrar información útil para la investigación."], ["nota", "[^11] Este tipo de inferencia es propia de los registros y allanamientos (Art. 220 CPP), así como de las condiciones para formular imputación (Art. 287 CPP)."], ["nota", "[^12] Así en la retención de correspondencia (art. 233 CPP), donde directamente se exige inferir que exista información útil para la investigación, como también en la regulación a la vigilancia y seguimiento de personas (Art. 239 CPP)."], ["nota", "[^13] Es el caso de la recuperación de información producto de la transmisión de datos (Art. 236 CPP), la vigilancia de cosas (Art. 240 CPP), el análisis e infiltración de organización criminal (Art. 241 CPP), la actuación de agentes encubiertos (Art. 242 CPP), la entrega vigilada (Art. 243 CPP) y la búsqueda selectiva en bases de datos (Art. 244 CPP)."]]}, {"h": "descubrimiento probatorio", "p": [["", "En ese sentido, el descubrimiento probatorio a través de una medida investigativa se plantea en unos casos como el resultado de la inferencia razonable y, en otros casos, como el fin de la medida de investigación. Este tipo de inferencias conllevan a la realización de juicios de probabilidad, ya no de carácter retrospectivo, como en la inferencia inculpatoria, sino fundamentalmente prospectivo (sobre los juicios de probabilidad como condición para la determinación de motivos fundados véase Zuluaga, 2015, pp. 189 ss.)."], ["", "El carácter prospectivo del juicio de probabilidad se realiza básicamente sobre la utilidad de la información que se recolecta como consecuencia de la ejecución de una medida investigativa. A continuación, se analizan estos dos niveles de inferencia razonable."]]}], "ilus": "m-inferencia.webp", "raiz": ""}, "8": {"t": "Inferencias razonables acerca de la realización de hechos punibles", "r": [{"h": "planificación de estas medidas", "p": [["", "En desarrollo del programa metodológico, la planificación de estas medidas debe motivar la duración de la ejecución, las facultades de los investigadores infiltrados o encubiertos y la intensidad de las injerencias que se desarrollaran en la ejecución de las mismas (Bernal/ Montealegre, 2013, T. II., p. 278)."]]}, {"h": "viabilidad de la diligencia", "p": [["", "La viabilidad de la diligencia está condicionada, además, por el seguimiento que se haga a las reglas de la cadena de custodia, con lo que se determina el valor probatorio de la información recogida por los agentes encubiertos[^15]. De esto se deduce que la información obtenida durante la investigación encubierta no puede tener cualquier uso."], ["", "Más concretamente dicho, sin la verificación de autenticidad y su aseguramiento por medio de cadena de custodia, dicha información no puede considerarse introducida al proceso; es decir, no representa un medio de conocimiento, sólo se trataría de una fuente de actividad investigativa, esto es, una información extra-procesal a partir de la cual se puede programar diligencias investigativas[^16]."], ["nota", "[^15] En términos del Artículo 279 CPP, “el elemento material probatorio y evidencia física, recogidos por agente encubierto o agente infiltrado, en desarrollo de operación legalmente programada, sólo podrá ser utilizado como fuente de actividad investigativa. Pero establecida su autenticidad y sometido a cadena de custodia, tiene el valor de cualquier otro elemento material probatorio y evidencia física”."], ["nota", "[^16] Según el Art. 277 CPP, “los elementos materiales probatorios y la evidencia física son auténticos cuando han sido detectados, fijados, recogidos y embalados técnicamente, y sometidos a las reglas de cadena de custodia”."]]}, {"h": "valor probatorio", "p": [["", "Estos elementos materiales probatorios o evidencia física tendrían valor probatorio sólo en la medida que su recolección e incorporación procesal se adecuen a los requisitos de legalidad y ello sido verificado por el JCG (en ese sentido y con un análisis crítico de los requisitos de autorización véase Morales, 2009, p. 247; sobre los requisitos de incorporación procesal previstos entre los Arts. 254 a 266 CPP véase FGN, 2010, pp. 23 ss.)."]]}], "ilus": "m-inferencia.webp", "raiz": ""}}</script>

<script>
/* Mapa conceptual completo (pauta de Juan, 24/11/2026): la idea de la página y todas sus ramas a la vista. Si el texto cabe, se
   lee entero en el mapa; si no, cada rama muestra su comienzo y abre su texto completo en una ventana amplia (26/11/2026).
   Texto literal de la escena: datos[m] = {t: título, raiz: texto del nodo central ('' si Genially ya lo dice), ilus, r: [{h: rótulo,
   p: [[clase, texto], …]}]}.
   Tercera pasada (Sebastián, 24/11/2026): en la franja ancha de Genially el mapa va con la idea al centro y las ramas a los dos
   lados; el rótulo que ya está en el arranque del párrafo no se repite (va resaltado dentro del texto); el nodo central no repite
   el título de la diapositiva; la última parte de una ventana lleva al concepto siguiente o termina (no hay botón que no lleve a nada). */
/* Cuarta pasada (revisión como usuario, 25/11/2026): la frase que anuncia la lista va arriba (intro) y no como un concepto más; si
   los conceptos ya vienen numerados en el texto («1. …»), el círculo lleva ese número y el texto no lo repite; las llamadas de nota
   al pie («[^3]») van como superíndice y la nota, marcada como nota; ningún renglón empieza con un guion suelto. */
(function () {
  var M = JSON.parse(document.getElementById('datos').textContent), q = /[?&]m=(\d+)/.exec(location.search), d = M[q ? q[1] : Object.keys(M)[0]];
  var lz = document.getElementById('lienzo'), mc = document.getElementById('mc'), svg = document.getElementById('svg'), G = document.getElementById('globo');
  if (!d) { mc.textContent = ''; return; }
  var propios = 0;
  d.r.forEach(function (r) {
    r.p.forEach(function (x) { x[1] = String(x[1]).replace(/^[-–]\s+/, ''); });
    var t0 = r.p.length ? r.p[0][1] : '', mn = /^\[\^(\d+)\]\s*/.exec(t0), mp = /^(\d{1,2})\.\s+(?=\S)/.exec(t0) || /^\(([a-z])\)\s+(?=\S)/.exec(t0);
    if (mn) { r.nota = mn[1]; r.p[0][1] = t0.slice(mn[0].length); }
    else if (mp) { r.propio = mp[1]; r.corte = mp[0].length; propios++; }
  });
  /* la lista ya viene numerada o con letras en el texto («1. …», «(a) …»): el círculo lleva esa marca y el texto no la repite */
  if (propios >= 2) d.r.forEach(function (r) { if (r.propio) { r.p[0][1] = r.p[0][1].slice(r.corte); r.h = String(r.h).replace(/^\(([a-z])\)\s+|^\d{1,2}\.\s+/, ''); } }); else d.r.forEach(function (r) { r.propio = null; });
  function numero(r, k) {
    if (r.nota) return '<span class="num nnota" title="Nota al pie ' + r.nota + '">' + r.nota + '</span>';
    if (propios >= 2) return r.propio ? '<span class="num">' + r.propio + '</span>' : '<span class="num sin-n" aria-hidden="true"><i class="fas fa-angle-right"></i></span>';
    return '<span class="num">' + (k + 1) + '</span>';
  }
  var ANCHO = document.documentElement.classList.contains('ancho'), N = d.r.length;
  lz.setAttribute('aria-label', 'Mapa conceptual: ' + d.t);
  function may(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[\^(\d+)\]/g, '<sup>$1</sup>'); }
  function corta(t, n) { if (t.length <= n) return t; var c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ')).replace(/[,;:\s(]+$/, '') + '…'; }
  /* ¿El rótulo está en el arranque del párrafo (hasta 70 caracteres adentro)? Entonces no va aparte: se resalta donde está. */
  function donde(r) { var t = r.p.length ? r.p[0][1] : '', i = t.toLowerCase().indexOf(String(r.h).toLowerCase()); return r.h && r.h.length > 3 && i >= 0 && i <= 70 ? i : -1; }
  function marca(texto, h, i) { return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + h.length)) + '</b>' + esc(texto.slice(i + h.length)); }
  function parrafos(p, h, i) { return p.map(function (x, k) { return '<p class="' + x[0] + '">' + (h && k === 0 ? marca(x[1], h, i) : esc(x[1])) + '</p>'; }).join(''); }
  var centro = ANCHO && N >= 4, arriba = !ANCHO && N > 6, mitad = Math.ceil(N / 2);
  mc.className = 'mc' + (arriba ? ' arriba' : '') + (centro ? ' centro' : '');
  var raiz = document.createElement('div'); raiz.className = 'raiz' + (d.raiz ? '' : ' muda');
  raiz.innerHTML = (d.raiz ? '<h2>' + esc(may(d.raiz)) + '</h2>' : '') +
    (d.ilus && !arriba ? '<img class="rilus" alt="" src="../comun/ilustraciones-audiencias/' + d.ilus + '">' : (d.raiz ? '' : '<span class="rico" aria-hidden="true"><i class="fas fa-diagram-project"></i></span>'));
  var ramas = document.createElement('div'); ramas.className = 'ramas';
  mc.appendChild(raiz); mc.appendChild(ramas);
  var altoIntro = 0;
  if (d.intro) {
    var pi = document.createElement('p'); pi.className = 'intro'; pi.innerHTML = esc(d.intro); lz.insertBefore(pi, mc);
    altoIntro = pi.offsetHeight + 8; mc.style.paddingTop = (altoIntro + 14) + 'px';
  }
  var leidos = {}, nodos = [];
  function pintar(resumen) {
    ramas.innerHTML = ''; nodos = [];
    mc.classList.toggle('resumen', resumen);
    d.r.forEach(function (r, k) {
      var todo = r.p.map(function (x) { return x[1]; }).join(' ');
      var lim = ANCHO ? (N >= 7 ? 120 : 190) : (arriba ? 78 : (N >= 5 ? 105 : 190));
      /* cuarta pasada: en el mapa por ventanas, el concepto que ya cabe entero se lee ahí mismo (no lleva «Clic para leer completo») */
      var entero = resumen && r.p.length === 1 && todo.length <= lim;
      r.entero = entero; if (entero) leidos[k] = 1;
      var boton = resumen && !entero;
      var e = document.createElement(boton ? 'button' : 'div'); e.className = 'rama' + (leidos[k] && boton ? ' visto' : '') + (r.nota ? ' es-nota' : '');
      if (boton) e.type = 'button';
      if (centro) { e.style.gridColumn = k < mitad ? 1 : 3; e.style.gridRow = (k < mitad ? k : k - mitad) + 1; }
      var breve = (!resumen || entero) && todo.length <= 170 && r.p.length === 1;   /* texto corto: va solo, sin repetir su rótulo encima */
      var i = donde(r), rep = i >= 0;
      e.innerHTML = breve ? '<h3 class="solo' + (rep ? ' sin' : '') + '">' + numero(r, k) + '<span>' + (rep ? marca(todo, r.h, i) : esc(may(todo))) + '</span></h3>' :
        (rep ? '<h3 class="solo sin">' + numero(r, k) + '<span>' + marca(boton ? corta(todo, Math.max(lim + 60, i + r.h.length + 40)) : r.p[0][1], r.h, i) + '</span></h3>'
             : '<h3>' + numero(r, k) + '<span>' + esc(may(r.h)) + '</span></h3>') +
        (boton ? (rep ? '' : '<p>' + esc(corta(todo, lim)) + '</p>') + '<span class="leer">' + (leidos[k] ? '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer' : '<i class="fas fa-hand-pointer" aria-hidden="true"></i> Clic para leer completo') + '</span>' : parrafos(rep ? r.p.slice(1) : r.p));
      if (boton) e.addEventListener('click', function () { abrir(e, r, k); });
      ramas.appendChild(e); nodos.push(e);
    });
  }
  var TOPE = lz.clientHeight - (arriba ? 110 : 58) - altoIntro;
  function pasa() { return ramas.scrollHeight > TOPE || mc.scrollHeight > mc.clientHeight + 1; }
  pintar(false);
  var total = d.r.reduce(function (a, r) { return a + r.p.reduce(function (b, x) { return b + x[1].length; }, 0); }, 0);
  var resumen = total > (ANCHO ? 2300 : 1250) || pasa();
  if (resumen) pintar(true);
  /* sin huecos: si el mapa ocupa poco, la letra crece (hasta cuatro pasos) mientras quepa */
  ['g1', 'g2', 'g3', 'g4'].some(function (c) {
    mc.classList.add(c);
    if (ramas.scrollHeight > TOPE - 12 || mc.scrollHeight > mc.clientHeight + 1) { mc.classList.remove(c); return true; }
    return false;
  });
  /* Ventana amplia (Sebastián, 26/11/2026: «hacer los pop-ups más grandes para evitar muchos clicks»; estándar 2.3f): el concepto
     abre su texto completo en una ventana grande al centro del mapa, sin partes ni «Seguir leyendo»; si es largo, se desplaza y
     queda leído al llegar al final. Antes era una ventana pequeña junto a la rama que partía el texto cada 620 caracteres. */
  var partes = [], parte = 0, actual = null;
  function trozos(p) { return [p]; }
  function prox(k) { for (var j = k + 1; j < N; j++) if (!d.r[j].entero) return j; return N; }
  function sigue() {   /* al terminar un concepto: pasar al siguiente o terminar; nunca un botón que no lleva a nada */
    return prox(actual.k) < N
      ? '<button class="btn-chico" id="psig">Clic para leer el concepto ' + (prox(actual.k) + 1) + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
      : '<button class="btn-chico" id="psig"><i class="fas fa-check" aria-hidden="true"></i> Clic para terminar</button>';
  }
  function mostrar() {
    var ult = parte === partes.length - 1;
    document.getElementById('gp').innerHTML = parrafos(partes[parte], parte === 0 && actual.i >= 0 ? actual.r.h : null, actual.i) +
      '<div class="partes">' + (partes.length > 1 ? '<button class="btn-chico" id="pa"' + (parte ? '' : ' disabled') + '><i class="fas fa-arrow-left" aria-hidden="true"></i> Anterior</button><span>Parte ' + (parte + 1) + ' de ' + partes.length + '</span>' : '<span class="pq" aria-live="polite"></span>') +
      (ult ? sigue() : '<button class="btn-chico" id="ps">Seguir leyendo <i class="fas fa-arrow-right" aria-hidden="true"></i></button>') + '</div>';
    var a = document.getElementById('pa'), s = document.getElementById('ps'), sg = document.getElementById('psig');
    if (a) a.onclick = function () { parte--; mostrar(); ubicar(); };
    if (s) s.onclick = function () { parte++; mostrar(); ubicar(); };
    if (sg) sg.onclick = function () { var k = prox(actual.k); if (k < N) abrir(nodos[k], d.r[k], k); else cerrar(); };
    G.scrollTop = 0;
    if (ult) requestAnimationFrame(function () {
      if (G.scrollHeight <= G.clientHeight + 4) marcar();
      else if (!leidos[actual.k]) { var pq = G.querySelector('.pq'); if (pq) pq.innerHTML = '<i class="fas fa-angles-down" aria-hidden="true"></i> Baje para leer el texto completo'; }
    });
  }
  function marcar() {
    if (!actual || leidos[actual.k] === 2) return;
    var pq = G.querySelector('.pq'); if (pq) pq.innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído completo';
    leidos[actual.k] = 2; actual.e.classList.add('visto'); actual.e.querySelector('.leer').innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Leído · clic para releer'; avance();
  }
  G.addEventListener('scroll', function () { if (G.classList.contains('abierto') && G.scrollTop + G.clientHeight >= G.scrollHeight - 4) marcar(); }, { passive: true });
  function ubicar() {
    /* ventana amplia: al centro del mapa (26/11/2026) */
    var W = lz.clientWidth, H = lz.clientHeight, gw = G.offsetWidth, gh = G.offsetHeight;
    G.style.left = Math.max(8, (W - gw) / 2) + 'px'; G.style.top = Math.max(8, (H - gh) / 2) + 'px';
  }
  function abrir(e, r, k) { actual = { e: e, k: k, r: r, i: donde(r) }; partes = trozos(r.p); parte = 0; document.getElementById('gh').textContent = actual.i >= 0 ? 'Concepto ' + (k + 1) + ' de ' + N : may(r.h); G.classList.add('abierto'); mostrar(); ubicar(); document.getElementById('gx').focus(); }
  function cerrar() { G.classList.remove('abierto'); if (actual) actual.e.focus(); }
  document.getElementById('gx').onclick = cerrar;
  document.addEventListener('keydown', function (k) { if (k.key === 'Escape') cerrar(); });
  lz.addEventListener('click', function (ev) { if (!G.contains(ev.target) && !ev.target.closest('.rama')) G.classList.remove('abierto'); });
  function avance() {
    if (!resumen) return;
    var n = Object.keys(leidos).length;
    document.getElementById('avance').innerHTML = n >= N
      ? '<i class="fas fa-circle-check" aria-hidden="true"></i> <b>Leyó los ' + N + ' conceptos.</b> Continúe con la flecha de arriba.'
      : '<i class="fas fa-book-open-reader" aria-hidden="true"></i> Leído: <b>' + n + ' de ' + N + '</b>';
  }
  avance();
  function trazar() {
    var b = lz.getBoundingClientRect(), z = b.width / lz.clientWidth, s = '';
    function P(r) { return { l: (r.left - b.left) / z, t: (r.top - b.top) / z, w: r.width / z, h: r.height / z }; }
    var a = P(raiz.getBoundingClientRect());
    nodos.forEach(function (n, k) {
      var c = P(n.getBoundingClientRect()), x1, y1, x2, y2, xm;
      if (centro) { var izq = k < mitad; x1 = izq ? a.l : a.l + a.w; y1 = a.t + a.h / 2; x2 = izq ? c.l + c.w : c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else if (!arriba) { x1 = a.l + a.w; y1 = a.t + a.h / 2; x2 = c.l; y2 = c.t + c.h / 2; xm = (x1 + x2) / 2; s += '<path d="M' + x1 + ',' + y1 + ' C' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + x2 + ',' + y2 + '" />'; }
      else { var xc = a.l + a.w / 2, iz = c.l + c.w / 2 < xc, y = c.t + c.h / 2, xb = iz ? c.l + c.w : c.l; s += '<path d="M' + xc + ',' + (a.t + a.h) + ' L' + xc + ',' + y + ' L' + xb + ',' + y + '" />'; }
    });
    svg.innerHTML = '<g fill="none" stroke="#587E6D" stroke-width="2" stroke-linecap="round">' + s + '</g>';
  }
  /* cuarta pasada: la letra del curso llega después de la primera medida (y en Genially el marco va con zoom); si con la letra
     ya cargada el mapa no cabe, baja un paso de tamaño o pasa a leerse por ventanas. Nunca queda texto fuera del marco. */
  function reajustar() {
    function sobra() { return ramas.scrollHeight > TOPE - 2 || mc.scrollHeight > mc.clientHeight + 1; }
    ['g4', 'g3', 'g2', 'g1'].forEach(function (c) { if (sobra()) mc.classList.remove(c); });
    if (!resumen && sobra()) { resumen = true; pintar(true); avance(); }
    trazar();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(reajustar, 40); });
  setTimeout(reajustar, 1200);
  /* si el marco cambia de forma (dividida ↔ franja ancha) después de cargar, el mapa se vuelve a armar para esa forma */
  window.addEventListener('resize', function () { setTimeout(function () { if (document.documentElement.classList.contains('ancho') !== ANCHO) location.reload(); }, 200); });
  window.addEventListener('load', trazar); window.addEventListener('resize', function () { setTimeout(trazar, 80); }); setTimeout(trazar, 250); setTimeout(trazar, 900);
})();
